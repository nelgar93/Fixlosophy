<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 150" role="img" aria-label="Fixlosophy">
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-style="italic" font-weight="800" fill="#ffffff">
    <text x="12" y="96" font-size="84" textLength="298" lengthAdjust="spacingAndGlyphs">Fixlos</text>
    <text x="384" y="96" font-size="84" textLength="146" lengthAdjust="spacingAndGlyphs">phy</text>
  </g>

  <!-- bicycle wheel forming the second "o" -->
  <g>
    <circle cx="345" cy="67" r="26" fill="none" stroke="#ffffff" stroke-width="8"/>
    <circle cx="345" cy="67" r="4.5" fill="#ffffff"/>
    <g stroke="#ffffff" stroke-width="2.5" opacity="0.85">
      <line x1="345" y1="46" x2="345" y2="88"/>
      <line x1="327" y1="56" x2="363" y2="78"/>
      <line x1="327" y1="78" x2="363" y2="56"/>
    </g>
    <!-- leaf sprouting from the wheel -->
    <path d="M346 40 C 348 27 358 18 373 16 C 371 31 360 40 348 41 Z" fill="#3DBB48"/>
    <path d="M344 40 C 341 30 333 24 322 23 C 324 34 333 40 342 41 Z" fill="#2D9A38"/>
  </g>

  <!-- leaf accents on the "x" -->
  <path d="M126 44 C 129 32 139 24 153 23 C 151 37 141 45 128 46 Z" fill="#3DBB48"/>
  <path d="M124 46 C 121 37 113 31 103 30 C 105 41 113 46 122 47 Z" fill="#2D9A38"/>

  <!-- swoosh underline -->
  <path d="M28 122 Q 280 148 532 110" fill="none" stroke="#3DBB48" stroke-width="9" stroke-linecap="round"/>
</svg>
