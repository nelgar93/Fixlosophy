    if (!c) return null;
    const bookings = bookingsForCustomer(id);
    const completed = bookings.filter((b) => b.status === STATUS.Completed);
    const visits = completed.map((b) => b.slotDate).sort((a, b) => a - b);
    return {
        customer: c,
        bookings,
        // Bookings under the same email made before the account existed.
        unlinkedGuestBookings: DB.bookings
            .filter((b) => !b.customerId && b.customerEmail.toLowerCase() === c.email.toLowerCase())
            .sort((a, b) => b.slotDate - a.slotDate),
        // Split by what each note is about. bookingNotes covers the unlinked guest
        // bookings too: a note on one has no customerId, so filtering by customer
        // alone left it stored and invisible here.
        generalNotes: DB.notes
            .filter((n) => n.customerId === id && !n.bookingId)
            .sort((a, b) => b.createdAt - a.createdAt),
        bookingNotes: notesByBooking(bookings.concat(
            DB.bookings.filter((b) => !b.customerId && b.customerEmail.toLowerCase() === c.email.toLowerCase()))),
        completedCount: completed.length,
        // Completed jobs only — a pending or cancelled booking isn't money.
        lifetimeSpend: completed.reduce((sum, b) => sum + b.servicePrice, 0),
        firstVisit: visits[0] || null,
        lastVisit: visits[visits.length - 1] || null
    };
}

// NotificationService.GetRecent / UnreadCount
function notificationsFor(staffId, unreadOnly) {
    const cutoff = addDays(now(), -30);
    return DB.notifications
        .filter((n) => n.createdAt >= cutoff)
        .filter((n) => n.targetStaffId === null || n.targetStaffId === staffId)
        .map((n) => Object.assign({}, n, { isRead: isNotificationRead(n.id, staffId) }))
        .filter((n) => !unreadOnly || !n.isRead)
        .slice(0, 20);
}
const isNotificationRead = (notificationId, staffId) =>
    DB.reads.some((r) => r.notificationId === notificationId && r.staffId === staffId);
const unreadCountFor = (staffId) => notificationsFor(staffId, true).length;

// AuthService.IsValidPhone. Accepts the punctuation people write in numbers —
// spaces, brackets, dashes, dots, a leading + — and nothing else. This used to count
// digits and ignore everything around them, so "call me on 07700 900000" was stored
// and reached the dashboard as a dead Call button.
const isValidPhone = (phone) => {
    const t = (phone || '').trim();
    if (!t || t.length > 20) return false;
    if (!/^[0-9 ()+.\-]+$/.test(t)) return false;
    if (t.indexOf('+') > 0) return false;      // country-code prefix, not a suffix
    const digits = t.replace(/\D/g, '').length;
    return digits >= 7 && digits <= 15;
};

// AuthService.IsValidEmail — a whole address, not just something containing an '@'.
const isValidEmail = (email) => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test((email || '').trim());

// BookingService.CreateBooking, validation and all.
function createBooking(input) {
    const email = (input.customerEmail || '').trim().toLowerCase();
    const t = today();

    // Their own duplicate first: at one booking per slot the two conditions coincide,
    // and this is the more useful of the two answers when the clash is with themselves.
    const duplicate = DB.bookings.some((b) =>
        b.customerEmail.toLowerCase() === email &&
        sameDay(b.slotDate, input.slotDate) && b.slotTime === input.slotTime &&
        b.status !== STATUS.Cancelled);
    if (duplicate) return { error: 'You already have a booking at this time.' };

    const taken = DB.bookings.filter((b) =>
        sameDay(b.slotDate, input.slotDate) && b.slotTime === input.slotTime &&
        b.status !== STATUS.Cancelled).length;
    if (taken >= MAX_PER_SLOT)
        return { error: 'Sorry, this time slot has just been taken. Please pick another time.' };

    const upcoming = DB.bookings.filter((b) =>
        b.customerEmail.toLowerCase() === email &&
        dateOnly(b.slotDate) >= t && b.status !== STATUS.Cancelled).length;
    if (upcoming >= MAX_ACTIVE_BOOKINGS_PER_EMAIL)
        return { error: 'You already have ' + MAX_ACTIVE_BOOKINGS_PER_EMAIL +
                        ' upcoming bookings — please contact us if you need to change one.' };

    const booking = {
        id: uid('bk'),
        reference: nextReference(now()),
        createdAt: now(),
        customerName: input.customerName,
        customerEmail: (input.customerEmail || '').trim(),
        customerPhone: (input.customerPhone || '').trim(),
        serviceCategory: input.serviceCategory,
        serviceName: input.serviceName,
        servicePrice: input.servicePrice,
        slotDate: dateOnly(input.slotDate),
        slotTime: input.slotTime,
        bikeDescription: input.bikeDescription || '',
        notes: input.notes || '',
        status: STATUS.Pending,
        customerId: input.customerId || null,
        assignedStaffId: null,
        photos: (input.photos || []).map((p, i) => ({
            id: uid('photo'), bookingId: '', storagePath: p.name, createdAt: now(),
            label: p.name, dataUrl: p.dataUrl
        }))
    };
    booking.photos.forEach((p) => { p.bookingId = booking.id; });
    DB.bookings.push(booking);

    raiseNotification({
        type: 'NewBooking',
        title: 'New booking — ' + booking.serviceName,
        body: booking.customerName + ' · ' + fmt.dMMM(booking.slotDate) + ' at ' + booking.slotTime,
        linkUrl: '#/admin'
    });
    persist();
    return { booking };
}

// BookingService.CancelOwnBooking — the customer id is part of the lookup, so one
// customer can never cancel another's booking.
function cancelOwnBooking(customerId, bookingId) {
    const booking = DB.bookings.find((b) => b.id === bookingId && b.customerId === customerId);
    if (!booking) return { error: 'We couldn’t find that booking.' };
    if (booking.status === STATUS.Cancelled) return { error: 'That booking is already cancelled.' };
    if (booking.status === STATUS.Completed) return { error: 'That booking is already completed.' };

    const hoursAway = (slotStart(booking) - now()) / 36e5;
    if (hoursAway < SELF_CANCEL_CUTOFF_HOURS)
        return { error: 'This booking is less than ' + SELF_CANCEL_CUTOFF_HOURS +
                        ' hours away — please call us on ' + SITE.phoneDisplay +
                        ' so we can free the slot properly.' };

    booking.status = STATUS.Cancelled;
    raiseNotification({
        type: 'BookingCancelled',
        title: 'Booking cancelled',
        body: booking.customerName + ' cancelled ' + booking.reference + ' (' + booking.serviceName + ')',
        linkUrl: '#/admin',
        targetStaffId: booking.assignedStaffId
    });
    persist();
    return { booking };
}

// BookingService.AllowedTransitions. Forward through the job, out to Cancelled at any
// point before it is finished, and back to Confirmed from either terminal state when
// someone mis-taps. This used to be an unconditional setter.
const ALLOWED_TRANSITIONS = {
    [STATUS.Pending]:    [STATUS.Confirmed, STATUS.Cancelled],
    [STATUS.Confirmed]:  [STATUS.InProgress, STATUS.Cancelled],
    [STATUS.InProgress]: [STATUS.Completed, STATUS.Cancelled],
    [STATUS.Completed]:  [STATUS.Confirmed],   // Reopen
    [STATUS.Cancelled]:  [STATUS.Confirmed]    // Reopen
};

const canTransition = (from, to) => (ALLOWED_TRANSITIONS[from] || []).includes(to);

// BookingService.NextStage — the next step forward, or null when there isn't one.
const nextStage = (from) =>
    from === STATUS.Pending    ? STATUS.Confirmed  :
    from === STATUS.Confirmed  ? STATUS.InProgress :
    from === STATUS.InProgress ? STATUS.Completed  : null;

// Admin.razor's StageLabel — the step being taken, not the state it lands in.
const stageLabel = (next) =>
    next === STATUS.Confirmed  ? 'Confirm booking' :
    next === STATUS.InProgress ? 'Start work'      :
    next === STATUS.Completed  ? 'Mark complete'   : String(next);

// NotificationService.RaiseBookingCancelled. The real method existed but had no
// production caller at all, so the bell never showed a cancellation from either side.
// Targets the assigned mechanic, or broadcasts when nobody is assigned.
function raiseBookingCancelled(b) {
    if (!b) return;
    DB.notifications.unshift({
        id: uid('notif'), type: 'BookingCancelled', createdAt: now(),
        title: 'Booking cancelled',
        body: b.customerName + ' — ' + b.reference + ' (' + b.serviceName + ')',
        linkUrl: '#/admin', targetStaffId: b.assignedStaffId || null
    });
    persist();
}

}

/* ============================================================
   Persistence — localStorage, so edits survive a reload
   ============================================================ */

const STORAGE_KEY = 'fixlosophy-demo-v1';
let persistEnabled = true;

// Dates don't survive JSON, so they're revived by key name on the way back in.
const DATE_KEYS = ['createdAt', 'slotDate', 'appliedAt', 'readAt', 'handledAt',
                   'preferredDate', 'lastVisit', 'firstVisit', 'memberSince'];

function persist() {
    if (!persistEnabled) return;
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ db: DB, uidCounter, session: state.session }));
    } catch (e) {
        // A private window, or storage disabled. The demo works fine without it —
        // it just forgets on reload.
        persistEnabled = false;
    }
}

function restore() {
    let raw = null;
    try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { return false; }
    if (!raw) return false;
    try {
        const saved = JSON.parse(raw, (key, value) =>
            DATE_KEYS.includes(key) && typeof value === 'string' ? new Date(value) : value);
        if (!saved || !saved.db || !Array.isArray(saved.db.bookings)) return false;
        Object.assign(DB, saved.db);
        uidCounter = saved.uidCounter || 0;
        if (saved.session) state.session = saved.session;
        return true;
    } catch (e) {
        return false;
    }
}

function resetDemo() {
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) { /* nothing to clear */ }
    seed();
    state.session = { kind: 'guest', id: null };
    Object.assign(state, freshUiState());
    persist();
    location.hash = '#/';
    render();
    toast('Demo data reset.');
}

// ── Photography stand-in ────────────────────────────────────
// The shop photos live in a public Supabase bucket. A page opened from disk can
// reach it; a sandboxed embed can't, and the real site's onerror handlers simply
// hide the image — which would leave the gallery empty and untestable. So a failed
// load is swapped for a drawn placeholder instead of vanishing.
function placeholderSvg(label, w, h) {
    const svg =
        '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '">' +
        '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
        '<stop offset="0" stop-color="#1d2a1f"/><stop offset="1" stop-color="#121212"/></linearGradient></defs>' +
        '<rect width="' + w + '" height="' + h + '" fill="url(#g)"/>' +
        '<g stroke="#3DBB48" stroke-opacity="0.55" fill="none" stroke-width="3" ' +
        'transform="translate(' + (w / 2 - 60) + ',' + (h / 2 - 40) + ') scale(5)">' +
        '<circle cx="5.5" cy="17" r="3.5"/><circle cx="18.5" cy="17" r="3.5"/>' +
        '<path d="M5.5 17l4.5-9h5l3.5 9"/><path d="M10 8l4.5 9"/><path d="M13.5 5H16"/></g>' +
        '<text x="50%" y="' + (h - 26) + '" text-anchor="middle" fill="#7a7a7a" ' +
        'font-family="Helvetica,Arial,sans-serif" font-size="' + Math.max(13, Math.round(w / 42)) + '">' +
        esc(label) + '</text></svg>';
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

// A listener rather than an onerror attribute: inline handlers are blocked outright
// under a strict CSP, which is exactly the sandboxed context where the photos can't
// load in the first place. `error` doesn't bubble, so this captures.
document.addEventListener('error', (e) => {
    const el = e.target;
    if (!el || el.tagName !== 'IMG' || el.dataset.fallbackApplied) return;
    el.dataset.fallbackApplied = '1';               // never loop

    if (el.dataset.fallback === 'logo') {
        // The wordmark falls back to the text the real Logo component uses.
        el.style.display = 'none';
        if (el.nextElementSibling) el.nextElementSibling.style.display = 'inline';
        return;
    }
    el.classList.add('demo-photo');
    el.src = placeholderSvg(el.dataset.label || 'Shop photo',
                            parseInt(el.getAttribute('width'), 10) || 1200,
                            parseInt(el.getAttribute('height'), 10) || 900);
}, true);

// A site photo: the real URL, with the drawn stand-in behind it.
function photo(path, alt, w, h, extra) {
    return '<img src="' + esc(img(path)) + '" alt="' + esc(alt) + '" ' +
        'width="' + w + '" height="' + h + '" decoding="async" ' +
        'data-fallback="photo" data-label="' + esc(alt) + '" ' +
        (extra || '') + ' />';
}

// A customer's uploaded photo — never real, always drawn.
const uploadedPhotoUrl = (p) => p.dataUrl || placeholderSvg(p.label || 'Issue photo', 600, 450);

const logoImg = (imgClass, fallbackClass) =>
    '<img src="' + esc(LOGO_URL) + '" alt="Fixlosophy" class="' + esc(imgClass) + '" ' +
    'data-fallback="logo" />' +
    '<span class="' + esc(fallbackClass || '') + '" style="display:none">Fixlosophy</span>';

// ── Toast ───────────────────────────────────────────────────
// Stands in for the things the real app does out of band: the confirmation email,
// the notification push to the shop, the file download.
let toastTimer = null;
function toast(message, kind) {
    const el = document.getElementById('demo-toast');
    el.className = cls('demo-toast', kind === 'warn' && 'demo-toast--warn');
    el.textContent = message;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, 4200);
}

// Same normalisation the real action buttons use: wa.me wants international format
// with no '+' or leading zero, and a bare national number is assumed to be UK.
function whatsAppHref(phone) {
    const digits = (phone || '').replace(/\D/g, '');
    const international = digits.startsWith('00') ? digits.slice(2)
                        : digits.startsWith('0') ? '44' + digits.slice(1)
                        : digits;
    return 'https://wa.me/' + international;
}
const telHref = (phone) => (phone || '').replace(/[^\d+]/g, '');

// Admin.razor's WhatsAppHref(Booking) — the booking version carries a prefilled
// message naming the customer, reference, service and slot. CustomerDetailPanel's
// phone-only variant above is the one without it; the demo used to use that for both,
// so the dashboard's WhatsApp button opened an empty chat.
function whatsAppBookingHref(b) {
    const msg = 'Hi ' + b.customerName + ', this is Fixlosophy about your booking ' + b.reference +
                ' (' + b.serviceName + ') on ' + fmt.ddddDMMMMPlain(b.slotDate) + ' at ' + b.slotTime + '.';
    return whatsAppHref(b.customerPhone) + '?text=' + encodeURIComponent(msg);
}

// Contact.ContactModel's data annotations, as validation.
function submitContact() {
    const m = state.contact;
    const errors = {};
    if (!m.name.trim()) errors.name = 'Please enter your name.';
    if (!m.email.trim()) errors.email = 'Please enter your email.';
    else if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m.email)) errors.email = 'Please enter a valid email.';
    if (!m.message.trim()) errors.message = 'Please tell us what you\'d like to know.';
    else if (m.message.trim().length < 10) errors.message = 'Please give us a bit more detail.';

    state.contactErrors = errors;
    if (Object.keys(errors).length) { render(); return; }

    // service/preferredDate stay unset — they came off the form when it stopped being
    // a second booking flow. The fields remain on Enquiry so stored ones keep theirs.
    submitEnquiry({
        name: m.name, email: m.email, phone: m.phone,
        bikeDescription: m.bike, message: m.message
    });
    state.contactSubmittedName = m.name;
    state.contactSubmitted = true;
    state.contact = freshUiState().contact;
    render();
    toast('Enquiry stored and the shop notified — check the admin bell.');
}

/* ── Auth actions ──────────────────────────────────────────── */

function doCustomerSignIn() {
    const email = state.auth.email.trim().toLowerCase();
    const customer = DB.customers.find((c) => c.email.toLowerCase() === email);

    if (!customer || state.auth.password !== DEMO_PASSWORD) {
        state.auth.error = 'invalid';
        state.auth.notice = null;
        render();
        return;
    }
    // Unverified accounts are refused sign-in, with a resend offered.
    if (!customer.emailConfirmed) {
        state.auth.error = 'unverified';
        state.auth.notice = null;
        render();
        return;
    }
    signIn('customer', customer.id);
    navigate(state.returnUrl || '#/account');
    state.returnUrl = null;
    toast('Signed in as ' + customer.fullName + '.');
}

function doStaffSignIn() {
    const email = state.auth.email.trim().toLowerCase();
    const staff = DB.staff.find((s) => s.email.toLowerCase() === email);

    if (!staff || state.auth.password !== DEMO_PASSWORD) {
        state.auth.error = 'invalid';
        render();
        return;
    }
    if (!staff.isActive) {
        state.auth.error = 'inactive';
        render();
        return;
    }
    signIn('staff', staff.id);
    navigate('#/admin');
    toast('Signed in as ' + staff.fullName + ' (' + staff.role + ').');
}

function doRegister() {
    const a = state.auth;
    if (!a.name.trim()) { a.error = 'Please enter your name.'; render(); return; }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(a.email)) { a.error = 'Please enter a valid email address.'; render(); return; }
    if (!isValidPhone(a.phone)) { a.error = 'Please enter a valid phone number.'; render(); return; }
    if (a.password.length < MIN_PASSWORD_LENGTH) {
        a.error = 'Password must be at least ' + MIN_PASSWORD_LENGTH + ' characters.'; render(); return;
    }
    if (DB.customers.some((c) => c.email.toLowerCase() === a.email.trim().toLowerCase())) {
        a.error = 'An account with that email already exists.'; render(); return;
    }

    const customer = {
        id: uid('cust'), fullName: a.name.trim(), email: a.email.trim(), phone: a.phone.trim(),
        createdAt: now(), emailConfirmed: false, bikes: []
    };
    DB.customers.push(customer);

    // AuthService.LinkGuestBookings — bookings made under this address before the
    // account existed become theirs once they've proved they own the email.
    DB.bookings
        .filter((b) => !b.customerId && b.customerEmail.toLowerCase() === customer.email.toLowerCase())
        .forEach((b) => { b.customerId = customer.id; });

    persist();
    a.error = null;
    a.password = '';
    state.pendingVerificationId = customer.id;
    navigate('#/account/register-confirmation');
    toast('Account created. Verification email sent (demo: use the link on this page).');
}

function doDemoVerify() {
    const c = customerById(state.pendingVerificationId) ||
              DB.customers.find((x) => x.email.toLowerCase() === state.auth.email.trim().toLowerCase());
    if (c) { c.emailConfirmed = true; persist(); }
    state.auth.notice = 'verified';
    state.auth.error = null;
    navigate('#/account/login');
}

/* ============================================================
   Book.razor — the five-step booking wizard
   ============================================================ */

const categoryIcon = (category) => ({
    'Servicing Packages': 'wrench',
    'Specialist': 'bolt',
    'Components': 'link'
}[category] || 'wrench');

function viewBook() {
    const b = state.book;
    const customer = currentCustomer();

    // Prefill from the account the first time the page is opened while signed in.
    if (customer && !b.prefilled) {
        b.prefilled = true;
        b.name = customer.fullName;
        b.email = customer.email;
        b.phone = customer.phone;
        // Only auto-fill the bike when there's exactly one saved.
        b.bike = customer.bikes.length === 1 ? customer.bikes[0].makeModel : '';
    }

    let body = '';
    if (b.step === 1) body = bookStep1();
    else if (b.step === 2) body = bookStep2();
    else if (b.step === 3) body = bookStep3(customer);
    else if (b.step === 4) body = bookStep4();
    else body = bookConfirmed();

    return '' +
    pageHero('Online Booking', 'Book a Repair',
             'Pick your service, choose a time, and we\'ll have you back on the road.') +
    '<section class="section booking-section"><div class="container">' +
      (b.step < 5 ? customerAuthStrip(customer) + stepsIndicator(b.step) : '') +
      body +
    '</div></section>';
}

function customerAuthStrip(customer) {
    return '<div class="customer-auth-strip">' +
        (customer
            ? '<span>Signed in as <strong>' + esc(customer.fullName) + '</strong></span>'
            : '<span>Have an account? <a class="customer-auth-strip__link" href="#/account/login" ' +
              'data-nav data-returnurl="#/book">Sign in for faster checkout</a></span>') +
    '</div>';
}

function stepsIndicator(step) {
    const labels = ['Service', 'Schedule', 'Details', 'Review'];
    return '<div class="steps-indicator">' + labels.map((label, idx) => {
        const i = idx + 1;
        const cssState = step === i ? 'active' : step > i ? 'done' : '';
        return '<div class="step-indicator ' + cssState + '">' +
                 '<div class="step-indicator__dot"><span>' + (step > i ? icon('check') : i) + '</span></div>' +
                 '<span class="step-indicator__label">' + label + '</span>' +
               '</div>' +
               (i < 4 ? '<div class="step-indicator__line ' + (step > i ? 'done' : '') + '"></div>' : '');
    }).join('') + '</div>';
}

function bookStep1() {
    const services = serviceOptions();
    const categories = [...new Set(services.map((s) => s.category))];
    const selected = state.book.service;

    const groups = categories.map((category) =>
        '<div class="service-category-group">' +
          '<h3 class="service-category-label">' + esc(category) + '</h3>' +
          '<div class="service-pick-grid">' +
            services.filter((s) => s.category === category).map((svc) => {
                const isSelected = !!selected && selected.name === svc.name;
                return '<button type="button" class="service-pick-card ' + (isSelected ? 'selected' : '') + '" ' +
                    'aria-pressed="' + isSelected + '" data-act="pick-service" data-name="' + esc(svc.name) + '">' +
                    '<span class="service-pick-card__icon">' + icon(categoryIcon(svc.category)) + '</span>' +
                    '<span class="service-pick-card__info"><strong>' + esc(svc.name) + '</strong>' +
                      '<span>' + esc(svc.duration) + '</span></span>' +
                    '<span class="service-pick-card__price">' +
                      (svc.priceFrom > 0 ? 'From £' + svc.priceFrom : 'Quote') + '</span>' +
                    (isSelected ? '<span class="service-pick-card__check">' + icon('check') + '</span>' : '') +
                    '</button>';
            }).join('') +
          '</div>' +
        '</div>').join('');

    return '<div class="booking-card">' +
        '<h2 class="booking-card__title">Choose a Service</h2>' +
        '<p class="booking-card__subtitle">Select the type of repair or service you need.</p>' +
        groups +
        '<div class="booking-nav"><span></span>' +
          '<button class="btn btn-primary btn-lg" data-act="book-step2" ' + (selected ? '' : 'disabled') + '>' +
            'Continue ' + icon('arrow-right') + '</button>' +
        '</div>' +
    '</div>';
}

function bookStep2() {
    const b = state.book;
    const month = b.calendarMonth;
    const availability = monthAvailability(month.getFullYear(), month.getMonth());
    const daysInMonth = new Date(month.getFullYear(), month.getMonth() + 1, 0).getDate();
    // Monday-first, like the real calendar.
    const firstDay = new Date(month.getFullYear(), month.getMonth(), 1).getDay();
    const offset = firstDay === 0 ? 6 : firstDay - 1;

    let cells = ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su']
        .map((d) => '<div class="cal-head">' + d + '</div>').join('');
    for (let i = 0; i < offset; i++) cells += '<div class="cal-day cal-day--empty"></div>';

    for (let d = 1; d <= daysInMonth; d++) {
        const date = new Date(month.getFullYear(), month.getMonth(), d);
        const available = !!availability[isoDate(date)];
        const isSelected = !!b.date && sameDay(b.date, date);
        const isToday = sameDay(date, today());
        const css = cls('cal-day',
            isSelected && 'cal-day--selected',
            isToday && !isSelected && 'cal-day--today',
            available ? 'cal-day--available' : 'cal-day--disabled');
        cells += '<button type="button" class="' + css + '" ' + (available ? '' : 'disabled') +
            ' aria-pressed="' + isSelected + '" aria-label="' + esc(fmt.ddddDMMMMyyyy(date)) + '"' +
            ' data-act="pick-day" data-date="' + isoDate(date) + '">' + d + '</button>';
    }

    const atFirstMonth = month.getFullYear() === today().getFullYear() && month.getMonth() === today().getMonth();

    const slots = b.date ? availableSlots(b.date) : [];
    const slotPanel = !b.date
        ? '<div class="timeslot-prompt"><span>' + icon('calendar') + '</span>' +
          '<p>Select a date to see available time slots.</p></div>'
        : '<h4>' + esc(fmt.ddddDMMMM(b.date)) + '</h4>' +
          (slots.length === 0
            ? '<p class="timeslot-none">No slots available for this date. Please pick another day.</p>'
            : '<div class="timeslot-grid">' + slots.map((s) =>
                '<button type="button" class="timeslot ' + (b.time === s ? 'timeslot--selected' : '') + '" ' +
                'aria-pressed="' + (b.time === s) + '" data-act="pick-time" data-time="' + s + '">' + s + '</button>'
              ).join('') + '</div>');

    return '<div class="booking-card">' +
        '<h2 class="booking-card__title">Pick a Date &amp; Time</h2>' +
        '<p class="booking-card__subtitle">We\'re open ' + SITE.hoursDisplay.join(' · ') + '.</p>' +
        '<div class="schedule-grid">' +
          '<div class="calendar-wrapper">' +
            '<div class="cal-nav">' +
              '<button class="cal-nav__btn" data-act="cal-prev" ' + (atFirstMonth ? 'disabled' : '') +
                ' aria-label="Previous month">' + icon('chevron-left') + '</button>' +
              '<span class="cal-nav__title">' + fmt.MMMMyyyy(month) + '</span>' +
              '<button class="cal-nav__btn" data-act="cal-next" aria-label="Next month">' +
                icon('chevron-right') + '</button>' +
            '</div>' +
            '<div class="cal-grid">' + cells + '</div>' +
            '<div class="cal-legend">' +
              '<span class="cal-legend__dot cal-legend__dot--available"></span> Available' +
              '<span class="cal-legend__dot cal-legend__dot--selected"></span> Selected' +
              '<span class="cal-legend__dot cal-legend__dot--disabled"></span> Unavailable' +
            '</div>' +
          '</div>' +
          '<div class="timeslot-wrapper">' + slotPanel + '</div>' +
        '</div>' +
        '<div class="booking-nav">' +
          '<button class="btn btn-outline" data-act="book-step" data-step="1">' + icon('arrow-left') + ' Back</button>' +
          '<button class="btn btn-primary btn-lg" data-act="book-step3" ' +
            (b.date && b.time ? '' : 'disabled') + '>Continue ' + icon('arrow-right') + '</button>' +
        '</div>' +
    '</div>';
}

// StorageService.ValidatePhoto, applied to the files the picker hands over.
const ALLOWED_PHOTO_TYPES = ['image/jpeg', 'image/png', 'image/webp', 'image/heic'];
const MAX_PHOTO_BYTES = 8 * 1024 * 1024;
const MAX_TOTAL_PHOTO_BYTES = 16 * 1024 * 1024;

function addPhotos(fileList) {
    const b = state.book;
    b.photoError = null;
    const files = Array.from(fileList);

    if (b.photos.length + files.length > MAX_PHOTOS) {
        b.photoError = 'You can attach up to ' + MAX_PHOTOS + ' photos in total.';
        render();
        return;
    }

    let pending = files.length;
    if (!pending) return;

    files.forEach((file) => {
        const totalSoFar = b.photos.reduce((sum, p) => sum + p.size, 0);
        if (ALLOWED_PHOTO_TYPES.indexOf(file.type) < 0) {
            b.photoError = 'Photos must be JPEG, PNG, WebP or HEIC.';
            if (--pending === 0) render();
            return;
        }
        if (file.size > MAX_PHOTO_BYTES) {
            b.photoError = 'Each photo must be under 8 MB.';
            if (--pending === 0) render();
            return;
        }
        if (totalSoFar + file.size > MAX_TOTAL_PHOTO_BYTES) {
            b.photoError = 'Those photos come to more than 16 MB in total. Please attach fewer, or smaller ones.';
            if (--pending === 0) render();
            return;
        }
        // Read it here so the admin dashboard can show the real thumbnail later —
        // the equivalent of the upload to the private Supabase bucket.
        const reader = new FileReader();
        reader.onload = () => {
            b.photos.push({ name: file.name, size: file.size, dataUrl: reader.result });
            if (--pending === 0) render();
        };
        reader.onerror = () => {
            b.photoError = 'One of the selected photos couldn\'t be read.';
            if (--pending === 0) render();
        };
        reader.readAsDataURL(file);
    });
}

function exportCopy() {
    const el = document.querySelector('.demo-export__json');
    if (!el) return;

    // Selecting the text is a fallback, not an error path: the clipboard API needs a
    // secure context and a permission the embed may not carry.
    const selectInstead = () => {
        const range = document.createRange();
        range.selectNodeContents(el);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        el.focus();
        toast('Clipboard blocked here — the export is selected, so copy it with Ctrl/⌘ + C.', 'warn');
    };

    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(state.account.exportJson)
            .then(() => toast('Data export copied.'), selectInstead);
    } else {
        selectInstead();
    }
}

          '</div>' +
          (notifications.length === 0
            ? '<p class="notif__empty">' + (a.showReadNotifications ? 'Nothing in the last 30 days.' : 'All caught up.') + '</p>'
            : '<ul class="notif__list">' + notifications.map((n) =>
                '<li class="notif__item ' + (n.isRead ? '' : 'notif__item--unread') + '">' +
                  '<span class="notif__item-title">' + esc(n.title) + '</span>' +
                  '<span class="notif__item-body">' + esc(n.body) + '</span>' +
                  '<span class="notif__item-time">' + relativeTime(n.createdAt) + '</span>' +
                '</li>').join('') + '</ul>') +
          '<div class="notif__panel-foot">' +
            '<button class="notif__mark" data-act="notif-toggle-read">' +
              (a.showReadNotifications ? 'Show unread only' : 'Show read too') + '</button>' +
          '</div>' +
        '</div>';

    return '<div class="page-hero page-hero--sm page-hero--admin"><div class="container admin-hero-row">' +
        '<div><p class="section-eyebrow">' + (isAdmin() ? 'Admin Dashboard' : 'Staff Dashboard') + '</p>' +
          '<h1>Booking Management</h1></div>' +
        '<div class="admin-header-actions">' +
          '<span class="admin-header-actions__name">' + esc(staff.fullName) + ' &nbsp;·&nbsp; ' +
            '<span class="status-badge status-badge--' + (isAdmin() ? 'confirmed' : 'pending') + '">' +
              staff.role + '</span></span>' +
          '<div class="notif">' +
            '<button class="notif__bell ' + (a.bellOpen ? 'notif__bell--open' : '') + '" data-act="notif-toggle" ' +
              'aria-expanded="' + a.bellOpen + '" aria-label="Notifications, ' + unread + ' unread">' +
              icon('bell') +
              (unread > 0 ? '<span class="notif__badge">' + (unread > 99 ? '99+' : unread) + '</span>' : '') +
            '</button>' + panel +
          '</div>' +
          '<button class="btn btn-outline" data-act="signout">Sign Out</button>' +
        '</div>' +
    '</div></div>';
}

// NotificationService's short relative time — "4m", "2h", "3d".
function relativeTime(when) {
    const minutes = Math.max(0, Math.round((now() - when) / 60000));
    if (minutes < 1) return 'just now';
    if (minutes < 60) return minutes + 'm';
    const hours = Math.round(minutes / 60);
    if (hours < 24) return hours + 'h';
    return Math.round(hours / 24) + 'd';
}

function adminTabBar(tab) {
    const button = (key, label) =>
        '<button class="filter-tab ' + (tab === key ? 'active' : '') + '" data-act="admin-tab" ' +
        'data-tab="' + key + '">' + label + '</button>';

    return '<div class="admin-filter-scroll tab-bar-wrapper"><div class="admin-filter-tabs">' +
        button('calendar', 'Calendar') +
        button('bookings', 'Bookings') +
        (canSeeCustomerDetails()
            ? button('customers', 'Customers') +
              button('enquiries', 'Enquiries' + (unhandledEnquiries().length
                  ? '<span class="filter-tab__count">' + unhandledEnquiries().length + '</span>' : ''))
            : '') +
        (isAdmin() ? button('pricing', 'Pricing') + button('staff', 'Staff Management') : '') +
    '</div></div>';
}

/* Admin.razor's CloseTransientPanels. Delete-confirm, cancel-confirm, the overflow
   menu and the completion note are separate two-step flows on the same row; opening
   any one closes the others. Leaving two open at once was how a single booking could
   end up showing twelve controls. */
function resetImportState() {
    state.admin.importPreview = null;
    state.admin.importResult = null;
    state.admin.importError = null;
}

function closeTransientPanels() {
    state.admin.deleteConfirmId = null;
    state.admin.cancelConfirmId = null;
    state.admin.completeNoteBookingId = null;
}

/* ── Shared action set (Admin.razor's ActionButtons fragment) ── */

// Both the second row's wrapper and rowHasActions ask these — an empty wrapper still
// draws the gap above it.
const showContact = (b) => canSeeCustomerDetails() && isValidPhone(b.customerPhone);
const showCancel  = (b) => canManage() && canTransition(b.status, STATUS.Cancelled);

function actionButtons(b) {
    const a = state.admin;
    let out = '<div class="booking-actions">';

    // Tier 1 — the one thing you came here to do. Confirm / In Progress / Complete
    // were three differently-coloured buttons for what is really one control.
    // Reopen takes the same slot on a cancelled or completed booking: those have no
    // next stage, and reopening is the only thing left to do with them. It used to
    // hide in an overflow menu, which is gone.
    const next = canManage() ? nextStage(b.status) : null;
    if (next) {
        const act = next === STATUS.Completed ? 'admin-complete-start' : 'admin-status';
        out += '<button class="action-btn action-btn--primary booking-actions__primary" data-act="' + act +
               '" data-id="' + b.id + '" data-status="' + next + '">' + stageLabel(next) + '</button>';
    } else if (canManage() && canTransition(b.status, STATUS.Confirmed)) {
        out += '<button class="action-btn action-btn--primary booking-actions__primary" ' +
               'data-act="admin-reopen" data-id="' + b.id + '">' + icon('undo') + ' Reopen booking</button>';
    }

    // Tier 2 — reaching the customer, and calling the job off. Cancel spent a release
    // behind a "…" menu: three taps for the second most common thing done to a
    // booking. The contact links take the larger share of the row because they are
    // used far more often; Cancel is deliberately the narrow one, and still asks.
    if (showContact(b) || showCancel(b)) {
        out += '<div class="booking-actions__row">';
        // The booking form has required a phone for a while, so in practice both links
        // always render. isValidPhone rather than a blank check because older rows
        // predate that, and a value with no dialable digits produced a dead wa.me/ link.
        if (showContact(b)) {
            out += '<a class="action-btn action-btn--whatsapp" href="' + whatsAppBookingHref(b) +
                   '" target="_blank" rel="noopener" title="WhatsApp ' + esc(b.customerName) + '">' +
                   icon('whatsapp') + ' <span class="action-btn__label">WhatsApp</span></a>';
            out += '<a class="action-btn action-btn--call" href="tel:' + telHref(b.customerPhone) +
                   '" title="Call ' + esc(b.customerName) + '">' + icon('phone') +
                   ' <span class="action-btn__label">Call</span></a>';
        }
        if (showCancel(b))
            out += '<button class="action-btn action-btn--cancel" data-act="admin-cancel-start" data-id="' +
                   b.id + '">Cancel</button>';
        out += '</div>';
    }
    out += '</div>';

    // Cancel now cannot be undone except by Reopen, so it gets the same two-step
    // confirm Delete has always had. It used to fire on a single click.
    if (a.cancelConfirmId === b.id) {
        out += '<div class="booking-confirm">' +
            '<p class="booking-confirm__text">Cancel <strong>' + esc(b.reference) + '</strong> and free the slot?' +
              (b.customerEmail ? ' <span>' + esc(b.customerName) + ' will be emailed.</span>' : '') + '</p>' +
            '<div class="booking-confirm__actions">' +
              '<button class="action-btn action-btn--danger" data-act="admin-cancel" data-id="' + b.id +
                '">Yes, cancel it</button>' +
              '<button class="action-btn action-btn--keep" data-act="admin-cancel-keep">Keep booking</button>' +
            '</div></div>';
    }

    // Sits on its own line below the buttons, so it reads as a step rather than
    // another control crammed into the row.
    if (a.completeNoteBookingId === b.id) {
        // Per-booking id: the mobile cards and the desktop table are BOTH always in the
        // DOM, so a literal id put two elements with the same id on the page.
        const noteId = 'complete-note-' + b.id;
        out += '<div class="complete-note">' +
            '<label class="complete-note__label" for="' + noteId + '">Add a note about this job ' +
              '<span class="complete-note__optional">(optional)</span></label>' +
            '<textarea id="' + noteId + '" class="form-control" rows="3" data-model="admin.completeNoteBody" ' +
              'placeholder="e.g. rear hub has play — worth replacing next service">' + esc(a.completeNoteBody) + '</textarea>' +
            '<label class="complete-note__share">' +
              '<input type="checkbox" data-act="admin-complete-share" ' + (a.completeNoteVisible ? 'checked' : '') + ' />' +
              '<span>Share this with the customer</span></label>' +
            '<p class="complete-note__hint">' +
              (a.completeNoteVisible
                ? 'They\'ll see it on this booking in their account.'
                : 'Staff only — not shown to the customer.') + '</p>' +
            '<div class="complete-note__actions">' +
              '<button class="action-btn action-btn--primary" data-act="admin-complete-save" data-id="' + b.id + '">' +
                (a.completeNoteBody.trim() ? 'Save note &amp; complete' : 'Complete without a note') + '</button>' +
              '<button class="action-btn action-btn--keep" data-act="admin-complete-back">Back</button>' +
            '</div>' +
        '</div>';
    }
    return out;
}

// Admin.razor's DangerZone. Delete used to sit in the action strip, one tap from
// Cancel and wearing the same red. They are not peers: Cancel keeps the record,
// Delete removes the row and its photos for good. Admin-only, in the expanded detail.
function dangerZone(b) {
    if (!isAdmin()) return '';
    const a = state.admin;
    if (a.deleteConfirmId === b.id) {
        return '<div class="booking-danger">' +
            '<p class="booking-danger__text">Permanently delete <strong>' + esc(b.reference) + '</strong> and its ' +
              "photos? This can't be undone — use Cancel if you just want to free the slot.</p>" +
            '<div class="booking-danger__actions">' +
              '<button class="action-btn action-btn--danger" data-act="admin-delete" data-id="' + b.id +
                '">Delete permanently</button>' +
              '<button class="action-btn action-btn--keep" data-act="admin-delete-keep">Keep</button>' +
            '</div></div>';
    }
    return '<div class="booking-danger">' +
        '<button class="action-btn action-btn--delete" data-act="admin-delete-start" data-id="' + b.id + '">' +
          icon('trash') + ' Delete booking</button></div>';
}

// canManage() always yields at least the primary button: every status either has a
// next stage or can be reopened.
const rowHasActions = (b) => canManage() || showContact(b);

function jobNotesBlock(bookingId) {
    const notes = notesForBooking(bookingId);
    if (notes.length === 0) return null;
    return '<span class="booking-notes">' + notes.map((n) =>
        '<span class="booking-note ' + (n.visibleToCustomer ? 'booking-note--shared' : '') + '">' +
          esc(n.body) +
          '<span class="text-faint-sm">' + (n.visibleToCustomer ? 'shared with customer' : 'internal') +
            ' &middot; ' + fmt.dMMM(n.createdAt) + '</span>' +
        '</span>').join('') + '</span>';
}

function photoThumbs(b) {
    if (!b.photos.length) return '';
    return '<div class="admin-photo-thumbs">' + b.photos.map((p) =>
        '<a href="' + uploadedPhotoUrl(p) + '" target="_blank" rel="noopener noreferrer">' +
        '<img src="' + uploadedPhotoUrl(p) + '" class="admin-photo-thumb" alt="Issue photo" /></a>').join('') +
    '</div>';
}

const staffOptions = (selectedId) =>
    '<option value="">— Unassigned —</option>' +
    DB.staff.filter((s) => s.isActive).map((s) =>
        '<option value="' + s.id + '"' + (selectedId === s.id ? ' selected' : '') + '>' +
        esc(s.fullName) + '</option>').join('');

/* ── Bookings tab ──────────────────────────────────────────── */

function adminBookingsTab() {
    const a = state.admin;
    const scoped = scopeStaffId();
    const all = scoped ? DB.bookings.filter((b) => b.assignedStaffId === scoped) : DB.bookings;
    const stats = statsFor(all);
    const page = bookingsPage(scoped, a.filter, a.search, a.page, PAGE_SIZE, a.sort);
    const totalPages = Math.max(1, Math.ceil(page.total / PAGE_SIZE));
    const todays = all.filter((b) => sameDay(b.slotDate, today()))
                      .sort((x, y) => x.slotTime.localeCompare(y.slotTime));

    const statTiles =
        '<div class="admin-stats">' +
          '<div class="admin-stat"><div class="admin-stat__number">' + stats.total + '</div>' +
            '<div class="admin-stat__label">' + (canViewAllBookings() ? 'Total' : 'Assigned') + '</div></div>' +
          '<div class="admin-stat admin-stat--highlight"><div class="admin-stat__number">' + stats.today + '</div>' +
            '<div class="admin-stat__label">Today</div></div>' +
          '<div class="admin-stat"><div class="admin-stat__number">' + stats.pending + '</div>' +
            '<div class="admin-stat__label">Pending</div></div>' +
          '<div class="admin-stat"><div class="admin-stat__number">' + stats.confirmed + '</div>' +
            '<div class="admin-stat__label">Confirmed</div></div>' +
        '</div>';

    const filters =
        '<div class="admin-filters">' +
          '<div class="admin-filter-scroll"><div class="admin-filter-tabs">' +
            ADMIN_FILTERS.map((f) =>
              '<button class="filter-tab ' + (a.filter === f ? 'active' : '') + '" data-act="admin-filter" ' +
              'data-filter="' + esc(f) + '">' + f + '</button>').join('') +
          '</div></div>' +
          '<div class="admin-search">' +
            '<label class="sr-only" for="booking-search">Search bookings</label>' +
            '<input id="booking-search" class="form-control" type="text" placeholder="Search name, ref, service…" ' +
            'data-model="admin.search" data-live value="' + esc(a.search) + '" />' +
          '</div>' +
          '<div class="admin-sort">' +
            '<label class="sr-only" for="booking-sort">Sort bookings</label>' +
            '<select id="booking-sort" class="form-control" data-act="admin-sort">' +
              SORT_OPTIONS.map((o) =>
                '<option value="' + o + '"' + (a.sort === o ? ' selected' : '') + '>' +
                sortLabel(o) + '</option>').join('') +
            '</select>' +
          '</div>' +
        '</div>';

    const todaySchedule = (todays.length && a.filter === 'All')
        ? '<div class="today-schedule"><h3>' + icon('clock') + ' Today\'s Schedule</h3><div class="today-slots">' +
            todays.map((b) =>
              '<div class="today-slot"><span class="today-slot__time">' + b.slotTime + '</span>' +
                '<span class="today-slot__name">' + esc(b.customerName) + '</span>' +
                '<span class="today-slot__service">' + esc(b.serviceName) + '</span>' +
                statusBadge(b.status) + '</div>').join('') +
          '</div></div>'
        : '';

    // A search that matches nothing used to remove the cards, the pager AND the whole
    // table, column headers included. The table is the thing being searched, so it
    // stays put and says it found nothing.
    const empty = a.search.trim() ? 'No bookings match \u201c' + esc(a.search.trim()) + '\u201d.'
                : a.filter !== 'All' ? 'No ' + a.filter.toLowerCase() + ' bookings.'
                : 'No bookings yet.';

    return statTiles + filters + todaySchedule +
        adminBookingCards(page.items, empty) +
        (totalPages > 1 ? pager('Booking pages', a.page, totalPages, page.total, 'booking', 'admin-page') : '') +
        adminBookingTable(page.items, empty);
}

function adminBookingCards(bookings, emptyMessage) {
    const a = state.admin;
    const emptyBlock = bookings.length ? '' : '<div class="admin-empty"><p>' + emptyMessage + '</p></div>';
    return '<div class="admin-cards">' + emptyBlock + bookings.map((b) => {
        const isOpen = a.expandedId === b.id;
        const detailRow = (label, value) =>
            '<div class="admin-card__detail-row"><span>' + label + '</span><span>' + value + '</span></div>';

        let detail = '';
        if (isOpen) {
            const notes = jobNotesBlock(b.id);
            detail = '<div class="admin-card__detail">' +
                (canSeeCustomerDetails()
                    ? detailRow('Email', esc(b.customerEmail)) +
                      (b.customerPhone ? detailRow('Phone', esc(b.customerPhone)) : '')
                    : '') +
                (b.bikeDescription ? detailRow('Bike', esc(b.bikeDescription)) : '') +
                (b.notes ? detailRow('Notes', esc(b.notes)) : '') +
                (notes ? detailRow('Job notes', notes) : '') +
                (b.photos.length ? detailRow('Photos', photoThumbs(b)) : '') +
                detailRow('Price', b.servicePrice > 0 ? 'From £' + b.servicePrice : 'Quote') +
                detailRow('Booked', fmt.dMMMHHmm(b.createdAt)) +
                (isAdmin()
                    ? '<div class="admin-card__detail-row"><span>Assign to</span>' +
                      '<select class="form-control form-control--compact" data-act="admin-assign" data-id="' + b.id + '">' +
                      staffOptions(b.assignedStaffId) + '</select></div>'
                    : '') +
                dangerZone(b) +
            '</div>';
        }

        return '<div class="admin-card ' + (isOpen ? 'admin-card--open' : '') + '" data-act="admin-expand" data-id="' + b.id + '">' +
            '<div class="admin-card__header">' + refBadge(b.reference) +
              '<div class="admin-card__header-right">' + statusBadge(b.status) +
                '<span class="admin-card__chevron ' + (isOpen ? 'open' : '') + '">' + icon('chevron-right') + '</span>' +
              '</div></div>' +
            '<div class="admin-card__name">' + esc(b.customerName) + '</div>' +
            '<div class="admin-card__meta"><span>' + esc(b.serviceName) + '</span>' +
              '<span>' + fmt.dMMM(b.slotDate) + ' &middot; ' + b.slotTime + '</span></div>' +
            detail +
            (rowHasActions(b) ? '<div class="admin-card__actions" data-stop>' + actionButtons(b) + '</div>' : '') +
        '</div>';
    }).join('') + '</div>';
}

function adminBookingTable(bookings, emptyMessage) {
    const a = state.admin;
    const columnCount = 5 + (isAdmin() ? 1 : 0) + ((canManage() || canSeeCustomerDetails()) ? 1 : 0);

    const rows = bookings.map((b) => {
        let row = '<tr class="' + (a.expandedId === b.id ? 'row-expanded' : '') + '" data-act="admin-expand" data-id="' + b.id + '">' +
            '<td>' + refBadge(b.reference) + '</td>' +
            '<td><div class="customer-cell"><strong>' + esc(b.customerName) + '</strong>' +
              (canSeeCustomerDetails() ? '<span>' + esc(b.customerEmail) + '</span>' : '') + '</div></td>' +
            '<td><div class="service-cell"><strong>' + esc(b.serviceName) + '</strong>' +
              '<span>' + (b.servicePrice > 0 ? '£' + b.servicePrice : 'Quote') + '</span></div></td>' +
            '<td><div class="date-cell"><strong>' + fmt.dMMMyyyy(b.slotDate) + '</strong>' +
              '<span>' + b.slotTime + '</span></div></td>' +
            '<td>' + statusBadge(b.status) + '</td>' +
            (isAdmin()
                ? '<td data-stop><select class="form-control form-control--compact form-control--assign" ' +
                  'data-act="admin-assign" data-id="' + b.id + '">' + staffOptions(b.assignedStaffId) + '</select></td>'
                : '') +
            ((canManage() || canSeeCustomerDetails())
                ? '<td data-stop><div class="action-buttons">' + actionButtons(b) + '</div></td>'
                : '') +
        '</tr>';

        if (a.expandedId === b.id && canSeeCustomerDetails()) {
            const notes = jobNotesBlock(b.id);
            row += '<tr class="row-detail"><td colspan="' + columnCount + '">' +
              '<div class="booking-detail"><div class="booking-detail__grid">' +
                '<div><strong>Phone</strong><span>' + (b.customerPhone ? esc(b.customerPhone) : '—') + '</span></div>' +
                '<div><strong>Bike</strong><span>' + (b.bikeDescription ? esc(b.bikeDescription) : '—') + '</span></div>' +
                '<div><strong>Booked</strong><span>' + fmt.dMMMyyyyHHmm(b.createdAt) + '</span></div>' +
                '<div><strong>Notes</strong><span>' + (b.notes ? esc(b.notes) : '—') + '</span></div>' +
                '<div><strong>Job notes</strong>' + (notes || '<span>—</span>') + '</div>' +
              '</div>' +
              (b.photos.length ? '<div class="booking-detail__photos"><strong>Photos</strong>' + photoThumbs(b) + '</div>' : '') +
              dangerZone(b) +
              '</div></td></tr>';
        }
        return row;
    }).join('');

    return '<div class="admin-table-wrapper admin-table-wrapper--desktop-only"><table class="admin-table">' +
        '<thead><tr><th>Reference</th><th>Customer</th><th>Service</th><th>Date &amp; Time</th><th>Status</th>' +
          (isAdmin() ? '<th>Assigned To</th>' : '') +
          ((canManage() || canSeeCustomerDetails()) ? '<th class="col-actions">Actions</th>' : '') +
        '</tr></thead><tbody>' +
          (bookings.length ? '' :
            '<tr class="admin-table__empty-row"><td colspan="' + columnCount + '">' +
            emptyMessage + '</td></tr>') +
          rows +
        '</tbody></table></div>';
}

// Explicit prev/next rather than infinite scroll: on a phone, infinite scroll makes
// anything below the list unreachable.
function pager(label, page, totalPages, total, noun, action) {
    return '<nav class="pager" aria-label="' + label + '">' +
        '<button class="btn btn-outline pager__btn" ' + (page === 0 ? 'disabled' : '') +
          ' data-act="' + action + '" data-page="' + (page - 1) + '">' + icon('arrow-left') + ' Previous</button>' +
        '<span class="pager__status" aria-live="polite">Page ' + (page + 1) + ' of ' + totalPages +
          ' &middot; ' + total + ' ' + noun + (total === 1 ? '' : 's') + '</span>' +
        '<button class="btn btn-outline pager__btn" ' + (page >= totalPages - 1 ? 'disabled' : '') +
          ' data-act="' + action + '" data-page="' + (page + 1) + '">Next ' + icon('arrow-right') + '</button>' +
    '</nav>';
}

/* ── Calendar tab ──────────────────────────────────────────── */

function adminCalendarTab() {
    const a = state.admin;
    const day = a.calDay;
    const scoped = scopeStaffId();
    let dayBookings = bookingsByDate(day);
    if (scoped) dayBookings = dayBookings.filter((b) => b.assignedStaffId === scoped);

    const pending = dayBookings.filter((b) => b.status === STATUS.Pending).length;

    const slots = slotsFor(day).map((slot) => {
        const inSlot = dayBookings.filter((b) => b.slotTime === slot);
        const content = inSlot.length === 0
            ? '<span class="day-cal-slot__free">Free</span>'
            : inSlot.map((b) =>
                '<div class="day-cal-booking ' + (b.status === STATUS.Cancelled ? 'day-cal-booking--cancelled' : '') + '">' +
                  '<div class="day-cal-booking__info">' +
                    '<div class="day-cal-booking__head"><strong>' + esc(b.customerName) + '</strong>' +
                      refBadge(b.reference) + statusBadge(b.status) + '</div>' +
                    '<div class="day-cal-booking__meta"><span>' + esc(b.serviceName) + '</span>' +
                      (b.bikeDescription ? '<span> &middot; ' + esc(b.bikeDescription) + '</span>' : '') +
                      (canSeeCustomerDetails() && b.customerPhone ? '<span> &middot; ' + esc(b.customerPhone) + '</span>' : '') +
                    '</div>' +
                    (b.notes ? '<div class="day-cal-booking__notes">' + esc(b.notes) + '</div>' : '') +
                  '</div>' +
                  (rowHasActions(b) ? '<div class="day-cal-booking__actions">' + actionButtons(b) + '</div>' : '') +
                '</div>').join('');

        return '<div class="day-cal-slot ' + (inSlot.length === 0 ? 'day-cal-slot--free' : '') + '">' +
            '<div class="day-cal-slot__time">' + slot + '</div>' +
            '<div class="day-cal-slot__content">' + content + '</div>' +
        '</div>';
    }).join('');

    return '<div class="day-cal">' +
        '<div class="day-cal__nav">' +
          '<div class="day-cal__nav-main">' +
            '<button class="cal-nav__btn" data-act="admin-cal-day" data-delta="-1" aria-label="Previous day">' +
              icon('chevron-left') + '</button>' +
            '<div class="day-cal__title">' +
              '<strong class="day-cal__date day-cal__date--full">' + fmt.ddddDMMMMyyyy(day) + '</strong>' +
              '<strong class="day-cal__date day-cal__date--short">' + fmt.dddDMMM(day) + '</strong>' +
              (sameDay(day, today()) ? '<span class="status-badge status-badge--confirmed">Today</span>' : '') +

// RFC 4180: quoted fields, commas and newlines inside quotes, "" as an escape, a BOM,
// and either line ending. Port of Services/CsvReader.cs.
function parseCsv(text) {
    const rows = [];
    if (!text) return rows;
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);

    let row = [], field = '', inQuotes = false, quoted = false;
    const finish = () => { const v = quoted ? field : field.trim(); field = ''; quoted = false; return v; };

    for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (inQuotes) {
            if (c !== '"') { field += c; continue; }
            if (text[i + 1] === '"') { field += '"'; i++; } else inQuotes = false;
            continue;
        }
        if (c === '"') { inQuotes = true; quoted = true; }
        else if (c === ',') row.push(finish());
        else if (c === '\r' || c === '\n') {
            if (c === '\r' && text[i + 1] === '\n') i++;
            row.push(finish());
            rows.push(row); row = [];
        } else field += c;
    }
    if (field.length || quoted || row.length) { row.push(finish()); rows.push(row); }
    while (rows.length && rows[rows.length - 1].every((f) => !f.trim())) rows.pop();
    return rows;
}

const IMPORT_MAX_ROWS = 5000;
const EMAIL_HEADERS = ['email', 'email address', 'e-mail'];
const NAME_HEADERS  = ['name', 'full name', 'fullname', 'customer name', 'customer'];
const PHONE_HEADERS = ['phone', 'phone number', 'mobile', 'telephone', 'tel'];
const IMPORT_TEMPLATE = 'email,name,phone\njane@example.com,Jane Smith,07700 900000\n';

const headerIndex = (header, names) =>
    header.findIndex((h) => names.includes(h.trim().toLowerCase()));

// CustomerImportService.Preview — classifies every row, writes nothing.
function importPreview(csv) {
    const rows = parseCsv(csv);
    if (!rows.length) return { rows: [], unknownHeaders: [], fatalError: 'That file is empty.' };

    const header = rows[0];
    const emailCol = headerIndex(header, EMAIL_HEADERS);
    if (emailCol < 0) {
        return { rows: [], unknownHeaders: [], fatalError:
            "No 'email' column found. The first row must be a header — download the template to see the expected columns." };
    }
    const nameCol = headerIndex(header, NAME_HEADERS);
    const phoneCol = headerIndex(header, PHONE_HEADERS);
    const known = [emailCol, nameCol, phoneCol];
    const unknownHeaders = header
        .map((h, i) => ({ h, i }))
        .filter((x) => !known.includes(x.i) && x.h.trim())
        .map((x) => x.h.trim());

    const body = rows.slice(1);
    if (body.length > IMPORT_MAX_ROWS) {
        return { rows: [], unknownHeaders, fatalError:
            'That file has ' + body.length.toLocaleString() + ' rows. The importer takes up to ' +
            IMPORT_MAX_ROWS.toLocaleString() + ' at a time.' };
    }

    const at = (r, i) => (i >= 0 && i < r.length ? r[i] : '');
    const seen = new Set();
    const out = [];

    body.forEach((raw, i) => {
        const line = i + 2;
        if (raw.every((f) => !f.trim())) return;   // blank line, not a row

        const email = at(raw, emailCol), name = at(raw, nameCol), phone = at(raw, phoneCol);

        if (!isValidEmail(email)) {
            out.push({ line, email, name, phone, outcome: 'Invalid', fills: [],
                problem: email.trim() ? "That email address isn't usable." : 'No email address.' });
            return;
        }
        // Phone is optional on import — unlike registration, where the shop needs a way
        // to reach someone about a booking they just made.
        if (phone.trim() && !isValidPhone(phone)) {
            out.push({ line, email, name, phone, outcome: 'Invalid', fills: [],
                problem: "That phone number isn't usable." });
            return;
        }

        const norm = email.trim().toLowerCase();
        if (seen.has(norm)) {
            out.push({ line, email: norm, name, phone, outcome: 'DuplicateInFile', fills: [],
                problem: 'Already appears earlier in this file.' });
            return;
        }
        seen.add(norm);

        const current = DB.customers.find((c) => c.email.toLowerCase() === norm);
        if (!current) {
            out.push({ line, email: norm, name: name.trim(), phone: phone.trim(), outcome: 'Create', fills: [] });
            return;
        }
        // Fill blanks only: the live record is more current than an old export.
        const fills = [];
        if (!current.fullName.trim() && name.trim()) fills.push('name');
        if (!current.phone.trim() && phone.trim()) fills.push('phone');
        out.push({ line, email: norm, name: name.trim(), phone: phone.trim(),
            outcome: fills.length ? 'Update' : 'Unchanged', fills });
    });

    return { rows: out, unknownHeaders, fatalError: null };
}

const importCountOf = (preview, outcome) => preview.rows.filter((r) => r.outcome === outcome).length;
const importActionable = (preview) => preview.rows.filter((r) => r.outcome === 'Create' || r.outcome === 'Update');

// CustomerImportService.Commit.
function importCommit(preview) {
    let created = 0, updated = 0, adopted = 0;

    importActionable(preview).forEach((row) => {
        if (row.outcome === 'Create') {
            const customer = {
                id: uid('cust'), email: row.email, fullName: row.name, phone: row.phone,
                // No password until they claim it, and explicitly unconfirmed.
                createdAt: now(), emailConfirmed: false
            };
            DB.customers.push(customer);
            created++;
            // Adopts their guest bookings, as AuthService.LinkGuestBookings does.
            DB.bookings.filter((b) => !b.customerId && b.customerEmail.toLowerCase() === row.email)
                .forEach((b) => { b.customerId = customer.id; adopted++; });
            return;
        }
        const existing = DB.customers.find((c) => c.email.toLowerCase() === row.email);
        if (!existing) return;
        if (row.fills.includes('name')) existing.fullName = row.name;
        if (row.fills.includes('phone')) existing.phone = row.phone;
        updated++;
    });

    persist();
    return { created, updated, adopted };
}

// CustomerDetailPanel.razor
// CustomerImportPanel.razor. Three states: pick a file, review what it will do, see
// what it did. Nothing is written until the review has been seen.
function customerImportPanel() {
    const a = state.admin;
    let out = '<div class="import-panel">' +
        '<button class="btn btn-outline customer-detail__back" data-act="admin-import-close">' +
          icon('arrow-left') + ' Back to customers</button>' +
        '<h3 class="import-panel__title">Import customers</h3>';

    if (!a.importResult) {
        out += '<p class="import-panel__intro">A CSV with an <code>email</code> column, plus ' +
            '<code>name</code> and <code>phone</code> if you have them. Existing customers are ' +
            'matched on their email address and left alone, except to fill in details you have ' +
            'and we don\'t. <a href="data:text/csv;charset=utf-8,' + encodeURIComponent(IMPORT_TEMPLATE) +
            '" download="fixlosophy-customer-import-template.csv">Download a template</a>.</p>' +
            '<div class="form-group"><label for="import-file">Choose a CSV file</label>' +
            '<input id="import-file" class="form-control" type="file" accept=".csv,text/csv" ' +
            'data-act="admin-import-file" /></div>';
    }

    if (a.importError) out += '<div class="import-panel__error" role="alert">' + esc(a.importError) + '</div>';

    const summaryRow = (count, label, mod) =>
        '<div class="import-summary__row"><span class="import-summary__count' +
        (mod ? ' import-summary__count--' + mod : '') + '">' + count + '</span> <span>' + label + '</span></div>';

    if (a.importPreview && !a.importResult) {
        const p = a.importPreview;
        const invalid = importCountOf(p, 'Invalid');
        out += '<div class="import-summary">' +
            summaryRow(importCountOf(p, 'Create'), 'to create', 'create') +
            summaryRow(importCountOf(p, 'Update'), 'existing, with blanks to fill in') +
            summaryRow(importCountOf(p, 'Unchanged'), 'already up to date — nothing to do') +
            summaryRow(importCountOf(p, 'DuplicateInFile'), 'repeated in the file — the first one wins') +
            summaryRow(invalid, "can't be used", invalid > 0 ? 'bad' : '') +
        '</div>';

        if (p.unknownHeaders.length) {
            out += '<p class="import-panel__note">Ignoring ' + esc(p.unknownHeaders.join(', ')) +
                ' — only email, name and phone are imported. If one of those is a mis-named ' +
                'column, rename it and upload again.</p>';
        }

        const problems = p.rows.filter((r) => r.outcome === 'Invalid' || r.outcome === 'DuplicateInFile');
        if (problems.length) {
            out += '<div class="import-problems"><h4>Rows that won\'t be imported</h4>' +
                '<div class="admin-table-wrapper"><table class="admin-table">' +
                '<thead><tr><th>Line</th><th>Email</th><th>Reason</th></tr></thead><tbody>' +
                problems.slice(0, 20).map((r) =>
                    '<tr><td>' + r.line + '</td><td class="text-muted-sm">' +
                    (r.email.trim() ? esc(r.email) : '—') + '</td>' +
                    '<td class="text-muted-sm">' + esc(r.problem) + '</td></tr>').join('') +
                '</tbody></table></div>' +
                (problems.length > 20
                    ? '<p class="import-panel__note">…and ' + (problems.length - 20) + ' more.</p>' : '') +
            '</div>';
        }

        if (importActionable(p).length) {
            out += '<label class="import-panel__opt"><input type="checkbox" data-act="admin-import-claims" ' +
                (a.importSendClaims ? 'checked' : '') + ' /><span>Email the ' +
                importCountOf(p, 'Create') + ' new customer' + (importCountOf(p, 'Create') === 1 ? '' : 's') +
                ' a link to set a password</span></label>' +
                '<p class="import-panel__note">Only people created by this import are emailed, so ' +
                'running it again won\'t send twice. Existing customers are never emailed.</p>' +
                '<div class="import-panel__actions">' +
                  '<button class="action-btn action-btn--primary" data-act="admin-import-commit">Import these customers</button>' +
                  '<button class="action-btn action-btn--keep" data-act="admin-import-reset">Choose another file</button>' +
                '</div>';
        } else {
            out += '<p class="import-panel__note">Nothing in this file needs importing.</p>' +
                '<button class="action-btn action-btn--keep" data-act="admin-import-reset">Choose another file</button>';
        }
    }

    if (a.importResult) {
        const r = a.importResult;
        out += '<div class="import-summary">' +
            summaryRow(r.created, 'customers created', 'create') +
            summaryRow(r.updated, 'existing records filled in') +
            summaryRow(r.adopted, 'past bookings attached to their new accounts') +
            (a.importSendClaims ? summaryRow(r.created, 'claim emails sent') : '') +
        '</div>' +
        '<div class="import-panel__actions">' +
          '<button class="action-btn action-btn--primary" data-act="admin-import-close">Done</button>' +
          '<button class="action-btn action-btn--keep" data-act="admin-import-reset">Import another file</button>' +
        '</div>';
    }

    return out + '</div>';
}
