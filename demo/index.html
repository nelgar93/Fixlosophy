/* ============================================================
   Router, event delegation, and the demo control panel
   ============================================================ */

const ROUTES = {
    '#/': viewHome,
    '#/services': viewServices,
    '#/about': viewAbout,
    '#/gallery': viewGallery,
    // Retired. The real app answers /contact with a 301 to /about#contact; the demo's
    // router has no status codes, so it renders About and jumps to the anchor.
    '#/contact': viewAbout,
    '#/book': viewBook,
    '#/privacy': viewPrivacy,
    '#/terms': viewTerms,
    '#/account': viewAccount,
    '#/account/login': viewAccountLogin,
    '#/account/register': viewAccountRegister,
    '#/account/register-confirmation': viewRegisterConfirmation,
    '#/account/forgot-password': () => viewForgotPassword(false),
    '#/account/reset-password': viewResetPassword,
    '#/admin': viewAdmin,
    '#/admin/login': viewAdminLogin,
    '#/admin/forgot-password': () => viewForgotPassword(true)
};

const currentRoute = () => {
    const hash = location.hash || '#/';
    return ROUTES[hash] ? hash : '#/404';
};

function navigate(hash) {
    if (location.hash === hash) render();
    else location.hash = hash;
}

function render() {
    const route = currentRoute();
    const view = ROUTES[route] || viewNotFound;
    document.getElementById('app').innerHTML =
        navMenu(route) + '<main class="site-main">' + view() + '</main>' + siteFooter() + exportPanel();
    renderDemoBar();
    restoreFocus();
}

// A live-filtered field is re-rendered on every keystroke, which would otherwise
// take the caret with it.
function restoreFocus() {
    if (!state.focusModel) return;
    const el = document.querySelector('[data-model="' + state.focusModel + '"]');
    if (!el) return;
    el.focus();
    try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) { /* not a text input */ }
}

// state.book.name → sets book.name; admin.staffForm.role → sets admin.staffForm.role.
function setPath(path, value) {
    const parts = path.split('.');
    let target = state;
    for (let i = 0; i < parts.length - 1; i++) target = target[parts[i]];
    target[parts[parts.length - 1]] = value;
}

/* ── Clicks ────────────────────────────────────────────────── */

document.addEventListener('click', (e) => {
    const actEl = e.target.closest('[data-act]');

    // A link that just navigates: let the browser do it, but close the mobile menu.
    const navLink = e.target.closest('[data-nav]');
    if (navLink && !actEl) {
        if (navLink.dataset.returnurl) state.returnUrl = navLink.dataset.returnurl;
        state.navOpen = false;
        return;
    }
    if (!actEl) return;

    // Anything inside a @onclick:stopPropagation region must not also fire the row's
    // own handler.
    const stopZone = e.target.closest('[data-stop]');
    if (stopZone && !stopZone.contains(actEl)) return;

    const act = actEl.dataset.act;
    const id = actEl.dataset.id;

    // Inputs and selects report through change/input instead.
    if (actEl.tagName === 'SELECT' || actEl.tagName === 'INPUT') return;

    switch (act) {

    // ── Chrome ──
    case 'toggle-nav': state.navOpen = !state.navOpen; render(); break;
    case 'signout':
        signOut();
        navigate('#/');
        toast('Signed out.');
        break;
    case 'signout-to-book':
        signOut();
        state.book.prefilled = false;
        navigate('#/book');
        break;

    // ── Gallery lightbox ──
    case 'lightbox-open':
        state.lightbox = parseInt(actEl.dataset.index, 10);
        render();
        document.getElementById('lightbox').focus();
        break;
    case 'lightbox-close': state.lightbox = null; render(); break;
    case 'lightbox-prev':
        e.stopPropagation();
        state.lightbox = (state.lightbox - 1 + GALLERY_PHOTOS.length) % GALLERY_PHOTOS.length;
        render();
        break;
    case 'lightbox-next':
        e.stopPropagation();
        state.lightbox = (state.lightbox + 1) % GALLERY_PHOTOS.length;
        render();
        break;
    case 'lightbox-noop': e.stopPropagation(); break;

    // ── Contact ──
    case 'contact-reset':
        state.contactSubmitted = false;
        state.contactErrors = {};
        render();
        break;

    // ── Auth ──
    case 'toggle-password':
        state.auth.showPassword[actEl.dataset.id] = !state.auth.showPassword[actEl.dataset.id];
        render();
        break;
    case 'demo-verify': doDemoVerify(); break;
    case 'demo-open-reset': state.auth.notice = null; navigate('#/account/reset-password'); break;

    // ── Booking wizard ──
    case 'pick-service':
        state.book.service = serviceOptions().find((s) => s.name === actEl.dataset.name);
        render();
        break;
    case 'book-step2':
        if (!state.book.service) break;
        bookGoToStep(2);
        break;
    case 'book-step3': bookGoToStep(3); break;
    case 'book-step4': if (bookValidateDetails()) bookGoToStep(4); else render(); break;
    case 'book-step': bookGoToStep(parseInt(actEl.dataset.step, 10)); break;
    case 'book-confirm': bookConfirm(); break;
    // Same clear-and-start-again either way: "Book Another" after a success, and
    // "Start over" from inside the wizard, which previously had no way out at all.
    case 'book-reset':
    case 'book-restart': bookReset(); break;
    case 'cal-prev': {
        const m = state.book.calendarMonth;
        const prev = new Date(m.getFullYear(), m.getMonth() - 1, 1);
        if (prev >= new Date(today().getFullYear(), today().getMonth(), 1)) {
            state.book.calendarMonth = prev;
            render();
        }
        break;
    }
    case 'cal-next': {
        const m = state.book.calendarMonth;
        state.book.calendarMonth = new Date(m.getFullYear(), m.getMonth() + 1, 1);
        render();
        break;
    }
    case 'pick-day':
        state.book.date = parseIsoDate(actEl.dataset.date);
        state.book.time = null;
        render();
        break;
    case 'pick-time': state.book.time = actEl.dataset.time; render(); break;
    case 'pick-bike': state.book.bike = actEl.dataset.value; render(); break;
    case 'remove-photo':
        state.book.photos.splice(parseInt(actEl.dataset.index, 10), 1);
        render();
        break;

    // ── Account ──
    case 'account-cancel-start':
        state.account.cancelConfirmId = id;
        state.account.cancelError = state.account.cancelMessage = null;
        render();
        break;
    case 'account-cancel-keep': state.account.cancelConfirmId = null; render(); break;
    case 'account-cancel': accountCancelBooking(id); break;
    case 'account-save-profile': accountSaveProfile(); break;
    case 'account-save-password': accountSavePassword(); break;
    case 'account-add-bike': {
        const result = addBike(state.session.id, state.account.newBike);
        state.account.bikeError = result.error || null;
        if (!result.error) state.account.newBike = '';
        render();
        break;
    }
    case 'account-remove-bike': removeBike(state.session.id, id); render(); break;
    case 'account-export': accountExport(); break;
    case 'export-copy': exportCopy(); break;
    case 'export-close': state.account.exportJson = null; render(); break;
    case 'account-delete-start': state.account.confirmingDelete = true; render(); break;
    case 'account-delete-cancel': state.account.confirmingDelete = false; render(); break;
    case 'account-delete': accountDelete(); break;

    // ── Admin ──
    case 'admin-tab':
        state.admin.tab = actEl.dataset.tab;
        state.admin.selectedCustomerId = null;
        state.admin.bellOpen = false;
        render();
        break;
    case 'admin-filter':
        state.admin.filter = actEl.dataset.filter;
        state.admin.page = 0;
        closeTransientPanels();
        render();
        break;
    case 'admin-page':
        state.admin.page = parseInt(actEl.dataset.page, 10);
        closeTransientPanels();
        render();
        break;
    case 'admin-expand':
        state.admin.expandedId = state.admin.expandedId === id ? null : id;
        render();
        break;
    case 'admin-status':
        updateStatus(id, actEl.dataset.status);
        closeTransientPanels();
        render();
        // The real site emails the customer here — Confirm is the moment the booking
        // becomes real to them. Nothing leaves the browser in the demo, so it says so.
        if (actEl.dataset.status === STATUS.Confirmed) toast('Confirmed. The customer would be emailed.');
        break;
    case 'admin-import-open':
        if (!isAdmin()) break;   // guard, not just a hidden button
        state.admin.selectedCustomerId = null;
        state.admin.importing = true;
        resetImportState();
        render();
        break;
    case 'admin-import-close':
        state.admin.importing = false;
        resetImportState();
        render();
        break;
    case 'admin-import-reset': resetImportState(); render(); break;
    case 'admin-import-commit': {
        const p = state.admin.importPreview;
        if (!p) break;
        const result = importCommit(p);
        state.admin.importResult = result;
        state.admin.importPreview = null;
        render();
        // The real site emails the new customers a claim link here. Nothing leaves the
        // browser in the demo, so it says so instead.
        toast(state.admin.importSendClaims && result.created
            ? result.created + ' imported. They would each be emailed a link to set a password.'
            : result.created + ' customers imported.');
        break;
    }
    case 'admin-cancel-start':
        closeTransientPanels();
        state.admin.cancelConfirmId = id;
        render();
        break;
    case 'admin-cancel-keep': state.admin.cancelConfirmId = null; render(); break;
    case 'admin-cancel':
        updateStatus(id, STATUS.Cancelled);
        raiseBookingCancelled(bookingById(id));
        closeTransientPanels();
        render();
        toast('Cancelled. The customer would be emailed.');
        break;
    case 'admin-reopen':
        updateStatus(id, STATUS.Confirmed);
        closeTransientPanels();
        render();
        toast('Reopened — it is back in the diary as confirmed.');
        break;
    case 'admin-delete-start':
        closeTransientPanels();
        state.admin.deleteConfirmId = id;
        render();
        break;
    case 'admin-delete-keep': state.admin.deleteConfirmId = null; render(); break;
    case 'admin-delete':
        deleteBooking(id);
        closeTransientPanels();
        render();
        toast('Booking deleted, along with its photos.');
        break;
    case 'admin-complete-start':
        closeTransientPanels();
        state.admin.completeNoteBookingId = id;
        state.admin.completeNoteBody = '';
        state.admin.completeNoteVisible = false;
        render();
        break;
    case 'admin-complete-back': state.admin.completeNoteBookingId = null; render(); break;
    case 'admin-complete-save': {
        const booking = bookingById(id);
        if (state.admin.completeNoteBody.trim()) {
            addNote({
                customerId: booking.customerId,
                bookingId: booking.id,
                authorStaffId: state.session.id,
                body: state.admin.completeNoteBody.trim(),
                visible: state.admin.completeNoteVisible
            });
        }
        updateStatus(id, STATUS.Completed);
        state.admin.completeNoteBookingId = null;
        state.admin.completeNoteBody = '';
        render();
        toast('Marked complete.');
        break;
    }
    case 'notif-toggle': state.admin.bellOpen = !state.admin.bellOpen; render(); break;
    case 'notif-toggle-read':
        state.admin.showReadNotifications = !state.admin.showReadNotifications;
        render();
        break;
    case 'notif-mark-all': markAllRead(state.session.id); render(); break;
    case 'admin-cal-day':
        state.admin.calDay = addDays(state.admin.calDay, parseInt(actEl.dataset.delta, 10));
        render();
        break;
    case 'admin-cal-today': state.admin.calDay = today(); render(); break;
    case 'admin-open-customer':
        state.admin.selectedCustomerId = id;
        state.admin.customerNoteBody = '';
        state.admin.customerNoteVisible = false;
        render();
        break;
    case 'admin-close-customer': state.admin.selectedCustomerId = null; render(); break;
    case 'admin-customer-note-save':
        addNote({
            customerId: state.admin.selectedCustomerId,
            bookingId: null,
            authorStaffId: state.session.id,
            body: state.admin.customerNoteBody.trim(),
            visible: state.admin.customerNoteVisible
        });
        state.admin.customerNoteBody = '';
        state.admin.customerNoteVisible = false;
        render();
        break;
    case 'admin-customer-note-delete': deleteNote(id); render(); break;

    case 'admin-toggle-handled-enquiries':
        state.admin.showHandledEnquiries = !state.admin.showHandledEnquiries;
        render();
        break;

    case 'admin-enquiry-handled': {
        // EnquiryService.MarkHandled. With "show handled" off this takes the row off
        // the list, which is the point — the tab is the outstanding queue.
        if (!canManage()) break;
        const enquiry = DB.enquiries.find((x) => x.id === id);
        if (enquiry) { enquiry.handledAt = enquiry.handledAt ? null : now(); persist(); }
        render();
        break;
    }
    case 'admin-customer-page':
        state.admin.customerPage = parseInt(actEl.dataset.page, 10);
        render();
        break;
    case 'admin-save-price': {
        updateServicePrice(id, Number(state.admin.editPrices[id]) || 0);
        state.admin.priceSaveMessage = 'Price updated.';
        render();
        break;
    }
    case 'admin-save-all-prices': {
        Object.keys(state.admin.editPrices).forEach((sid) =>
            updateServicePrice(sid, Number(state.admin.editPrices[sid]) || 0));
        state.admin.priceSaveMessage = 'All prices saved.';
        render();
        toast('Prices saved — the Services page and booking wizard now quote the new figures.');
        break;
    }
    // ── Availability ──
    case 'avail-add-closure': {
        const av = state.admin.availability;
        av.error = av.success = null;
        const result = addClosure({
            startDate: parseIsoDate(av.closureFrom),
            endDate: parseIsoDate(av.closureTo),
            reason: av.closureReason,
            startTime: av.closurePartDay ? av.closureStart : null,
            endTime: av.closurePartDay ? av.closureEnd : null,
            createdByStaffId: state.session.id
        });
        if (result.error) {
            av.error = result.error;
        } else {
            av.success = 'Closed ' + describeDates(result.closure.startDate, result.closure.endDate) + '.';
            av.closureReason = '';
            av.closurePartDay = false;
        }
        // The tab recomputes the stranded list on every render, so anyone this closure
        // just displaced appears above — along with anyone displaced by an earlier one
        // who still hasn't been dealt with.
        render();
        break;
    }
    case 'avail-remove-closure': {
        const av = state.admin.availability;
        av.error = av.success = null;
        removeClosure(id);
        render();
        break;
    }
    case 'avail-add-absence': {
        const av = state.admin.availability;
        av.error = av.success = null;
        if (!av.absenceStaffId) { av.error = "Pick who's away."; render(); break; }
        const result = addAbsence({
            staffId: av.absenceStaffId,
            startDate: parseIsoDate(av.absenceFrom),
            endDate: parseIsoDate(av.absenceTo),
            type: av.absenceType,
            note: av.absenceNote
        });
        if (result.error) {
            av.error = result.error;
        } else {
            const who = staffById(result.absence.staffId);
            av.success = (who ? who.fullName : 'Away') + ' booked off ' +
                describeDates(result.absence.startDate, result.absence.endDate) + '.';
            av.absenceNote = '';
        }
        render();
        break;
    }
    case 'avail-remove-absence': {
        const av = state.admin.availability;
        av.error = av.success = null;
        removeAbsence(id);
        render();
        break;
    }
    // Moving somebody keeps the reference in their confirmation email, and the notes
    // and photos on the job. Nothing here happens automatically: cancelling an
    // appointment is a decision, and the shop may well want to ring them instead.
    case 'avail-move': {
        const av = state.admin.availability;
        av.error = av.success = null;
        const move = av.moves[id];
        if (!move || !move.slot) { av.error = 'Pick a new date and time first.'; render(); break; }

        const result = rescheduleBooking(id, parseIsoDate(move.date), move.slot);
        if (result.error) { av.error = result.error; render(); break; }

        const moved = result.booking;
        delete av.moves[id];
        av.success = moved.reference + ' moved to ' + fmt.dddDMMM(moved.slotDate) + ' at ' +
            moved.slotTime + ', and ' + moved.customerName + ' has been emailed.';
        render();
        toast('Moved. The customer would be emailed the new time.');
        break;
    }
    case 'avail-cancel-invite': {
        const av = state.admin.availability;
        av.error = av.success = null;
        const booking = bookingById(id);
        if (!booking) break;
        updateStatus(id, STATUS.Cancelled);
        raiseBookingCancelled(booking);
        delete av.moves[id];
        av.success = booking.reference + ' cancelled, and ' + booking.customerName +
            ' has been invited to rebook.';
        render();
        toast('Cancelled. The customer would be invited to rebook.');
        break;
    }
    case 'admin-add-staff': {
        const form = state.admin.staffForm;
        const result = addStaff(form, form.password);
        state.admin.staffFormError = result.error || null;
        if (!result.error) state.admin.staffForm =
            { fullName: '', email: '', role: 'Worker', password: '', isMechanic: true };
        render();
        break;
    }
    case 'admin-save-staff': {
        const member = staffById(id);
        const edits = state.admin.staffEdits[id];
        state.admin.staffRowError = null;
        if (edits) {
            // The last admin can't lock themselves out, and nobody deactivates
            // themselves — the same guards the real page applies.
            if (edits.isActive === false && id === state.session.id) {
                state.admin.staffRowError = 'You can\'t deactivate your own account.';
                render();
                break;
            }
            saveStaffMember(Object.assign({}, member, edits));
            delete state.admin.staffEdits[id];
        }
        render();
        toast('Saved ' + member.fullName + '. Sign in as them to see the permissions applied.');
        break;
    }

    // ── Demo panel ──
    case 'demo-toggle':
        document.getElementById('demo-bar').classList.toggle('demo-bar--open');
        break;
    case 'demo-persona': applyPersona(actEl.dataset.persona); break;
    case 'demo-reset': resetDemo(); break;

    default: break;
    }
});

/* ── Typing and selects ────────────────────────────────────── */

// wwwroot/site.js — phone fields accept digits and the punctuation people write
// between them, and nothing else. Capture phase so it runs before the model binding
// below reads the value.
const cleanPhone = (raw) => {
    let kept = '';
    for (const c of raw) {
        if (c >= '0' && c <= '9') { kept += c; continue; }
        if (c === '+' && kept.length === 0) { kept += c; continue; }   // prefix only
        // Separators only separate — nothing to separate yet means drop it.
        if (kept.length && ' ()-.'.includes(c)) kept += c;
    }
    return kept.slice(0, 20);
};

document.addEventListener('input', (e) => {
    const el = e.target;
    if (!el || !el.hasAttribute || !el.hasAttribute('data-phone-input')) return;

    const cleaned = cleanPhone(el.value);
    if (cleaned === el.value) return;

    const caret = el.selectionStart;
    const removed = el.value.length - cleaned.length;
    el.value = cleaned;
    if (caret !== null) {
        const pos = Math.max(0, caret - removed);
        try { el.setSelectionRange(pos, pos); } catch (_) { /* not supported */ }
    }
}, true);

document.addEventListener('input', (e) => {
    const el = e.target;

    if (el.dataset.priceFor) {
        state.admin.editPrices[el.dataset.priceFor] = el.value;
        return;
    }
    if (!el.dataset.model) return;

    setPath(el.dataset.model, el.value);

    // Search boxes filter as you type, so they re-render — and then need the caret back.
    if (el.hasAttribute('data-live')) {
        if (el.dataset.model === 'admin.search') { state.admin.page = 0; closeTransientPanels(); }
        if (el.dataset.model === 'admin.customerSearch') state.admin.customerPage = 0;
        state.focusModel = el.dataset.model;
        render();
        state.focusModel = null;
    } else if (el.dataset.act === 'admin-customer-note-body' || el.dataset.model === 'admin.customerNoteBody' ||
               el.dataset.model === 'admin.completeNoteBody') {
        // The Save button's label and disabled state track what's typed.
        state.focusModel = el.dataset.model;
        render();
        state.focusModel = null;
    }
});

document.addEventListener('change', (e) => {
    const el = e.target;
    const act = el.dataset.act;

    if (act === 'pick-photos') { addPhotos(el.files); return; }
    if (act === 'admin-assign') {
        assignStaff(el.dataset.id, el.value);
        render();
        return;
    }
    if (act === 'admin-import-claims') { state.admin.importSendClaims = el.checked; return; }
    if (act === 'admin-import-file') {
        const file = el.files && el.files[0];
        if (!file) return;
        resetImportState();
        if (file.size > 2 * 1024 * 1024) {
            state.admin.importError = 'That file is larger than 2 MB.';
            render();
            return;
        }
        const reader = new FileReader();
        reader.onload = () => {
            const preview = importPreview(String(reader.result || ''));
            state.admin.importError = preview.fatalError;
            state.admin.importPreview = preview.fatalError ? null : preview;
            render();
        };
        reader.onerror = () => { state.admin.importError = "That file couldn't be read."; render(); };
        reader.readAsText(file);
        return;
    }
    if (act === 'admin-sort') {
        state.admin.sort = el.value;
        state.admin.expandedId = null;
        closeTransientPanels();
        state.admin.page = 0;   // a re-sort starts at the first page
        render();
        return;
    }
    if (act === 'admin-cal-pick') {
        state.admin.calDay = parseIsoDate(el.value);
        render();
        return;
    }
    if (act === 'avail-partday') {
        state.admin.availability.closurePartDay = el.checked;
        render();
        return;
    }
    // The last day can't sit before the first, so it follows the first down rather
    // than waiting to be rejected on submit. ISO dates compare as strings.
    if (act === 'avail-closure-from' || act === 'avail-absence-from') {
        const av = state.admin.availability;
        const isClosure = act === 'avail-closure-from';
        const from = isClosure ? 'closureFrom' : 'absenceFrom';
        const to = isClosure ? 'closureTo' : 'absenceTo';
        av[from] = el.value;
        if (av[to] < av[from]) av[to] = av[from];
        render();
        return;
    }
    if (act === 'avail-move-date') {
        // Changing the date clears the slot: the times available on the new day are not
        // the times that were available on the old one.
        state.admin.availability.moves[el.dataset.id] = { date: el.value, slot: '' };
        render();
        return;
    }
    if (act === 'avail-move-slot') {
        const moves = state.admin.availability.moves;
        const current = moves[el.dataset.id] || { date: isoDate(today()), slot: '' };
        moves[el.dataset.id] = { date: current.date, slot: el.value };
        render();
        return;
    }
    if (act === 'admin-staff-form-mechanic') { state.admin.staffForm.isMechanic = el.checked; return; }
    if (act === 'admin-staff-toggle') {
        const edits = state.admin.staffEdits[el.dataset.id] || (state.admin.staffEdits[el.dataset.id] = {});
        edits[el.dataset.field] = el.checked;
        return;
    }
    if (act === 'admin-complete-share') { state.admin.completeNoteVisible = el.checked; render(); return; }
    if (act === 'admin-customer-note-share') { state.admin.customerNoteVisible = el.checked; render(); return; }

    if (el.dataset.model && el.tagName === 'SELECT') {
        setPath(el.dataset.model, el.value);
        render();
    }
});

/* ── Forms ─────────────────────────────────────────────────── */

document.addEventListener('submit', (e) => {
    const form = e.target.closest('[data-act]');
    if (!form) return;
    e.preventDefault();

    switch (form.dataset.act) {
    case 'contact-submit': submitContact(); break;
    case 'signin-customer': doCustomerSignIn(); break;
    case 'signin-staff': doStaffSignIn(); break;
    case 'register-customer': doRegister(); break;
    case 'resend-verification':
        state.auth.notice = 'resent';
        state.auth.error = null;
        navigate('#/account/login');
        break;
    case 'forgot-password':
        state.auth.notice = 'sent';
        render();
        break;
    case 'reset-password':
        if (state.auth.password.length < MIN_PASSWORD_LENGTH) {
            state.auth.error = 'Password must be at least ' + MIN_PASSWORD_LENGTH + ' characters.';
            render();
            break;
        }
        state.auth.error = null;
        state.auth.password = '';
        state.auth.notice = 'reset';
        navigate('#/account/login');
        break;
    default: break;
    }
});

/* ── Keyboard ──────────────────────────────────────────────── */

document.addEventListener('keydown', (e) => {
    if (state.lightbox === null) return;
    if (e.key === 'Escape') { state.lightbox = null; render(); }
    else if (e.key === 'ArrowLeft') {
        state.lightbox = (state.lightbox - 1 + GALLERY_PHOTOS.length) % GALLERY_PHOTOS.length;
        render();
    } else if (e.key === 'ArrowRight') {
        state.lightbox = (state.lightbox + 1) % GALLERY_PHOTOS.length;
        render();
    }
});

window.addEventListener('hashchange', () => {
    state.navOpen = false;
    state.lightbox = null;
    render();
    window.scrollTo(0, 0);
});

    else if (key === 'admin') { signIn('staff', 'staff-francesco'); navigate('#/admin'); }
    else if (key === 'worker') { signIn('staff', 'staff-janek'); navigate('#/admin'); }
    else if (key === 'worker-restricted') { signIn('staff', 'staff-priya'); navigate('#/admin'); }
    render();
    window.scrollTo(0, 0);
}

function activePersonaKey() {
    if (state.session.kind === 'customer') {
        return state.session.id === 'cust-aisha' ? 'customer'
             : state.session.id === 'cust-samuel' ? 'customer-unverified' : 'customer-other';
    }
    if (state.session.kind === 'staff') {
        return state.session.id === 'staff-francesco' ? 'admin'
             : state.session.id === 'staff-janek' ? 'worker'
             : state.session.id === 'staff-priya' ? 'worker-restricted' : 'staff-other';
    }
    return 'guest';
}

function renderDemoBar() {
    const bar = document.getElementById('demo-bar');
    const wasOpen = bar.classList.contains('demo-bar--open');
    const active = activePersonaKey();

    const quickLink = (href, label) => '<a href="' + href + '">' + label + '</a>';

    bar.innerHTML =
        '<button class="demo-bar__toggle" data-act="demo-toggle">' + icon('sliders-h') + ' Demo</button>' +
        '<div class="demo-bar__panel">' +
          '<div class="demo-bar__head"><strong>Demo controls</strong>' +
            '<button class="demo-bar__close" data-act="demo-toggle" aria-label="Close">&times;</button></div>' +
          '<p class="demo-bar__note">Static build of the Fixlosophy site with invented data. ' +
            'Bookings, notes, prices and staff changes are real edits to the in-browser store and survive a reload.</p>' +

          '<span class="demo-bar__label">Sign in as</span>' +
          '<div class="demo-personas">' +
            PERSONAS.map((p) =>
              '<button class="demo-persona ' + (active === p.key ? 'demo-persona--active' : '') + '" ' +
              'data-act="demo-persona" data-persona="' + p.key + '">' +
              '<strong>' + p.label + '</strong><span>' + p.note + '</span></button>').join('') +
          '</div>' +

          '<span class="demo-bar__label">Jump to</span>' +
          '<div class="demo-links">' +
            quickLink('#/', 'Home') + quickLink('#/services', 'Services') + quickLink('#/gallery', 'Gallery') +
            quickLink('#/about', 'About') + quickLink('#/book', 'Book') + quickLink('#/account', 'Account') +
            quickLink('#/admin', 'Admin') + quickLink('#/account/register', 'Register') +
            quickLink('#/privacy', 'Privacy') + quickLink('#/terms', 'Terms') + quickLink('#/nowhere', '404') +
          '</div>' +

          '<div class="demo-creds">Every account uses the password <code>' + DEMO_PASSWORD + '</code>.<br />' +
            'Seeded: ' + DB.bookings.length + ' bookings · ' + DB.customers.length + ' customers · ' +
            DB.staff.length + ' staff · ' + DB.enquiries.length + ' enquiries.</div>' +

          '<span class="demo-bar__label">Data</span>' +
          '<div class="demo-links"><button class="demo-reset" data-act="demo-reset">Reset demo data</button></div>' +
        '</div>';

    if (wasOpen) bar.classList.add('demo-bar--open');
}

/* ── Boot ──────────────────────────────────────────────────── */

if (!restore()) seed();
if (!location.hash) location.hash = '#/';
render();

</script>
