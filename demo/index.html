// NotificationService's short relative time — "4m", "2h", "3d".
function relativeTime(when) {
    const minutes = Math.max(0, Math.round((now() - when) / 60000));
    if (minutes < 1) return 'just now';
    if (minutes < 60) return minutes + 'm';
    const hours = Math.round(minutes / 60);
    if (hours < 24) return hours + 'h';
    return Math.round(hours / 24) + 'd';
}

function adminTabBar(tab) {
    const button = (key, label) =>
        '<button class="filter-tab ' + (tab === key ? 'active' : '') + '" data-act="admin-tab" ' +
        'data-tab="' + key + '">' + label + '</button>';

    return '<div class="admin-filter-scroll tab-bar-wrapper"><div class="admin-filter-tabs">' +
        button('calendar', 'Calendar') +
        button('bookings', 'Bookings') +
        (canSeeCustomerDetails()
            ? button('customers', 'Customers') +
              button('enquiries', 'Enquiries' + (unhandledEnquiries().length
                  ? '<span class="filter-tab__count">' + unhandledEnquiries().length + '</span>' : ''))
            : '') +
        (isAdmin()
            ? button('availability', 'Availability') +
              button('pricing', 'Pricing') + button('staff', 'Staff Management')
            : '') +
    '</div></div>';
}

/* Admin.razor's CloseTransientPanels. Delete-confirm, cancel-confirm, the overflow
   menu and the completion note are separate two-step flows on the same row; opening
   any one closes the others. Leaving two open at once was how a single booking could
   end up showing twelve controls. */
function resetImportState() {
    state.admin.importPreview = null;
    state.admin.importResult = null;
    state.admin.importError = null;
}

function closeTransientPanels() {
    state.admin.deleteConfirmId = null;
    state.admin.cancelConfirmId = null;
    state.admin.completeNoteBookingId = null;
}

/* ── Shared action set (Admin.razor's ActionButtons fragment) ── */

// Both the second row's wrapper and rowHasActions ask these — an empty wrapper still
// draws the gap above it.
const showContact = (b) => canSeeCustomerDetails() && isValidPhone(b.customerPhone);
const showCancel  = (b) => canManage() && canTransition(b.status, STATUS.Cancelled);

function actionButtons(b) {
    const a = state.admin;
    let out = '<div class="booking-actions">';

    // Tier 1 — the one thing you came here to do. Confirm / In Progress / Complete
    // were three differently-coloured buttons for what is really one control.
    // Reopen takes the same slot on a cancelled or completed booking: those have no
    // next stage, and reopening is the only thing left to do with them. It used to
    // hide in an overflow menu, which is gone.
    const next = canManage() ? nextStage(b.status) : null;
    if (next) {
        const act = next === STATUS.Completed ? 'admin-complete-start' : 'admin-status';
        out += '<button class="action-btn action-btn--primary booking-actions__primary" data-act="' + act +
               '" data-id="' + b.id + '" data-status="' + next + '">' + stageLabel(next) + '</button>';
    } else if (canManage() && canTransition(b.status, STATUS.Confirmed)) {
        out += '<button class="action-btn action-btn--primary booking-actions__primary" ' +
               'data-act="admin-reopen" data-id="' + b.id + '">' + icon('undo') + ' Reopen booking</button>';
    }

    // Tier 2 — reaching the customer, and calling the job off. Cancel spent a release
    // behind a "…" menu: three taps for the second most common thing done to a
    // booking. The contact links take the larger share of the row because they are
    // used far more often; Cancel is deliberately the narrow one, and still asks.
    if (showContact(b) || showCancel(b)) {
        out += '<div class="booking-actions__row">';
        // The booking form has required a phone for a while, so in practice both links
        // always render. isValidPhone rather than a blank check because older rows
        // predate that, and a value with no dialable digits produced a dead wa.me/ link.
        if (showContact(b)) {
            out += '<a class="action-btn action-btn--whatsapp" href="' + whatsAppBookingHref(b) +
                   '" target="_blank" rel="noopener" title="WhatsApp ' + esc(b.customerName) + '">' +
                   icon('whatsapp') + ' <span class="action-btn__label">WhatsApp</span></a>';
            out += '<a class="action-btn action-btn--call" href="tel:' + telHref(b.customerPhone) +
                   '" title="Call ' + esc(b.customerName) + '">' + icon('phone') +
                   ' <span class="action-btn__label">Call</span></a>';
        }
        if (showCancel(b))
            out += '<button class="action-btn action-btn--cancel" data-act="admin-cancel-start" data-id="' +
                   b.id + '">Cancel</button>';
        out += '</div>';
    }
    out += '</div>';

    // Cancel now cannot be undone except by Reopen, so it gets the same two-step
    // confirm Delete has always had. It used to fire on a single click.
    if (a.cancelConfirmId === b.id) {
        out += '<div class="booking-confirm">' +
            '<p class="booking-confirm__text">Cancel <strong>' + esc(b.reference) + '</strong> and free the slot?' +
              (b.customerEmail ? ' <span>' + esc(b.customerName) + ' will be emailed.</span>' : '') + '</p>' +
            '<div class="booking-confirm__actions">' +
              '<button class="action-btn action-btn--danger" data-act="admin-cancel" data-id="' + b.id +
                '">Yes, cancel it</button>' +
              '<button class="action-btn action-btn--keep" data-act="admin-cancel-keep">Keep booking</button>' +
            '</div></div>';
    }

    // Sits on its own line below the buttons, so it reads as a step rather than
    // another control crammed into the row.
    if (a.completeNoteBookingId === b.id) {
        // Per-booking id: the mobile cards and the desktop table are BOTH always in the
        // DOM, so a literal id put two elements with the same id on the page.
        const noteId = 'complete-note-' + b.id;
        out += '<div class="complete-note">' +
            '<label class="complete-note__label" for="' + noteId + '">Add a note about this job ' +
              '<span class="complete-note__optional">(optional)</span></label>' +
            '<textarea id="' + noteId + '" class="form-control" rows="3" data-model="admin.completeNoteBody" ' +
              'placeholder="e.g. rear hub has play — worth replacing next service">' + esc(a.completeNoteBody) + '</textarea>' +
            '<label class="complete-note__share">' +
              '<input type="checkbox" data-act="admin-complete-share" ' + (a.completeNoteVisible ? 'checked' : '') + ' />' +
              '<span>Share this with the customer</span></label>' +
            '<p class="complete-note__hint">' +
              (a.completeNoteVisible
                ? 'They\'ll see it on this booking in their account.'
                : 'Staff only — not shown to the customer.') + '</p>' +
            '<div class="complete-note__actions">' +
              '<button class="action-btn action-btn--primary" data-act="admin-complete-save" data-id="' + b.id + '">' +
                (a.completeNoteBody.trim() ? 'Save note &amp; complete' : 'Complete without a note') + '</button>' +
              '<button class="action-btn action-btn--keep" data-act="admin-complete-back">Back</button>' +
            '</div>' +
        '</div>';
    }
    return out;
}

// Admin.razor's DangerZone. Delete used to sit in the action strip, one tap from
// Cancel and wearing the same red. They are not peers: Cancel keeps the record,
// Delete removes the row and its photos for good. Admin-only, in the expanded detail.
function dangerZone(b) {
    if (!isAdmin()) return '';
    const a = state.admin;
    if (a.deleteConfirmId === b.id) {
        return '<div class="booking-danger">' +
            '<p class="booking-danger__text">Permanently delete <strong>' + esc(b.reference) + '</strong> and its ' +
              "photos? This can't be undone — use Cancel if you just want to free the slot.</p>" +
            '<div class="booking-danger__actions">' +
              '<button class="action-btn action-btn--danger" data-act="admin-delete" data-id="' + b.id +
                '">Delete permanently</button>' +
              '<button class="action-btn action-btn--keep" data-act="admin-delete-keep">Keep</button>' +
            '</div></div>';
    }
    return '<div class="booking-danger">' +
        '<button class="action-btn action-btn--delete" data-act="admin-delete-start" data-id="' + b.id + '">' +
          icon('trash') + ' Delete booking</button></div>';
}

// canManage() always yields at least the primary button: every status either has a
// next stage or can be reopened.
const rowHasActions = (b) => canManage() || showContact(b);

function jobNotesBlock(bookingId) {
    const notes = notesForBooking(bookingId);
    if (notes.length === 0) return null;
    return '<span class="booking-notes">' + notes.map((n) =>
        '<span class="booking-note ' + (n.visibleToCustomer ? 'booking-note--shared' : '') + '">' +
          esc(n.body) +
          '<span class="text-faint-sm">' + (n.visibleToCustomer ? 'shared with customer' : 'internal') +
            ' &middot; ' + fmt.dMMM(n.createdAt) + '</span>' +
        '</span>').join('') + '</span>';
}

function photoThumbs(b) {
    if (!b.photos.length) return '';
    return '<div class="admin-photo-thumbs">' + b.photos.map((p) =>
        '<a href="' + uploadedPhotoUrl(p) + '" target="_blank" rel="noopener noreferrer">' +
        '<img src="' + uploadedPhotoUrl(p) + '" class="admin-photo-thumb" alt="Issue photo" /></a>').join('') +
    '</div>';
}

const staffOptions = (selectedId) =>
    '<option value="">— Unassigned —</option>' +
    DB.staff.filter((s) => s.isActive).map((s) =>
        '<option value="' + s.id + '"' + (selectedId === s.id ? ' selected' : '') + '>' +
        esc(s.fullName) + '</option>').join('');

/* ── Bookings tab ──────────────────────────────────────────── */

function adminBookingsTab() {
    const a = state.admin;
    const scoped = scopeStaffId();
    const all = scoped ? DB.bookings.filter((b) => b.assignedStaffId === scoped) : DB.bookings;
    const stats = statsFor(all);
    const page = bookingsPage(scoped, a.filter, a.search, a.page, PAGE_SIZE, a.sort);
    const totalPages = Math.max(1, Math.ceil(page.total / PAGE_SIZE));
    const todays = all.filter((b) => sameDay(b.slotDate, today()))
                      .sort((x, y) => x.slotTime.localeCompare(y.slotTime));

    const statTiles =
        '<div class="admin-stats">' +
          '<div class="admin-stat"><div class="admin-stat__number">' + stats.total + '</div>' +
            '<div class="admin-stat__label">' + (canViewAllBookings() ? 'Total' : 'Assigned') + '</div></div>' +
          '<div class="admin-stat admin-stat--highlight"><div class="admin-stat__number">' + stats.today + '</div>' +
            '<div class="admin-stat__label">Today</div></div>' +
          '<div class="admin-stat"><div class="admin-stat__number">' + stats.pending + '</div>' +
            '<div class="admin-stat__label">Pending</div></div>' +
          '<div class="admin-stat"><div class="admin-stat__number">' + stats.confirmed + '</div>' +
            '<div class="admin-stat__label">Confirmed</div></div>' +
        '</div>';

    const filters =
        '<div class="admin-filters">' +
          '<div class="admin-filter-scroll"><div class="admin-filter-tabs">' +
            ADMIN_FILTERS.map((f) =>
              '<button class="filter-tab ' + (a.filter === f ? 'active' : '') + '" data-act="admin-filter" ' +
              'data-filter="' + esc(f) + '">' + f + '</button>').join('') +
          '</div></div>' +
          '<div class="admin-search">' +
            '<label class="sr-only" for="booking-search">Search bookings</label>' +
            '<input id="booking-search" class="form-control" type="text" placeholder="Search name, ref, service…" ' +
            'data-model="admin.search" data-live value="' + esc(a.search) + '" />' +
          '</div>' +
          '<div class="admin-sort">' +
            '<label class="sr-only" for="booking-sort">Sort bookings</label>' +
            '<select id="booking-sort" class="form-control" data-act="admin-sort">' +
              SORT_OPTIONS.map((o) =>
                '<option value="' + o + '"' + (a.sort === o ? ' selected' : '') + '>' +
                sortLabel(o) + '</option>').join('') +
            '</select>' +
          '</div>' +
        '</div>';

    const todaySchedule = (todays.length && a.filter === 'All')
        ? '<div class="today-schedule"><h3>' + icon('clock') + ' Today\'s Schedule</h3><div class="today-slots">' +
            todays.map((b) =>
              '<div class="today-slot"><span class="today-slot__time">' + b.slotTime + '</span>' +
                '<span class="today-slot__name">' + esc(b.customerName) + '</span>' +
                '<span class="today-slot__service">' + esc(b.serviceName) + '</span>' +
                statusBadge(b.status) + lateBadge(b) + '</div>').join('') +
          '</div></div>'
        : '';

    // A search that matches nothing used to remove the cards, the pager AND the whole
    // table, column headers included. The table is the thing being searched, so it
    // stays put and says it found nothing.
    const empty = a.search.trim() ? 'No bookings match \u201c' + esc(a.search.trim()) + '\u201d.'
                : a.filter !== 'All' ? 'No ' + a.filter.toLowerCase() + ' bookings.'
                : 'No bookings yet.';

    return statTiles + filters + todaySchedule +
        adminBookingCards(page.items, empty) +
        (totalPages > 1 ? pager('Booking pages', a.page, totalPages, page.total, 'booking', 'admin-page') : '') +
        adminBookingTable(page.items, empty);
}

function adminBookingCards(bookings, emptyMessage) {
    const a = state.admin;
    const emptyBlock = bookings.length ? '' : '<div class="admin-empty"><p>' + emptyMessage + '</p></div>';
    return '<div class="admin-cards">' + emptyBlock + bookings.map((b) => {
        const isOpen = a.expandedId === b.id;
        const detailRow = (label, value) =>
            '<div class="admin-card__detail-row"><span>' + label + '</span><span>' + value + '</span></div>';

        let detail = '';
        if (isOpen) {
            const notes = jobNotesBlock(b.id);
            detail = '<div class="admin-card__detail">' +
                (canSeeCustomerDetails()
                    ? detailRow('Email', esc(b.customerEmail)) +
                      (b.customerPhone ? detailRow('Phone', esc(b.customerPhone)) : '')
                    : '') +
                (b.bikeDescription ? detailRow('Bike', esc(b.bikeDescription)) : '') +
                (b.notes ? detailRow('Notes', esc(b.notes)) : '') +
                (notes ? detailRow('Job notes', notes) : '') +
                (b.photos.length ? detailRow('Photos', photoThumbs(b)) : '') +
                detailRow('Price', b.servicePrice > 0 ? 'From £' + b.servicePrice : 'Quote') +
                detailRow('Booked', fmt.dMMMHHmm(b.createdAt)) +
                (isAdmin()
                    ? '<div class="admin-card__detail-row"><span>Assign to</span>' +
                      '<select class="form-control form-control--compact" data-act="admin-assign" data-id="' + b.id + '">' +
                      staffOptions(b.assignedStaffId) + '</select></div>'
                    : '') +
                dangerZone(b) +
            '</div>';
        }

        return '<div class="admin-card ' + (isOpen ? 'admin-card--open' : '') + '" data-act="admin-expand" data-id="' + b.id + '">' +
            '<div class="admin-card__header">' + refBadge(b.reference) +
              '<div class="admin-card__header-right">' + statusBadge(b.status) + lateBadge(b) +
                '<span class="admin-card__chevron ' + (isOpen ? 'open' : '') + '">' + icon('chevron-right') + '</span>' +
              '</div></div>' +
            '<div class="admin-card__name">' + esc(b.customerName) + '</div>' +
            '<div class="admin-card__meta"><span>' + esc(b.serviceName) + '</span>' +
              '<span>' + fmt.dMMM(b.slotDate) + ' &middot; ' + b.slotTime + '</span></div>' +
            detail +
            (rowHasActions(b) ? '<div class="admin-card__actions" data-stop>' + actionButtons(b) + '</div>' : '') +
        '</div>';
    }).join('') + '</div>';
}

function adminBookingTable(bookings, emptyMessage) {
    const a = state.admin;
    const columnCount = 5 + (isAdmin() ? 1 : 0) + ((canManage() || canSeeCustomerDetails()) ? 1 : 0);

    const rows = bookings.map((b) => {
        let row = '<tr class="' + (a.expandedId === b.id ? 'row-expanded' : '') + '" data-act="admin-expand" data-id="' + b.id + '">' +
            '<td>' + refBadge(b.reference) + '</td>' +
            '<td><div class="customer-cell"><strong>' + esc(b.customerName) + '</strong>' +
              (canSeeCustomerDetails() ? '<span>' + esc(b.customerEmail) + '</span>' : '') + '</div></td>' +
            '<td><div class="service-cell"><strong>' + esc(b.serviceName) + '</strong>' +
              '<span>' + (b.servicePrice > 0 ? '£' + b.servicePrice : 'Quote') + '</span></div></td>' +
            '<td><div class="date-cell"><strong>' + fmt.dMMMyyyy(b.slotDate) + '</strong>' +
              '<span>' + b.slotTime + '</span></div></td>' +
            '<td>' + statusBadge(b.status) + lateBadge(b) + '</td>' +
            (isAdmin()
                ? '<td data-stop><select class="form-control form-control--compact form-control--assign" ' +
                  'data-act="admin-assign" data-id="' + b.id + '">' + staffOptions(b.assignedStaffId) + '</select></td>'
                : '') +
            ((canManage() || canSeeCustomerDetails())
                ? '<td data-stop><div class="action-buttons">' + actionButtons(b) + '</div></td>'
                : '') +
        '</tr>';

        if (a.expandedId === b.id && canSeeCustomerDetails()) {
            const notes = jobNotesBlock(b.id);
            row += '<tr class="row-detail"><td colspan="' + columnCount + '">' +
              '<div class="booking-detail"><div class="booking-detail__grid">' +
                '<div><strong>Phone</strong><span>' + (b.customerPhone ? esc(b.customerPhone) : '—') + '</span></div>' +
                '<div><strong>Bike</strong><span>' + (b.bikeDescription ? esc(b.bikeDescription) : '—') + '</span></div>' +
                '<div><strong>Booked</strong><span>' + fmt.dMMMyyyyHHmm(b.createdAt) + '</span></div>' +
                '<div><strong>Notes</strong><span>' + (b.notes ? esc(b.notes) : '—') + '</span></div>' +
                '<div><strong>Job notes</strong>' + (notes || '<span>—</span>') + '</div>' +
              '</div>' +
              (b.photos.length ? '<div class="booking-detail__photos"><strong>Photos</strong>' + photoThumbs(b) + '</div>' : '') +
              dangerZone(b) +
              '</div></td></tr>';
        }
        return row;
    }).join('');

    return '<div class="admin-table-wrapper admin-table-wrapper--desktop-only"><table class="admin-table">' +
        '<thead><tr><th>Reference</th><th>Customer</th><th>Service</th><th>Date &amp; Time</th><th>Status</th>' +
          (isAdmin() ? '<th>Assigned To</th>' : '') +
          ((canManage() || canSeeCustomerDetails()) ? '<th class="col-actions">Actions</th>' : '') +
        '</tr></thead><tbody>' +
          (bookings.length ? '' :
            '<tr class="admin-table__empty-row"><td colspan="' + columnCount + '">' +
            emptyMessage + '</td></tr>') +
          rows +
        '</tbody></table></div>';
}

// Explicit prev/next rather than infinite scroll: on a phone, infinite scroll makes
// anything below the list unreachable.
function pager(label, page, totalPages, total, noun, action) {
    return '<nav class="pager" aria-label="' + label + '">' +
        '<button class="btn btn-outline pager__btn" ' + (page === 0 ? 'disabled' : '') +
          ' data-act="' + action + '" data-page="' + (page - 1) + '">' + icon('arrow-left') + ' Previous</button>' +
        '<span class="pager__status" aria-live="polite">Page ' + (page + 1) + ' of ' + totalPages +
          ' &middot; ' + total + ' ' + noun + (total === 1 ? '' : 's') + '</span>' +
        '<button class="btn btn-outline pager__btn" ' + (page >= totalPages - 1 ? 'disabled' : '') +
          ' data-act="' + action + '" data-page="' + (page + 1) + '">Next ' + icon('arrow-right') + '</button>' +
    '</nav>';
}

/* ── Calendar tab ──────────────────────────────────────────── */

function adminCalendarTab() {
    const a = state.admin;
    const day = a.calDay;
    const scoped = scopeStaffId();
    let dayBookings = bookingsByDate(day);
    if (scoped) dayBookings = dayBookings.filter((b) => b.assignedStaffId === scoped);

    const pending = dayBookings.filter((b) => b.status === STATUS.Pending).length;

    const dayIs = dayState(day);
    const blocked = blockedSlotsOn(day);

    const slots = slotsFor(day).map((slot) => {
        const inSlot = dayBookings.filter((b) => b.slotTime === slot);
        const content = inSlot.length === 0
            ? '<span class="day-cal-slot__free">' +
              (blocked.indexOf(slot) !== -1 ? 'Closed' : 'Free') + '</span>'
            : inSlot.map((b) =>
                '<div class="day-cal-booking ' + (b.status === STATUS.Cancelled ? 'day-cal-booking--cancelled' : '') + '">' +
                  '<div class="day-cal-booking__info">' +
                    '<div class="day-cal-booking__head"><strong>' + esc(b.customerName) + '</strong>' +
                      refBadge(b.reference) + statusBadge(b.status) + lateBadge(b) + '</div>' +
                    '<div class="day-cal-booking__meta"><span>' + esc(b.serviceName) + '</span>' +
                      (b.bikeDescription ? '<span> &middot; ' + esc(b.bikeDescription) + '</span>' : '') +
                      (canSeeCustomerDetails() && b.customerPhone ? '<span> &middot; ' + esc(b.customerPhone) + '</span>' : '') +
                    '</div>' +
                    (b.notes ? '<div class="day-cal-booking__notes">' + esc(b.notes) + '</div>' : '') +
                  '</div>' +
                  (rowHasActions(b) ? '<div class="day-cal-booking__actions">' + actionButtons(b) + '</div>' : '') +
                '</div>').join('');

        return '<div class="day-cal-slot ' + (inSlot.length === 0 ? 'day-cal-slot--free' : '') + '">' +
            '<div class="day-cal-slot__time">' + slot + '</div>' +
            '<div class="day-cal-slot__content">' + content + '</div>' +
        '</div>';
    }).join('');

    // Why the day isn't taking bookings, stated once at the top rather than left to be
    // inferred from a column of empty slots. Existing bookings still show below: a
    // closure added after the fact doesn't make the day's work disappear, and those are
    // exactly the ones somebody needs to deal with.
    const closure = dayIs === DAY_STATE.Closed ? allDayClosureOn(day) : null;
    const stillBooked = dayBookings.some((b) =>
        b.status === STATUS.Pending || b.status === STATUS.Confirmed);
    const notice = (dayIs === DAY_STATE.Closed || dayIs === DAY_STATE.NoMechanic)
        ? '<div class="day-cal__notice">' + icon('alert') +
            '<span>' + (dayIs === DAY_STATE.Closed
                ? 'Shop closed' + (closure && closure.reason ? ' — ' + esc(closure.reason) : '') + '. Not bookable.'
                : 'No mechanic in. Not bookable.') + '</span>' +
            (stillBooked ? '<strong>There are still bookings on this day.</strong>' : '') +
          '</div>'
        : '';

    return '<div class="day-cal">' +
        '<div class="day-cal__nav">' +
          '<div class="day-cal__nav-main">' +
            '<button class="cal-nav__btn" data-act="admin-cal-day" data-delta="-1" aria-label="Previous day">' +
              icon('chevron-left') + '</button>' +
            '<div class="day-cal__title">' +
              '<strong class="day-cal__date day-cal__date--full">' + fmt.ddddDMMMMyyyy(day) + '</strong>' +
              '<strong class="day-cal__date day-cal__date--short">' + fmt.dddDMMM(day) + '</strong>' +
              (sameDay(day, today()) ? '<span class="status-badge status-badge--confirmed">Today</span>' : '') +
            '</div>' +
            '<button class="cal-nav__btn" data-act="admin-cal-day" data-delta="1" aria-label="Next day">' +
              icon('chevron-right') + '</button>' +
          '</div>' +
          '<div class="day-cal__nav-tools">' +
            '<label class="sr-only" for="day-cal-date">Jump to date</label>' +
            '<input id="day-cal-date" type="date" class="form-control day-cal__picker" ' +
              'value="' + isoDate(day) + '" data-act="admin-cal-pick" />' +
            (sameDay(day, today()) ? '' : '<button class="btn btn-outline" data-act="admin-cal-today">Today</button>') +
          '</div>' +
        '</div>' +
        '<div class="day-cal__summary">' +
          '<span><strong>' + dayBookings.length + '</strong> booking' + (dayBookings.length === 1 ? '' : 's') + '</span>' +
          (pending ? '<span class="status-badge status-badge--pending">' + pending + ' pending</span>' : '') +
          (day.getDay() === 0 ? '<span class="day-cal__closed">Sunday hours — 11am to 5pm</span>' : '') +
        '</div>' +
        notice +
        '<div class="day-cal__slots">' + slots + '</div>' +
    '</div>';
}

/* ── Bulk customer import (CsvReader + CustomerImportService) ── */

// RFC 4180: quoted fields, commas and newlines inside quotes, "" as an escape, a BOM,
// and either line ending. Port of Services/CsvReader.cs.
function parseCsv(text) {
    const rows = [];
    if (!text) return rows;
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);

    let row = [], field = '', inQuotes = false, quoted = false;
    const finish = () => { const v = quoted ? field : field.trim(); field = ''; quoted = false; return v; };

    for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (inQuotes) {
            if (c !== '"') { field += c; continue; }
            if (text[i + 1] === '"') { field += '"'; i++; } else inQuotes = false;
            continue;
        }
        if (c === '"') { inQuotes = true; quoted = true; }
        else if (c === ',') row.push(finish());
        else if (c === '\r' || c === '\n') {
            if (c === '\r' && text[i + 1] === '\n') i++;
            row.push(finish());
            rows.push(row); row = [];
        } else field += c;
    }
    if (field.length || quoted || row.length) { row.push(finish()); rows.push(row); }
    while (rows.length && rows[rows.length - 1].every((f) => !f.trim())) rows.pop();
    return rows;
}

const IMPORT_MAX_ROWS = 5000;
const EMAIL_HEADERS = ['email', 'email address', 'e-mail'];
const NAME_HEADERS  = ['name', 'full name', 'fullname', 'customer name', 'customer'];
const PHONE_HEADERS = ['phone', 'phone number', 'mobile', 'telephone', 'tel'];
const IMPORT_TEMPLATE = 'email,name,phone\njane@example.com,Jane Smith,07700 900000\n';

const headerIndex = (header, names) =>
    header.findIndex((h) => names.includes(h.trim().toLowerCase()));

// CustomerImportService.Preview — classifies every row, writes nothing.
function importPreview(csv) {
    const rows = parseCsv(csv);
    if (!rows.length) return { rows: [], unknownHeaders: [], fatalError: 'That file is empty.' };

    const header = rows[0];
    const emailCol = headerIndex(header, EMAIL_HEADERS);
    if (emailCol < 0) {
        return { rows: [], unknownHeaders: [], fatalError:
            "No 'email' column found. The first row must be a header — download the template to see the expected columns." };
    }
    const nameCol = headerIndex(header, NAME_HEADERS);
    const phoneCol = headerIndex(header, PHONE_HEADERS);
    const known = [emailCol, nameCol, phoneCol];
    const unknownHeaders = header
        .map((h, i) => ({ h, i }))
        .filter((x) => !known.includes(x.i) && x.h.trim())
        .map((x) => x.h.trim());

    const body = rows.slice(1);
    if (body.length > IMPORT_MAX_ROWS) {
        return { rows: [], unknownHeaders, fatalError:
            'That file has ' + body.length.toLocaleString() + ' rows. The importer takes up to ' +
            IMPORT_MAX_ROWS.toLocaleString() + ' at a time.' };
    }

    const at = (r, i) => (i >= 0 && i < r.length ? r[i] : '');
    const seen = new Set();
    const out = [];

    body.forEach((raw, i) => {
        const line = i + 2;
        if (raw.every((f) => !f.trim())) return;   // blank line, not a row

        const email = at(raw, emailCol), name = at(raw, nameCol), phone = at(raw, phoneCol);

        if (!isValidEmail(email)) {
            out.push({ line, email, name, phone, outcome: 'Invalid', fills: [],
                problem: email.trim() ? "That email address isn't usable." : 'No email address.' });
            return;
        }
        // Phone is optional on import — unlike registration, where the shop needs a way
        // to reach someone about a booking they just made.
        if (phone.trim() && !isValidPhone(phone)) {
            out.push({ line, email, name, phone, outcome: 'Invalid', fills: [],
                problem: "That phone number isn't usable." });
            return;
        }

        const norm = email.trim().toLowerCase();
        if (seen.has(norm)) {
            out.push({ line, email: norm, name, phone, outcome: 'DuplicateInFile', fills: [],
                problem: 'Already appears earlier in this file.' });
            return;
        }
        seen.add(norm);

        const current = DB.customers.find((c) => c.email.toLowerCase() === norm);
        if (!current) {
            out.push({ line, email: norm, name: name.trim(), phone: phone.trim(), outcome: 'Create', fills: [] });
            return;
        }
        // Fill blanks only: the live record is more current than an old export.
        const fills = [];
        if (!current.fullName.trim() && name.trim()) fills.push('name');
        if (!current.phone.trim() && phone.trim()) fills.push('phone');
        out.push({ line, email: norm, name: name.trim(), phone: phone.trim(),
            outcome: fills.length ? 'Update' : 'Unchanged', fills });
    });

    return { rows: out, unknownHeaders, fatalError: null };
}

const importCountOf = (preview, outcome) => preview.rows.filter((r) => r.outcome === outcome).length;
const importActionable = (preview) => preview.rows.filter((r) => r.outcome === 'Create' || r.outcome === 'Update');

// CustomerImportService.Commit.
function importCommit(preview) {
    let created = 0, updated = 0, adopted = 0;

    importActionable(preview).forEach((row) => {
        if (row.outcome === 'Create') {
            const customer = {
                id: uid('cust'), email: row.email, fullName: row.name, phone: row.phone,
                // No password until they claim it, and explicitly unconfirmed.
                createdAt: now(), emailConfirmed: false
            };
            DB.customers.push(customer);
            created++;
            // Adopts their guest bookings, as AuthService.LinkGuestBookings does.
            DB.bookings.filter((b) => !b.customerId && b.customerEmail.toLowerCase() === row.email)
                .forEach((b) => { b.customerId = customer.id; adopted++; });
            return;
        }
        const existing = DB.customers.find((c) => c.email.toLowerCase() === row.email);
        if (!existing) return;
        if (row.fills.includes('name')) existing.fullName = row.name;
        if (row.fills.includes('phone')) existing.phone = row.phone;
        updated++;
    });

    persist();
    return { created, updated, adopted };
}

// CustomerDetailPanel.razor
// CustomerImportPanel.razor. Three states: pick a file, review what it will do, see
// what it did. Nothing is written until the review has been seen.
function customerImportPanel() {
    const a = state.admin;
    let out = '<div class="import-panel">' +
        '<button class="btn btn-outline customer-detail__back" data-act="admin-import-close">' +
          icon('arrow-left') + ' Back to customers</button>' +
        '<h3 class="import-panel__title">Import customers</h3>';

    if (!a.importResult) {
        out += '<p class="import-panel__intro">A CSV with an <code>email</code> column, plus ' +
            '<code>name</code> and <code>phone</code> if you have them. Existing customers are ' +
            'matched on their email address and left alone, except to fill in details you have ' +
            'and we don\'t. <a href="data:text/csv;charset=utf-8,' + encodeURIComponent(IMPORT_TEMPLATE) +
            '" download="fixlosophy-customer-import-template.csv">Download a template</a>.</p>' +
            '<div class="form-group"><label for="import-file">Choose a CSV file</label>' +
            '<input id="import-file" class="form-control" type="file" accept=".csv,text/csv" ' +
            'data-act="admin-import-file" /></div>';
    }

    if (a.importError) out += '<div class="import-panel__error" role="alert">' + esc(a.importError) + '</div>';

    const summaryRow = (count, label, mod) =>
        '<div class="import-summary__row"><span class="import-summary__count' +
        (mod ? ' import-summary__count--' + mod : '') + '">' + count + '</span> <span>' + label + '</span></div>';

    if (a.importPreview && !a.importResult) {
        const p = a.importPreview;
        const invalid = importCountOf(p, 'Invalid');
        out += '<div class="import-summary">' +
            summaryRow(importCountOf(p, 'Create'), 'to create', 'create') +
            summaryRow(importCountOf(p, 'Update'), 'existing, with blanks to fill in') +
            summaryRow(importCountOf(p, 'Unchanged'), 'already up to date — nothing to do') +
            summaryRow(importCountOf(p, 'DuplicateInFile'), 'repeated in the file — the first one wins') +
            summaryRow(invalid, "can't be used", invalid > 0 ? 'bad' : '') +
        '</div>';

        if (p.unknownHeaders.length) {
            out += '<p class="import-panel__note">Ignoring ' + esc(p.unknownHeaders.join(', ')) +
                ' — only email, name and phone are imported. If one of those is a mis-named ' +
                'column, rename it and upload again.</p>';
        }

        const problems = p.rows.filter((r) => r.outcome === 'Invalid' || r.outcome === 'DuplicateInFile');
        if (problems.length) {
            out += '<div class="import-problems"><h4>Rows that won\'t be imported</h4>' +
                '<div class="admin-table-wrapper"><table class="admin-table">' +
                '<thead><tr><th>Line</th><th>Email</th><th>Reason</th></tr></thead><tbody>' +
                problems.slice(0, 20).map((r) =>
                    '<tr><td>' + r.line + '</td><td class="text-muted-sm">' +
                    (r.email.trim() ? esc(r.email) : '—') + '</td>' +
                    '<td class="text-muted-sm">' + esc(r.problem) + '</td></tr>').join('') +
                '</tbody></table></div>' +
                (problems.length > 20
                    ? '<p class="import-panel__note">…and ' + (problems.length - 20) + ' more.</p>' : '') +
            '</div>';
        }

        if (importActionable(p).length) {
            out += '<label class="import-panel__opt"><input type="checkbox" data-act="admin-import-claims" ' +
                (a.importSendClaims ? 'checked' : '') + ' /><span>Email the ' +
                importCountOf(p, 'Create') + ' new customer' + (importCountOf(p, 'Create') === 1 ? '' : 's') +
                ' a link to set a password</span></label>' +
                '<p class="import-panel__note">Only people created by this import are emailed, so ' +
                'running it again won\'t send twice. Existing customers are never emailed.</p>' +
                '<div class="import-panel__actions">' +
                  '<button class="action-btn action-btn--primary" data-act="admin-import-commit">Import these customers</button>' +
                  '<button class="action-btn action-btn--keep" data-act="admin-import-reset">Choose another file</button>' +
                '</div>';
        } else {
            out += '<p class="import-panel__note">Nothing in this file needs importing.</p>' +
                '<button class="action-btn action-btn--keep" data-act="admin-import-reset">Choose another file</button>';
        }
    }

    if (a.importResult) {
        const r = a.importResult;
        out += '<div class="import-summary">' +
            summaryRow(r.created, 'customers created', 'create') +
            summaryRow(r.updated, 'existing records filled in') +
            summaryRow(r.adopted, 'past bookings attached to their new accounts') +
            (a.importSendClaims ? summaryRow(r.created, 'claim emails sent') : '') +
        '</div>' +
        '<div class="import-panel__actions">' +
          '<button class="action-btn action-btn--primary" data-act="admin-import-close">Done</button>' +
          '<button class="action-btn action-btn--keep" data-act="admin-import-reset">Import another file</button>' +
        '</div>';
    }

    return out + '</div>';
}

/* ── Availability tab (Components/Admin/AvailabilityTab.razor) ── */

// Every hour the shop could plausibly open or shut, widest trading day plus a margin.
// Kept as "HH:mm" strings because that is the form a closure stores and compares slots
// in. Selects rather than a free-text time: appointments start on the hour, so a typed
// time could name a window that clips no slot at all.
const HOUR_OPTIONS = Array.from({ length: 15 }, (_, i) => String(i + 7).padStart(2, '0') + ':00');

// Days the shop is shut, and mechanics being away. Admin-only.
//
// Two lists rather than one, because they answer different questions and only one is
// any of a customer's business: a closure shows its reason on the public calendar, an
// absence never does.
//
// The important part of this screen isn't adding a row — it's the warning that comes
// with it. Closing a week that already has bookings in it, without noticing, is how
// somebody turns up to a locked door.
function adminAvailabilityTab() {
    const av = state.admin.availability;

    const options = (values, selected) => values.map((v) =>
        '<option value="' + v + '"' + (v === selected ? ' selected' : '') + '>' + v + '</option>').join('');

    const warning = mechanicRuleApplies() ? '' :
        '<div class="admin-inline-warning">' + icon('alert') +
          '<span>Nobody is marked as working on bikes, so holidays won\'t close any days. ' +
          'Tick <strong>Works on bikes</strong> for whoever is in the workshop, on the ' +
          'Staff Management tab.</span></div>';

    const messages =
        (av.error ? '<div class="booking-error admin-inline-error">' + esc(av.error) + '</div>' : '') +
        (av.success ? '<div class="admin-success">' + icon('check') + ' ' + esc(av.success) + '</div>' : '');

    // ── Displaced bookings ───────────────────────────────────────────────────
    // Everyone currently booked into a day the shop can't serve — not just whoever the
    // last change stranded. It stays here until each one is dealt with, because a
    // warning you can navigate away from is a warning you will miss.
    //
    // Nothing happens to them automatically: cancelling somebody's appointment is a
    // decision, and the shop may well want to ring them instead.
    const stranded = findStrandedBookings();
    const affected = stranded.length === 0 ? '' :
        '<div class="availability-affected">' +
          '<h3>' + icon('alert') + ' ' + stranded.length + ' booking' +
            (stranded.length === 1 ? '' : 's') + " on days you're closed</h3>" +
          '<p class="text-muted-sm">These are still live — the customers haven\'t been told. ' +
            'Move each one to a time that works, or cancel it and invite them to rebook; ' +
            'either way they get an email.</p>' +
          stranded.map((b) => {
              const move = av.moves[b.id] || { date: isoDate(today()), slot: '' };
              const slots = availableSlots(parseIsoDate(move.date));
              return '<div class="availability-affected__row">' +
                '<div class="availability-affected__info">' +
                  '<strong>' + esc(b.customerName) + '</strong>' + refBadge(b.reference) +
                  '<span class="text-muted-sm">' + esc(b.serviceName) + ' &middot; ' +
                    fmt.dddDMMM(b.slotDate) + ' at ' + b.slotTime + '</span>' +
                '</div>' +
                '<div class="availability-affected__actions">' +
                  '<label class="sr-only" for="move-date-' + b.id + '">New date</label>' +
                  '<input id="move-date-' + b.id + '" type="date" class="form-control form-control--compact" ' +
                    'min="' + isoDate(today()) + '" max="' + isoDate(latestBookableDate()) + '" ' +
                    'value="' + move.date + '" data-act="avail-move-date" data-id="' + b.id + '" />' +
                  '<label class="sr-only" for="move-slot-' + b.id + '">New time</label>' +
                  '<select id="move-slot-' + b.id + '" class="form-control form-control--compact" ' +
                    'data-act="avail-move-slot" data-id="' + b.id + '">' +
                    '<option value="">— pick a time —</option>' +
                    slots.map((slot) => '<option value="' + slot + '"' +
                        (slot === move.slot ? ' selected' : '') + '>' + slot + '</option>').join('') +
                  '</select>' +
                  '<button class="action-btn action-btn--primary" data-act="avail-move" data-id="' + b.id + '" ' +
                    (move.slot ? '' : 'disabled') + '>Move &amp; email</button>' +
                  '<button class="action-btn action-btn--cancel" data-act="avail-cancel-invite" ' +
                    'data-id="' + b.id + '">Cancel &amp; invite rebooking</button>' +
                '</div>' +
              '</div>';
          }).join('') +
        '</div>';

    // ── Closures ─────────────────────────────────────────────────────────────
    const closures = upcomingClosures();
    const closureList = closures.length === 0
        ? '<div class="admin-empty"><p>No closures coming up.</p></div>'
        : '<ul class="availability-list">' + closures.map((c) =>
            '<li class="availability-list__item"><div>' +
              '<strong>' + describeDates(c.startDate, c.endDate) + '</strong>' +
              (closureIsAllDay(c) ? '' :
                '<span class="status-badge status-badge--pending">' + c.startTime + '–' + c.endTime + '</span>') +
              '<div class="text-muted-sm">' + esc(c.reason) + '</div>' +
            '</div>' +
            '<button class="action-btn action-btn--keep" data-act="avail-remove-closure" ' +
              'data-id="' + c.id + '">Remove</button></li>').join('') + '</ul>';

    // Part-day is the exception, so it's behind a toggle rather than two more fields
    // everyone has to skip past.
    const partDayFields = !av.closurePartDay ? '' :
        '<div class="form-row">' +
          '<div class="form-group"><label for="closure-start">Closed from</label>' +
            '<select id="closure-start" class="form-control" data-model="admin.availability.closureStart">' +
              options(HOUR_OPTIONS, av.closureStart) + '</select></div>' +
          '<div class="form-group"><label for="closure-end">Until</label>' +
            '<select id="closure-end" class="form-control" data-model="admin.availability.closureEnd">' +
              options(HOUR_OPTIONS, av.closureEnd) + '</select></div>' +
        '</div>' +
        '<p class="text-faint-sm">Slots starting inside that window go; the rest of the ' +
          'day stays bookable.</p>';

    const closurePanel = '<section class="availability-panel">' +
        '<h3>Shop closures</h3>' +
        '<p class="text-muted-sm">Customers see the reason on the booking calendar, so keep ' +
          'it short and true — “Bank holiday”, “Staff training”.</p>' +
        '<div class="availability-form">' +
          '<div class="form-row">' +
            '<div class="form-group"><label for="closure-from">First day closed</label>' +
              '<input id="closure-from" type="date" class="form-control" value="' + av.closureFrom + '" ' +
              'data-act="avail-closure-from" /></div>' +
            '<div class="form-group"><label for="closure-to">Last day closed</label>' +
              '<input id="closure-to" type="date" class="form-control" value="' + av.closureTo + '" ' +
              'data-model="admin.availability.closureTo" /></div>' +
          '</div>' +
          '<div class="form-group"><label for="closure-reason">Reason</label>' +
            '<input id="closure-reason" class="form-control" maxlength="80" placeholder="e.g. Christmas Day" ' +
            'data-model="admin.availability.closureReason" value="' + esc(av.closureReason) + '" /></div>' +
          '<label class="admin-toggle"><span>Only part of the day</span>' +
            '<input type="checkbox" data-act="avail-partday" ' +
            (av.closurePartDay ? 'checked' : '') + ' /></label>' +
          partDayFields +
          '<button class="btn btn-primary" data-act="avail-add-closure">Add closure</button>' +
        '</div>' + closureList +
    '</section>';

    // ── Staff absence ────────────────────────────────────────────────────────
    const absences = upcomingAbsences();
    const absenceList = absences.length === 0
        ? '<div class="admin-empty"><p>Nobody booked off.</p></div>'
        : '<ul class="availability-list">' + absences.map((ab) => {
            const who = staffById(ab.staffId);
            return '<li class="availability-list__item"><div>' +
              '<strong>' + esc(who ? who.fullName : 'Unknown') + '</strong>' +
              '<span class="status-badge status-badge--pending">' + esc(ab.type) + '</span>' +
              '<div class="text-muted-sm">' + describeDates(ab.startDate, ab.endDate) +
                (ab.note ? ' · ' + esc(ab.note) : '') + '</div>' +
            '</div>' +
            '<button class="action-btn action-btn--keep" data-act="avail-remove-absence" ' +
              'data-id="' + ab.id + '">Remove</button></li>';
          }).join('') + '</ul>';

    const activeStaff = DB.staff.filter((m) => m.isActive);
    const absencePanel = '<section class="availability-panel">' +
        '<h3>Staff away</h3>' +
        '<p class="text-muted-sm">Internal only — customers never see who\'s off. A day with ' +
          'no mechanic in stops taking bookings on its own.</p>' +
        '<div class="availability-form">' +
          '<div class="form-group"><label for="absence-staff">Who</label>' +
            '<select id="absence-staff" class="form-control" data-model="admin.availability.absenceStaffId">' +
              '<option value="">— pick someone —</option>' +
              activeStaff.map((m) => '<option value="' + m.id + '"' +
                  (m.id === av.absenceStaffId ? ' selected' : '') + '>' + esc(m.fullName) +
                  (m.isMechanic ? '' : ' (not a mechanic)') + '</option>').join('') +
            '</select></div>' +
          '<div class="form-row">' +
            '<div class="form-group"><label for="absence-from">First day away</label>' +
              '<input id="absence-from" type="date" class="form-control" value="' + av.absenceFrom + '" ' +
              'data-act="avail-absence-from" /></div>' +
            '<div class="form-group"><label for="absence-to">Last day away</label>' +
              '<input id="absence-to" type="date" class="form-control" value="' + av.absenceTo + '" ' +
              'data-model="admin.availability.absenceTo" /></div>' +
          '</div>' +
          '<div class="form-row">' +
            '<div class="form-group"><label for="absence-type">Type</label>' +
              '<select id="absence-type" class="form-control" data-model="admin.availability.absenceType">' +
                options(ABSENCE_TYPES, av.absenceType) + '</select></div>' +
            '<div class="form-group"><label for="absence-note">Note (optional)</label>' +
              '<input id="absence-note" class="form-control" maxlength="120" ' +
              'data-model="admin.availability.absenceNote" value="' + esc(av.absenceNote) + '" /></div>' +
          '</div>' +
          '<button class="btn btn-primary" data-act="avail-add-absence">Add absence</button>' +
        '</div>' + absenceList +
    '</section>';

    return warning + messages + affected +
        '<div class="availability-grid">' + closurePanel + absencePanel + '</div>';
}

/* ── Pricing tab ───────────────────────────────────────────── */

function adminPricingTab() {
    const a = state.admin;
    const services = servicesSorted();
    services.forEach((s) => {
        if (a.editPrices[s.id] === undefined) a.editPrices[s.id] = s.currentPrice;
    });

    const last = DB.priceAdjustments[0];
    const banner = last
        ? '<div class="pricing-info-banner">Last automatic increase: <strong>' + fmt.dMMMMyyyy(last.appliedAt) +
          '</strong> &nbsp;·&nbsp; Rate applied: <strong>' + (last.rate * 100).toFixed(2).replace(/\.?0+$/, '') +
          '%</strong> &nbsp;·&nbsp; Next increase: <strong>1 April ' + (last.year + 1) + '</strong></div>'
        : '';

    const cards = '<div class="admin-mobile-cards admin-mobile-cards--sticky-actions">' + services.map((s) =>
        '<div class="admin-edit-card">' +
          '<div class="admin-edit-card__title">' + esc(s.name) + '</div>' +
          '<div class="admin-edit-card__meta">' + esc(s.category) + ' &middot; ' + esc(s.duration) + '</div>' +
          (s.isQuoteOnly
            ? '<div class="admin-edit-card__field"><span>Price</span><span class="text-faint-sm">Quote only</span></div>'
            : '<div class="admin-edit-card__field"><span>Current</span>' +
                '<strong class="price-current">£' + s.currentPrice + '</strong></div>' +
              '<div class="admin-edit-card__field"><label for="price-m-' + s.id + '">New price (£)</label>' +
                '<input id="price-m-' + s.id + '" class="form-control form-control--price" type="number" min="0" ' +
                'step="1" inputmode="decimal" data-price-for="' + s.id + '" value="' + a.editPrices[s.id] + '" /></div>' +
              '<div class="admin-edit-card__actions">' +
                '<button class="btn btn-outline" data-act="admin-save-price" data-id="' + s.id + '">Save</button></div>') +
        '</div>').join('') + '</div>';

    const table = '<div class="admin-table-wrapper admin-table-wrapper--desktop-only"><table class="admin-table">' +
        '<thead><tr><th>Service</th><th>Category</th><th>Duration</th><th class="col-price">Current Price</th>' +
        '<th class="col-price-input">New Price (£)</th><th class="col-save">Save</th></tr></thead><tbody>' +
        services.map((s) =>
          '<tr><td><strong>' + esc(s.name) + '</strong></td>' +
            '<td class="text-muted-sm">' + esc(s.category) + '</td>' +
            '<td class="text-muted-sm">' + esc(s.duration) + '</td>' +
            '<td>' + (s.isQuoteOnly
                ? '<span class="text-faint-sm">Quote only</span>'
                : '<span class="price-current">£' + s.currentPrice + '</span>') + '</td>' +
            '<td>' + (s.isQuoteOnly
                ? '<span class="text-faint-sm">—</span>'
                : '<input class="form-control form-control--price" type="number" min="0" step="1" ' +
                  'data-price-for="' + s.id + '" value="' + a.editPrices[s.id] + '" />') + '</td>' +
            '<td>' + (s.isQuoteOnly ? '' :
                '<button class="action-btn action-btn--primary" data-act="admin-save-price" data-id="' + s.id +
                '">Save</button>') + '</td>' +
          '</tr>').join('') +
        '</tbody></table></div>';

    return '<div class="staff-mgmt">' +
        '<div class="pricing-tab-header"><h3>Service Prices</h3>' +
          '<button class="btn btn-primary" data-act="admin-save-all-prices">Save All</button></div>' +
        (a.priceSaveMessage ? '<div class="admin-success">' + icon('check') + ' ' + esc(a.priceSaveMessage) + '</div>' : '') +
        banner + cards +
        '<div class="pricing-sticky-actions">' +
          '<button class="btn btn-primary" data-act="admin-save-all-prices">Save All Prices</button></div>' +
        table +
    '</div>';
}

/* ── Staff management tab ──────────────────────────────────── */

function adminStaffTab() {
    const a = state.admin;
    const me = currentStaff();

    const addForm = '<div class="staff-add-card"><h3>Add Staff Member</h3>' +
        (a.staffFormError ? '<div class="booking-error admin-inline-error">' + esc(a.staffFormError) + '</div>' : '') +
        '<div class="form-row">' +
          '<div class="form-group"><label for="admin-full-name">Full Name</label>' +
            '<input id="admin-full-name" class="form-control" placeholder="Jane Smith" ' +
            'data-model="admin.staffForm.fullName" value="' + esc(a.staffForm.fullName) + '" /></div>' +
          '<div class="form-group"><label for="admin-email">Email</label>' +
            '<input id="admin-email" class="form-control" type="email" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="jane@fixlosophy.com" ' +
            'data-model="admin.staffForm.email" value="' + esc(a.staffForm.email) + '" /></div>' +
        '</div>' +
        '<div class="form-row">' +
          '<div class="form-group"><label for="admin-password">Password</label>' +
            '<input id="admin-password" class="form-control" type="password" placeholder="Temporary password" ' +
            'data-model="admin.staffForm.password" value="' + esc(a.staffForm.password) + '" /></div>' +
          '<div class="form-group"><label for="admin-role">Role</label>' +
            '<select id="admin-role" class="form-control" data-model="admin.staffForm.role">' +
              '<option value="Worker"' + (a.staffForm.role === 'Worker' ? ' selected' : '') + '>Worker</option>' +
              '<option value="Admin"' + (a.staffForm.role === 'Admin' ? ' selected' : '') + '>Admin</option>' +
            '</select></div>' +
        '</div>' +
        // Separate from the permissions below, and offered for admins too: this is
        // about the workshop, not the dashboard. An owner who turns spanners is a
        // mechanic; one who doesn't isn't.
        '<label class="admin-toggle"><span>Works on bikes ' +
          '<span class="text-muted-sm">— counts towards whether a day can take bookings</span></span>' +
          '<input type="checkbox" data-act="admin-staff-form-mechanic" ' +
          (a.staffForm.isMechanic ? 'checked' : '') + ' /></label>' +
        '<button class="btn btn-primary" data-act="admin-add-staff">Add Staff Member</button></div>';

    const toggle = (id, field, label, checked) =>
        '<label class="admin-toggle"><span>' + label + '</span>' +
        '<input type="checkbox" data-act="admin-staff-toggle" data-id="' + id + '" data-field="' + field + '" ' +
        (checked ? 'checked' : '') + ' /></label>';

    const cards = '<div class="admin-mobile-cards">' + DB.staff.map((m) => {
        const isMe = m.id === me.id;
        return '<div class="admin-edit-card">' +
            '<div class="admin-edit-card__title">' + esc(m.fullName) +
              (isMe ? ' <span class="text-muted-sm">(you)</span>' : '') + '</div>' +
            '<div class="admin-edit-card__meta">' + esc(m.email) + '</div>' +
            '<div class="admin-edit-card__field"><span>Role</span>' +
              '<span class="status-badge status-badge--' + (m.role === 'Admin' ? 'confirmed' : 'pending') + '">' +
                m.role + '</span></div>' +
            (m.role === 'Admin'
                ? '<div class="admin-edit-card__field"><span>Permissions</span>' +
                  '<span class="text-muted-sm">Full access</span></div>'
                : toggle(m.id, 'canViewAllBookings', 'View all bookings', m.canViewAllBookings) +
                  toggle(m.id, 'canManageBookings', 'Manage bookings', m.canManageBookings) +
                  toggle(m.id, 'canViewCustomerDetails', 'See customer details', m.canViewCustomerDetails)) +
            toggle(m.id, 'isMechanic', 'Works on bikes', m.isMechanic) +
            (isMe ? '' : toggle(m.id, 'isActive', 'Active', m.isActive)) +
            '<div class="admin-edit-card__actions">' +
              '<button class="btn btn-outline" data-act="admin-save-staff" data-id="' + m.id + '">Save</button></div>' +
        '</div>';
    }).join('') + '</div>';

    const checkbox = (id, field, checked) =>
        '<input type="checkbox" data-act="admin-staff-toggle" data-id="' + id + '" data-field="' + field + '" ' +
        (checked ? 'checked' : '') + ' />';

    const table = '<div class="admin-table-wrapper admin-table-wrapper--desktop-only"><table class="admin-table">' +
        '<thead><tr><th>Name</th><th>Email</th><th>Role</th><th>View All Bookings</th><th>Manage Bookings</th>' +
        '<th>Customer Details</th><th>Works on Bikes</th><th>Status</th><th>Save</th></tr></thead><tbody>' +
        DB.staff.map((m) => {
            const isMe = m.id === me.id;
            return '<tr>' +
                '<td><strong>' + esc(m.fullName) + '</strong>' +
                  (isMe ? ' <span class="text-muted-sm">(you)</span>' : '') + '</td>' +
                '<td class="text-muted-sm">' + esc(m.email) + '</td>' +
                '<td><span class="status-badge status-badge--' + (m.role === 'Admin' ? 'confirmed' : 'pending') + '">' +
                  m.role + '</span></td>' +
                (m.role === 'Admin'
                    ? '<td colspan="3" class="text-center text-muted-sm">Full access (Admin)</td>'
                    : '<td class="text-center">' + checkbox(m.id, 'canViewAllBookings', m.canViewAllBookings) + '</td>' +
                      '<td class="text-center">' + checkbox(m.id, 'canManageBookings', m.canManageBookings) + '</td>' +
                      '<td class="text-center">' + checkbox(m.id, 'canViewCustomerDetails', m.canViewCustomerDetails) + '</td>') +
                '<td class="text-center">' + checkbox(m.id, 'isMechanic', m.isMechanic) + '</td>' +
                '<td>' + (isMe
                    ? '<span class="text-muted-sm">—</span>'
                    : checkbox(m.id, 'isActive', m.isActive) +
                      '<span class="text-muted-sm admin-checkbox-label">Active</span>') + '</td>' +
                '<td><button class="action-btn action-btn--primary" data-act="admin-save-staff" ' +
                  'data-id="' + m.id + '">Save</button></td>' +
            '</tr>';
        }).join('') + '</tbody></table></div>';

    // Unticking the last mechanic doesn't shut the shop — the rule switches off
    // instead, which is the safe direction to fail in but silent unless said out loud.
    // See mechanicRuleApplies().
    const noMechanics = mechanicRuleApplies() ? '' :
        '<div class="admin-inline-warning">' +
          "Nobody is marked as working on bikes, so holidays won't close any days. " +
          'Tick <strong>Works on bikes</strong> for whoever is in the workshop.</div>';

    return '<div class="staff-mgmt">' + addForm +
        '<h3 class="admin-subheading">Current Staff</h3>' +
        (a.staffRowError ? '<div class="booking-error admin-inline-error">' + esc(a.staffRowError) + '</div>' : '') +
        noMechanics + cards + table +
    '</div>';
}
