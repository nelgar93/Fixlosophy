// Trading hours per weekday (0 = Sunday), as SiteContent.HoursFor.

    0: { open: 11, close: 17 },
    1: { open: 9, close: 19 },

const MAX_PER_SLOT = 1;
const MAX_ACTIVE_BOOKINGS_PER_EMAIL = 3;

const BOOKING_HORIZON_DAYS = 60;

const CUSTOMER_PAGE_SIZE = 20;

// BookingService.BuildSlotsFor — appointments start on the hour, the last starts a
// full hour before closing, and the lunch hour is skipped.
function slotsFor(date) {
    const hours = HOURS[date.getDay()];
    if (!hours) return [];
    const slots = [];
    for (let t = hours.open; t + 1 <= hours.close; t++) {
        if (t === LUNCH_START) continue;
        slots.push(String(t).padStart(2, '0') + ':00');
    }
    return slots;
}

const STATUS = {
    Pending: 'Pending',
    Confirmed: 'Confirmed',
    InProgress: 'InProgress',
    Completed: 'Completed',
    Cancelled: 'Cancelled'
};

const statusClass = (s) => s.toLowerCase();

// ── Dates ───────────────────────────────────────────────────

    const [y, m, d] = s.split('-').map(Number);
    return new Date(y, m - 1, d);

const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

    dMMMMyyyy: (d) => d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear(),
    ddddDMMMM: (d) => DAYS[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()],

function mulberry32(seed) {
    return function () {
        seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
}

// ── Reference numbers ───────────────────────────────────────
// BookingService.CreateBooking: FIX-{yyMMdd}-{nextval:D3}
function nextReference(when) {
    const d = when || now();
    const stamp = String(d.getFullYear() % 100).padStart(2, '0') +
                  String(d.getMonth() + 1).padStart(2, '0') +
                  String(d.getDate()).padStart(2, '0');
    return 'FIX-' + stamp + '-' + String(++DB.refSeq).padStart(3, '0');
}

// Weighted so the servicing packages dominate, as they do in the shop.
function pickService() {
    const weights = [22, 26, 8, 7, 4, 5, 4, 3, 6, 4, 4, 6, 1];
    const total = weights.reduce((a, b) => a + b, 0);
    let r = rand() * total;
    for (let i = 0; i < DB.services.length; i++) {
        r -= weights[i] || 1;
        if (r <= 0) return DB.services[i];
    }
    return DB.services[0];
}

function makeBooking(opts) {
    const svc = opts.service || pickService();
    const created = opts.createdAt || addDays(dateOnly(opts.slotDate), -(1 + Math.floor(rand() * 9)));
    created.setHours(9 + Math.floor(rand() * 11), Math.floor(rand() * 60), 0, 0);

    const b = {
        id: uid('bk'),
        reference: '',
        createdAt: created,
        customerName: opts.name,
        customerEmail: opts.email,
        customerPhone: opts.phone === undefined ? '07700 900000' : opts.phone,
        serviceCategory: svc.category,
        serviceName: svc.name,
        servicePrice: svc.isQuoteOnly ? 0 : svc.currentPrice,
        slotDate: dateOnly(opts.slotDate),
        slotTime: opts.slotTime,
        bikeDescription: opts.bike !== undefined ? opts.bike : pick(BIKE_POOL),
        notes: opts.notes !== undefined ? opts.notes : pick(ISSUE_POOL),
        status: opts.status,
        customerId: opts.customerId || null,
        assignedStaffId: opts.assignedStaffId || null,
        photos: []
    };

    const photoCount = opts.photos !== undefined ? opts.photos : (chance(0.18) ? 1 + Math.floor(rand() * 2) : 0);
    for (let i = 0; i < photoCount; i++) {
        b.photos.push({
            id: uid('photo'),
            bookingId: b.id,
            storagePath: 'Fixlosophy_Customers_Uploads/' + b.id + '/photo-' + (i + 1) + '.jpg',
            createdAt: created,
            label: pick(['Rear derailleur', 'Front wheel', 'Bottom bracket', 'Whole bike', 'Brake pads'])
        });
    }
    return b;
}

function statusForDate(slotDate) {
    const t = today();
    const d = dateOnly(slotDate);
    if (d < t) return chance(0.12) ? STATUS.Cancelled : STATUS.Completed;
    if (d.getTime() === t.getTime()) {
        const r = rand();
        if (r < 0.25) return STATUS.Completed;
        if (r < 0.45) return STATUS.InProgress;
        if (r < 0.8) return STATUS.Confirmed;
        return STATUS.Pending;
    }
    return chance(0.55) ? STATUS.Confirmed : STATUS.Pending;
}

function seedBookings() {
    const activeStaff = DB.staff.filter((s) => s.isActive);
    const rows = [];

    // Seeded data has to obey the same one-per-slot cap the booking wizard enforces,
    // or the calendar shows a slot the app itself would refuse to create. Occupancy
    // is tracked across the random pass and the fixtures alike: a fixture whose
    // preferred slot is full slides to the next free one on the same day.
    const occupancy = {};
    const key = (date, slot) => isoDate(date) + ' ' + slot;
    function claimSlot(date, preferred) {
        const slots = slotsFor(date);
        if (slots.length === 0) return null;
        const order = preferred ? [preferred].concat(slots.filter((s) => s !== preferred)) : slots;
        for (const slot of order) {
            const k = key(date, slot);
            if ((occupancy[k] || 0) < MAX_PER_SLOT) { occupancy[k] = (occupancy[k] || 0) + 1; return slot; }
        }
        return null;                                                 // the whole day is full
    }

    for (let offset = -52; offset <= 20; offset++) {
        const date = addDays(today(), offset);
        const slots = slotsFor(date);
        if (slots.length === 0) continue;

        let count;
        if (offset < 0) count = Math.floor(rand() * 4);              // a filled-in past
        // Today is always busy, but never so busy that the fixtures below can't land
        // and every slot reads as taken.
        else if (offset === 0) count = Math.max(1, Math.min(4, slots.length - 2));
        else if (offset <= 7) count = 1 + Math.floor(rand() * 3);    // the week ahead
        else count = rand() < 0.5 ? 1 : 0;                           // thinning out

        for (let i = 0; i < count; i++) {
            const slot = claimSlot(date, slots[Math.floor(rand() * slots.length)]);
            if (!slot) break;

            const asCustomer = chance(0.68);
            let opts;
            if (asCustomer) {
                const c = pick(DB.customers);
                opts = {
                    name: c.fullName, email: c.email, phone: c.phone, customerId: c.id,
                    bike: c.bikes.length ? pick(c.bikes).makeModel : ''
                };
            } else {
                const g = pick(SEED_GUESTS);
                opts = { name: g.name, email: g.email, phone: g.phone, customerId: null };
            }
            opts.slotDate = date;
            opts.slotTime = slot;
            opts.status = statusForDate(date);
            if (chance(0.62)) opts.assignedStaffId = pick(activeStaff).id;
            rows.push(makeBooking(opts));
        }
    }

    // ── Fixtures ────────────────────────────────────────────
    // The generated data above is plausible but not guaranteed to contain the cases
    // worth testing, so the interesting ones are placed explicitly.
    // They go through claimSlot too, so a fixture can never push a slot past the cap.
    const place = (opts) => {
        const slot = claimSlot(opts.slotDate, opts.slotTime);
        if (!slot) return;
        opts.slotTime = slot;
        rows.push(makeBooking(opts));
    };

    const aisha = DB.customers.find((c) => c.id === 'cust-aisha');
    const svc = (name) => DB.services.find((s) => s.name === name);

    // Two upcoming for the signed-in customer: one far enough out to cancel, one
    // inside the two-hour cutoff so the refusal path is reachable.
    place({

// A slot later today, at least `minHours` from now — or, if the shop is closing,
// the last one there is (which then lands inside the self-cancel cutoff, which is
// itself worth seeing).
function nextSlotWithin(minHours) {
    const slots = slotsFor(today());
    const cutoff = now().getHours() + minHours;
    const found = slots.find((s) => parseInt(s, 10) >= cutoff);
    return found || slots[slots.length - 1];
}

// The all-day closure is deliberately put on a day that already has a live booking:
// that is the case the screen exists for. Closing a day without noticing who was
// already in it is how somebody turns up to a locked door.
function seedAvailability() {
    DB.closures = [];
    DB.absences = [];

    const live = (b) => b.status === STATUS.Pending || b.status === STATUS.Confirmed;

    // The first booking more than a week out — far enough ahead that closing over it
    // reads as a decision somebody made, not as today going wrong.
    const horizon = addDays(today(), 8);
    const stranding = DB.bookings
        .filter((b) => live(b) && b.slotDate >= horizon)
        .sort((a, b) => a.slotDate - b.slotDate)[0];

    if (stranding) {
        const from = dateOnly(stranding.slotDate);

/* ── AvailabilityService.cs ──────────────────────────────────
   Whether the shop can take a booking on a given day, and why not when it can't.

   The rule, in one sentence: a day is bookable if it's a trading day, no all-day
   closure covers it, and at least one mechanic is working.

   That last clause is what makes a mechanic's holiday block bookings without any
   per-mechanic capacity. With one mechanic on the books, their being away means
   nobody is in, so the day closes itself. With two, one being away leaves the shop
   open at the same one-bike-at-a-time capacity it always had — MAX_PER_SLOT is about
   how many bikes fit on the stand, not how many people are in. */

// AvailabilityModels.cs — DayState. Why a day is or isn't bookable, as one answer, so
// the booking calendar and the admin calendar can't disagree about it.
const DAY_STATE = {
    Open: 'Open',               // trading hours, a mechanic in, no closure
    NotTrading: 'NotTrading',   // no slots defined for this weekday
    Closed: 'Closed',           // an all-day closure covers it
    NoMechanic: 'NoMechanic',   // nobody who turns a spanner is working
    Past: 'Past'
};

// AbsenceType. Order matters no more than it does in the enum, but the labels do.
const ABSENCE_TYPES = ['Holiday', 'Sick', 'Training', 'Other'];

// Closure.IsAllDay — both times null means the whole day.
const closureIsAllDay = (c) => !c.startTime || !c.endTime;

// Closure.Covers / StaffAbsence.Covers — inclusive at both ends, which is what people
// mean by "closed from the 24th to the 27th".
function coversDate(row, date) {
    const d = dateOnly(date).getTime();
    return d >= dateOnly(row.startDate).getTime() && d <= dateOnly(row.endDate).getTime();
}

// Closure.CoversSlot. Start-inclusive, end-exclusive: a 13:00–19:00 closure takes the
// 13:00 slot but not one starting at 19:00, matching how the trading-hours generator
// treats closing time. "HH:mm" strings compare as times, zero-padded as they are.
function closureCoversSlot(c, slot) {
    if (closureIsAllDay(c)) return true;
    return slot >= c.startTime && slot < c.endTime;
}

// Closure.DescribeDates / StaffAbsence.DescribeDates.
const describeDates = (from, to) => (sameDay(from, to)
    ? fmt.dddDMMMyyyy(from)
    : fmt.dddDMMM(from) + ' – ' + fmt.dddDMMMyyyy(to));

// AvailabilityService.MechanicRuleApplies. Nobody flagged as a mechanic means the
// rule isn't set up — not that every day is shut. The other reading turns unticking
// the last mechanic into a site that silently stops taking bookings with nothing on
// screen to explain it, so "none configured" degrades to the behaviour the shop had
// before absences existed. The Availability tab warns when this is false.
const mechanicIds = () => DB.staff.filter((s) => s.isActive && s.isMechanic).map((s) => s.id);
const mechanicRuleApplies = () => mechanicIds().length > 0;

// AvailabilityService.AllDayClosureOn. Part-day closures aren't returned: they narrow
// the slot list rather than shutting the day.
const allDayClosureOn = (date) =>
    DB.closures.find((c) => closureIsAllDay(c) && coversDate(c, date)) || null;

// AvailabilityService.BlockedSlotsOn — slot times a part-day closure takes out.
function blockedSlotsOn(date) {
    const partial = DB.closures.filter((c) => !closureIsAllDay(c) && coversDate(c, date));
    if (partial.length === 0) return [];
    return slotsFor(date).filter((slot) => partial.some((c) => closureCoversSlot(c, slot)));
}

// AvailabilityService.WorkingMechanicCount. A raw count, so zero means "nobody in" or
// "nobody configured"; pair it with mechanicRuleApplies() to tell those apart.
function workingMechanicCount(date) {
    const ids = mechanicIds();
    if (ids.length === 0) return 0;
    const away = DB.absences.filter((a) => coversDate(a, date)).map((a) => a.staffId);
    return ids.filter((id) => away.indexOf(id) === -1).length;
}

// AvailabilityService.StateOf.
function dayState(date) {
    if (dateOnly(date) < today()) return DAY_STATE.Past;
    if (slotsFor(date).length === 0) return DAY_STATE.NotTrading;
    if (allDayClosureOn(date)) return DAY_STATE.Closed;
    if (mechanicRuleApplies() && workingMechanicCount(date) === 0) return DAY_STATE.NoMechanic;
    return DAY_STATE.Open;
}

// DayAvailability.CustomerLabel — what the calendar puts on a day the customer can't
// book. Null when the day is simply full, which the calendar already styles on its
// own. NoMechanic deliberately carries no reason: whose holiday it is is not a
// customer's business.
function customerLabel(dayIs, reason) {
    if (dayIs === DAY_STATE.Closed) return reason ? 'Closed — ' + reason : 'Closed';
    if (dayIs === DAY_STATE.NoMechanic) return 'Closed';
    return null;
}

// BookingService.GetAvailableSlots
function availableSlots(date) {
    if (dayState(date) !== DAY_STATE.Open) return [];

    const blocked = blockedSlotsOn(date);
    const booked = {};
    DB.bookings
        .filter((b) => sameDay(b.slotDate, date) && b.status !== STATUS.Cancelled)
        .forEach((b) => { booked[b.slotTime] = (booked[b.slotTime] || 0) + 1; });

    return slotsFor(date).filter((slot) => {
        if (blocked.indexOf(slot) !== -1) return false;
        if (sameDay(date, today()) && parseInt(slot, 10) <= now().getHours()) return false;
        return (booked[slot] || 0) < MAX_PER_SLOT;
    });
}

const isDateAvailable = (date) => availableSlots(date).length > 0;

// BookingService.GetDateAvailabilityForMonth — a DayAvailability per day, not just a
// yes/no. The calendar needs the reason as well as the verdict: "Closed — Bank
// holiday" and "fully booked" are different disappointments, and only one of them
// means come back tomorrow.
function monthAvailability(year, month) {
    const map = {};
    const days = new Date(year, month + 1, 0).getDate();
    for (let d = 1; d <= days; d++) {
        const date = new Date(year, month, d);
        const dayIs = dayState(date);
        const closure = dayIs === DAY_STATE.Closed ? allDayClosureOn(date) : null;
        const reason = closure ? closure.reason : null;
        map[isoDate(date)] = {
            state: dayIs,
            reason,
            hasFreeSlot: dayIs === DAY_STATE.Open && availableSlots(date).length > 0,
            // DayAvailability.IsBookable
            get bookable() { return this.state === DAY_STATE.Open && this.hasFreeSlot; },
            label: customerLabel(dayIs, reason)
        };
    }
    return map;
}

// BookingService.GetStats / GetStatsForStaff
function statsFor(bookings) {
    const t = today(), tomorrow = addDays(t, 1);
    return {
        total: bookings.length,
        today: bookings.filter((b) => b.slotDate >= t && b.slotDate < tomorrow).length,
        pending: bookings.filter((b) => b.status === STATUS.Pending).length,
        confirmed: bookings.filter((b) => b.status === STATUS.Confirmed).length
    };
}

// BookingService.SortUpcoming / SortDateAsc / SortDateDesc.
const SORT_UPCOMING  = 'Upcoming';
const SORT_DATE_ASC  = 'DateAsc';
const SORT_DATE_DESC = 'DateDesc';
const SORT_OPTIONS = [SORT_UPCOMING, SORT_DATE_ASC, SORT_DATE_DESC];
const sortLabel = (s) =>
    s === SORT_DATE_ASC  ? 'Date: oldest first' :
    s === SORT_DATE_DESC ? 'Date: newest first' : 'Soonest first';

// BookingService.GetBookingsPage — filter, search, sort and page, in that order.
function bookingsPage(staffId, filter, search, page, pageSize, sort) {
    let q = DB.bookings.slice();
    if (staffId) q = q.filter((b) => b.assignedStaffId === staffId);

    const t = today(), tomorrow = addDays(t, 1);
    if (filter === 'Today') q = q.filter((b) => b.slotDate >= t && b.slotDate < tomorrow);
    else if (filter === 'In Progress') q = q.filter((b) => b.status === STATUS.InProgress);
    else if (filter !== 'All') q = q.filter((b) => b.status === filter);

    if (search && search.trim()) {
        const term = search.trim().toLowerCase();
        q = q.filter((b) =>
            b.customerName.toLowerCase().includes(term) ||
            b.customerEmail.toLowerCase().includes(term) ||
            b.serviceName.toLowerCase().includes(term) ||
            b.reference.toLowerCase().includes(term));
    }

    const total = q.length;

    // Ported from GetBookingsPage's three ORDER BY shapes. The default puts what is
    // coming up on top and history below it, most recent first; slotTime is a
    // zero-padded "HH:mm" string, so comparing it as text is chronological. id is the
    // final tiebreak — paging needs a total order or a row can land on two pages.
    // `t` is today's date, already computed above for the Today filter.
    const byTime = (a, b) => a.slotTime.localeCompare(b.slotTime) || a.id.localeCompare(b.id);
    q.sort((a, b) => {
        if (sort === SORT_DATE_ASC)  return (a.slotDate - b.slotDate) || byTime(a, b);
        if (sort === SORT_DATE_DESC) return (b.slotDate - a.slotDate) || byTime(a, b);
        const aPast = a.slotDate < t, bPast = b.slotDate < t;
        if (aPast !== bPast) return aPast ? 1 : -1;          // upcoming first
        return (aPast ? b.slotDate - a.slotDate              // past: most recent first
                      : a.slotDate - b.slotDate) || byTime(a, b);
    });

    return { items: q.slice(Math.max(0, page) * pageSize, Math.max(0, page) * pageSize + pageSize), total };
}

const bookingsByDate = (date) => DB.bookings
    .filter((b) => sameDay(b.slotDate, date))
    .sort((a, b) => a.slotTime.localeCompare(b.slotTime));

const bookingsForCustomer = (customerId) => DB.bookings
    .filter((b) => b.customerId === customerId)
    .sort((a, b) => (b.slotDate - a.slotDate) || b.slotTime.localeCompare(a.slotTime));

const notesForBooking = (bookingId) => DB.notes
    .filter((n) => n.bookingId === bookingId)
    .sort((a, b) => b.createdAt - a.createdAt);

// CustomerService.GetCustomerVisibleNotesByBooking — shared notes only.
function sharedNotesByBooking(customerId) {
    const map = {};
    DB.notes
        .filter((n) => n.customerId === customerId && n.visibleToCustomer && n.bookingId)
        .forEach((n) => {
            (map[n.bookingId] = map[n.bookingId] || []).push({ body: n.body, createdAt: n.createdAt });
        });
    return map;
}

// CustomerService.Search
function customerSummaries(search, page) {
    let list = DB.customers.slice();
    if (search && search.trim()) {
        const term = search.trim().toLowerCase();
        list = list.filter((c) =>
            c.fullName.toLowerCase().includes(term) ||
            c.email.toLowerCase().includes(term) ||
            c.phone.toLowerCase().includes(term));
    }
    const rows = list.map((c) => {
        const bookings = bookingsForCustomer(c.id);
        const visits = bookings.filter((b) => b.status === STATUS.Completed);
        return {
            id: c.id, fullName: c.fullName, email: c.email, phone: c.phone,
            memberSince: c.createdAt, bookingCount: bookings.length,
            lastVisit: visits.length ? visits.map((b) => b.slotDate).sort((a, b) => b - a)[0] : null
        };
    }).sort((a, b) => a.fullName.localeCompare(b.fullName));

    return {
        items: rows.slice(page * CUSTOMER_PAGE_SIZE, page * CUSTOMER_PAGE_SIZE + CUSTOMER_PAGE_SIZE),
        total: rows.length
    };
}

// CustomerService.GetDetail
// BookingId -> its notes, newest first, for the customer detail panel.
function notesByBooking(bookings) {
    const ids = new Set(bookings.map((b) => b.id));
    const map = {};
    DB.notes
        .filter((n) => n.bookingId && ids.has(n.bookingId))
        .sort((a, b) => b.createdAt - a.createdAt)
        .forEach((n) => { (map[n.bookingId] = map[n.bookingId] || []).push(n); });
    return map;
}

function customerDetail(id) {
    const c = customerById(id);
    if (!c) return null;
    const bookings = bookingsForCustomer(id);
    const completed = bookings.filter((b) => b.status === STATUS.Completed);
    const visits = completed.map((b) => b.slotDate).sort((a, b) => a - b);
    return {
        customer: c,
        bookings,
        // Bookings under the same email made before the account existed.
        unlinkedGuestBookings: DB.bookings
            .filter((b) => !b.customerId && b.customerEmail.toLowerCase() === c.email.toLowerCase())
            .sort((a, b) => b.slotDate - a.slotDate),
        // Split by what each note is about. bookingNotes covers the unlinked guest
        // bookings too: a note on one has no customerId, so filtering by customer
        // alone left it stored and invisible here.
        generalNotes: DB.notes
            .filter((n) => n.customerId === id && !n.bookingId)
            .sort((a, b) => b.createdAt - a.createdAt),
        bookingNotes: notesByBooking(bookings.concat(
            DB.bookings.filter((b) => !b.customerId && b.customerEmail.toLowerCase() === c.email.toLowerCase()))),
        completedCount: completed.length,
        // Completed jobs only — a pending or cancelled booking isn't money.
        lifetimeSpend: completed.reduce((sum, b) => sum + b.servicePrice, 0),
        firstVisit: visits[0] || null,
        lastVisit: visits[visits.length - 1] || null
    };
}

// NotificationService.GetRecent / UnreadCount
function notificationsFor(staffId, unreadOnly) {
    const cutoff = addDays(now(), -30);
    return DB.notifications
        .filter((n) => n.createdAt >= cutoff)
        .filter((n) => n.targetStaffId === null || n.targetStaffId === staffId)
        .map((n) => Object.assign({}, n, { isRead: isNotificationRead(n.id, staffId) }))
        .filter((n) => !unreadOnly || !n.isRead)
        .slice(0, 20);
}
const isNotificationRead = (notificationId, staffId) =>
    DB.reads.some((r) => r.notificationId === notificationId && r.staffId === staffId);
const unreadCountFor = (staffId) => notificationsFor(staffId, true).length;

/* ============================================================
   Commands — the write side
   ============================================================ */

// AuthService.IsValidPhone. Accepts the punctuation people write in numbers —
// spaces, brackets, dashes, dots, a leading + — and nothing else. This used to count
// digits and ignore everything around them, so "call me on 07700 900000" was stored
// and reached the dashboard as a dead Call button.
const isValidPhone = (phone) => {
    const t = (phone || '').trim();
    if (!t || t.length > 20) return false;
    if (!/^[0-9 ()+.\-]+$/.test(t)) return false;
    if (t.indexOf('+') > 0) return false;      // country-code prefix, not a suffix
    const digits = t.replace(/\D/g, '').length;
    return digits >= 7 && digits <= 15;
};

// AuthService.IsValidEmail — a whole address, not just something containing an '@'.
const isValidEmail = (email) => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test((email || '').trim());

// BookingService.CreateBooking, validation and all.
// BookingService.CountUpcomingForEmail. Shared with the wizard, which asks it before
// anything is filled in — the cap used to surface only at the final Confirm click.
function countUpcomingForEmail(email) {
    const norm = (email || '').trim().toLowerCase();
    if (!norm) return 0;
    const t = today();
    return DB.bookings.filter((b) =>
        b.customerEmail.toLowerCase() === norm &&
        dateOnly(b.slotDate) >= t && b.status !== STATUS.Cancelled).length;
}

function createBooking(input) {
    const email = (input.customerEmail || '').trim().toLowerCase();

    // Their own duplicate first: at one booking per slot the two conditions coincide,
    // and this is the more useful of the two answers when the clash is with themselves.
    const duplicate = DB.bookings.some((b) =>
        b.customerEmail.toLowerCase() === email &&
        sameDay(b.slotDate, input.slotDate) && b.slotTime === input.slotTime &&
        b.status !== STATUS.Cancelled);
    if (duplicate) return { error: 'You already have a booking at this time.' };

    const taken = DB.bookings.filter((b) =>
        sameDay(b.slotDate, input.slotDate) && b.slotTime === input.slotTime &&
        b.status !== STATUS.Cancelled).length;
    if (taken >= MAX_PER_SLOT)
        return { error: 'Sorry, this time slot has just been taken. Please pick another time.' };

    const upcoming = countUpcomingForEmail(email);
    if (upcoming >= MAX_ACTIVE_BOOKINGS_PER_EMAIL)
        return { error: 'You already have ' + MAX_ACTIVE_BOOKINGS_PER_EMAIL +
                        ' upcoming bookings — please contact us if you need to change one.' };

    const booking = {
        id: uid('bk'),
        reference: nextReference(now()),
        createdAt: now(),
        customerName: input.customerName,
        customerEmail: (input.customerEmail || '').trim(),
        customerPhone: (input.customerPhone || '').trim(),
        serviceCategory: input.serviceCategory,
        serviceName: input.serviceName,
        servicePrice: input.servicePrice,
        slotDate: dateOnly(input.slotDate),
        slotTime: input.slotTime,
        bikeDescription: input.bikeDescription || '',
        notes: input.notes || '',
        status: STATUS.Pending,
        customerId: input.customerId || null,
        assignedStaffId: null,
        photos: (input.photos || []).map((p, i) => ({
            id: uid('photo'), bookingId: '', storagePath: p.name, createdAt: now(),
            label: p.name, dataUrl: p.dataUrl
        }))
    };
    booking.photos.forEach((p) => { p.bookingId = booking.id; });
    DB.bookings.push(booking);

    raiseNotification({
        type: 'NewBooking',
        title: 'New booking — ' + booking.serviceName,
        body: booking.customerName + ' · ' + fmt.dMMM(booking.slotDate) + ' at ' + booking.slotTime,
        linkUrl: '#/admin'
    });
    persist();
    return { booking };
}

// BookingService.CancelOwnBooking — the customer id is part of the lookup, so one
// customer can never cancel another's booking.
// BookingService.CanCustomerCancel. Deliberately narrower than ALLOWED_TRANSITIONS,
// which is what *staff* may do: staff can cancel a job mid-repair because they're
// holding the bike, and a customer can't.
function canCustomerCancel(status) {
    return status === STATUS.Pending || status === STATUS.Confirmed;
}

// BookingService.SelfCancelBlockedReason. One rule read by both sides — the account
// page picks its control from it, cancelOwnBooking decides from it — so the button
// can't offer what the call behind it refuses.
function selfCancelBlockedReason(booking) {
    if (booking.status === STATUS.Cancelled) return 'That booking is already cancelled.';
    if (booking.status === STATUS.Completed) return 'That booking is already completed.';
    if (!canCustomerCancel(booking.status))
        return 'We’ve already started work on this one — please call us on ' +
               SITE.phoneDisplay + ' and we’ll sort it out with you.';
    if ((slotStart(booking) - now()) / 36e5 < SELF_CANCEL_CUTOFF_HOURS)
        return 'This booking is less than ' + SELF_CANCEL_CUTOFF_HOURS +
               ' hours away — please call us on ' + SITE.phoneDisplay +
               ' so we can free the slot properly.';
    return null;
}

function cancelOwnBooking(customerId, bookingId) {
    const booking = DB.bookings.find((b) => b.id === bookingId && b.customerId === customerId);
    if (!booking) return { error: 'We couldn’t find that booking.' };

    const blocked = selfCancelBlockedReason(booking);
    if (blocked) return { error: blocked };

    booking.status = STATUS.Cancelled;
    raiseNotification({
        type: 'BookingCancelled',
        title: 'Booking cancelled',
        body: booking.customerName + ' cancelled ' + booking.reference + ' (' + booking.serviceName + ')',
        linkUrl: '#/admin',
        targetStaffId: booking.assignedStaffId
    });
    persist();
    return { booking };
}

// BookingService.AllowedTransitions. Forward through the job, out to Cancelled at any
// point before it is finished, and back to Confirmed from either terminal state when
// someone mis-taps. This used to be an unconditional setter.
const ALLOWED_TRANSITIONS = {
    [STATUS.Pending]:    [STATUS.Confirmed, STATUS.Cancelled],
    [STATUS.Confirmed]:  [STATUS.InProgress, STATUS.Cancelled],
    [STATUS.InProgress]: [STATUS.Completed, STATUS.Cancelled],
    [STATUS.Completed]:  [STATUS.Confirmed],   // Reopen
    [STATUS.Cancelled]:  [STATUS.Confirmed]    // Reopen
};

const canTransition = (from, to) => (ALLOWED_TRANSITIONS[from] || []).includes(to);

// BookingService.NextStage — the next step forward, or null when there isn't one.
const nextStage = (from) =>
    from === STATUS.Pending    ? STATUS.Confirmed  :
    from === STATUS.Confirmed  ? STATUS.InProgress :
    from === STATUS.InProgress ? STATUS.Completed  : null;

// Admin.razor's StageLabel — the step being taken, not the state it lands in.
const stageLabel = (next) =>
    next === STATUS.Confirmed  ? 'Confirm booking' :
    next === STATUS.InProgress ? 'Start work'      :
    next === STATUS.Completed  ? 'Mark complete'   : String(next);

// NotificationService.RaiseBookingCancelled. The real method existed but had no
// production caller at all, so the bell never showed a cancellation from either side.
// Targets the assigned mechanic, or broadcasts when nobody is assigned.
function raiseBookingCancelled(b) {
    if (!b) return;
    DB.notifications.unshift({
        id: uid('notif'), type: 'BookingCancelled', createdAt: now(),
        title: 'Booking cancelled',
        body: b.customerName + ' — ' + b.reference + ' (' + b.serviceName + ')',
        linkUrl: '#/admin', targetStaffId: b.assignedStaffId || null
    });
    persist();
}

function updateStatus(id, status) {
    const b = bookingById(id);
    if (!b) return false;
    if (!canTransition(b.status, status)) return false;
    b.status = status;
    persist();
    return true;
}

function deleteBooking(id) {
    const i = DB.bookings.findIndex((b) => b.id === id);
    if (i < 0) return false;
    DB.bookings.splice(i, 1);
    persist();
    return true;
}

// BookingService.RescheduleBooking. Keeps the reference the customer already has in
// their confirmation email, and the notes and photos attached to the job — which is
// what you actually want when a closure has displaced somebody. Goes through the same
// availability checks a new booking does.
function rescheduleBooking(bookingId, newDate, newSlot) {
    const booking = DB.bookings.find((b) => b.id === bookingId);
    if (!booking) return { error: 'That booking no longer exists.' };

    if (booking.status === STATUS.Cancelled || booking.status === STATUS.Completed)
        return { error: "That booking is already closed — it can't be moved." };

    if (sameDay(booking.slotDate, newDate) && booking.slotTime === newSlot)
        return { booking };                                          // nothing to do

    if (dateOnly(newDate) < today()) return { error: 'That date has already passed.' };
    if (dateOnly(newDate) > latestBookableDate())
        return { error: "We're only booking up to " + fmt.dMMMM(latestBookableDate()) + '.' };
    if (dayState(newDate) !== DAY_STATE.Open) return { error: "We're not open that day." };
    if (slotsFor(newDate).indexOf(newSlot) === -1)
        return { error: "That isn't one of the day's slots." };
    if (blockedSlotsOn(newDate).indexOf(newSlot) !== -1)
        return { error: "We're closed at that time." };

    const taken = DB.bookings.some((b) =>
        b.id !== bookingId && sameDay(b.slotDate, newDate) && b.slotTime === newSlot &&
        b.status !== STATUS.Cancelled);
    if (taken) return { error: 'Something else is already booked into that slot.' };

    booking.slotDate = dateOnly(newDate);
    booking.slotTime = newSlot;
    persist();
    return { booking };
}

/* ── AvailabilityService — the writes ───────────────────────── */

// AvailabilityService.FindStrandedBookings. Every future booking currently sitting on
// a day, or in a slot, the shop can no longer serve.
//
// Distinct from "what did the change I just made strand?": this answers "what is
// stranded right now?", and it is the one that matters. Showing displaced bookings
// only in the moment they were created meant switching tabs made them vanish, and a
// warning you can navigate away from is a warning you will miss.
function findStrandedBookings() {
    return DB.bookings
        .filter((b) => (b.status === STATUS.Pending || b.status === STATUS.Confirmed) &&
                       dateOnly(b.slotDate) >= today())
        .filter((b) => {
            const dayIs = dayState(b.slotDate);
            if (dayIs === DAY_STATE.Closed || dayIs === DAY_STATE.NoMechanic) return true;
            // Open, but this particular slot is inside a part-day closure.
            return blockedSlotsOn(b.slotDate).indexOf(b.slotTime) !== -1;
        })
        .sort((a, b) => (a.slotDate - b.slotDate) || a.slotTime.localeCompare(b.slotTime));
}

// AvailabilityService.GetClosures / GetAbsences — future only by default.
const upcomingClosures = () =>
    DB.closures.filter((c) => dateOnly(c.endDate) >= today())
               .sort((a, b) => a.startDate - b.startDate);

const upcomingAbsences = () =>
    DB.absences.filter((a) => dateOnly(a.endDate) >= today())
               .sort((a, b) => a.startDate - b.startDate);

// AvailabilityService.AddClosure, validation and all.
function addClosure(input) {
    if (dateOnly(input.endDate) < dateOnly(input.startDate))
        return { error: "The last day can't be before the first day." };

    if (!String(input.reason || '').trim())
        return { error: 'Give the closure a reason — customers see it on the calendar.' };

    // Either both times or neither. One alone is ambiguous: does "from 13:00" mean
    // until closing, or from opening until 13:00?
    const hasStart = !!input.startTime;
    const hasEnd = !!input.endTime;
    if (hasStart !== hasEnd)
        return { error: 'For a part-day closure, set both a start and an end time. ' +
                        'Leave both blank to close all day.' };

    if (hasStart && input.endTime <= input.startTime)
        return { error: "The closure's end time must be after its start time." };

    const closure = {
        id: uid('cls'),
        startDate: dateOnly(input.startDate),
        endDate: dateOnly(input.endDate),
        startTime: hasStart ? input.startTime : null,
        endTime: hasStart ? input.endTime : null,
        reason: String(input.reason).trim(),
        createdAt: now(),
        createdByStaffId: input.createdByStaffId || null
    };
    DB.closures.push(closure);
    persist();
    return { closure };
}

function removeClosure(id) {
    const i = DB.closures.findIndex((c) => c.id === id);
    if (i === -1) return false;
    DB.closures.splice(i, 1);
    persist();
    return true;
}

// AvailabilityService.AddAbsence.
function addAbsence(input) {
    if (dateOnly(input.endDate) < dateOnly(input.startDate))
        return { error: "The last day can't be before the first day." };

    const staff = staffById(input.staffId);
    if (!staff) return { error: 'That staff member no longer exists.' };

    const absence = {
        id: uid('abs'),
        staffId: input.staffId,
        startDate: dateOnly(input.startDate),
        endDate: dateOnly(input.endDate),
        type: input.type || 'Holiday',
        note: String(input.note || '').trim(),
        createdAt: now()
    };
    DB.absences.push(absence);
    persist();
    return { absence };
}

function removeAbsence(id) {
    const i = DB.absences.findIndex((a) => a.id === id);
    if (i === -1) return false;
    DB.absences.splice(i, 1);
    persist();
    return true;
}

function assignStaff(bookingId, staffId) {
    const b = bookingById(bookingId);
    if (!b) return false;
    b.assignedStaffId = staffId || null;
    persist();
    return true;
}

function addNote(opts) {
    DB.notes.push({
        id: uid('note'),
        customerId: opts.customerId || null,
        bookingId: opts.bookingId || null,
        authorStaffId: opts.authorStaffId,
        createdAt: now(),
        body: opts.body,
        visibleToCustomer: !!opts.visible
    });
    persist();
}

function deleteNote(id) {
    const i = DB.notes.findIndex((n) => n.id === id);
    if (i >= 0) { DB.notes.splice(i, 1); persist(); }
}

function raiseNotification(n) {
    DB.notifications.unshift({
        id: uid('notif'),
        type: n.type,
        createdAt: now(),
        title: n.title,
        body: n.body,
        linkUrl: n.linkUrl || '#/admin',
        targetStaffId: n.targetStaffId || null
    });
}

function markAllRead(staffId) {
    notificationsFor(staffId, true).forEach((n) => {
        DB.reads.push({ notificationId: n.id, staffId, readAt: now() });
    });
    persist();
}

function submitEnquiry(model) {
    const enquiry = {
        id: uid('enq'), createdAt: now(), name: model.name, email: model.email,
        phone: model.phone || '', service: model.service || '',
        bikeDescription: model.bikeDescription || '', message: model.message,
        preferredDate: model.preferredDate ? parseIsoDate(model.preferredDate) : null,
        handledAt: null
    };
    DB.enquiries.unshift(enquiry);
    raiseNotification({
        type: 'NewEnquiry',
        title: 'New enquiry — ' + enquiry.name,
        body: enquiry.name + ': ' + enquiry.message.slice(0, 70) + (enquiry.message.length > 70 ? '…' : ''),
        linkUrl: '#/admin'
    });
    persist();
    return true;
}

// AuthService.UpdateCustomerProfile — the phone became required, so it's validated.
function updateCustomerProfile(id, fullName, phone) {
    const c = customerById(id);
    if (!c) return { error: 'Account not found.' };
    if (!fullName.trim()) return { error: 'Please enter your name.' };
    if (!isValidPhone(phone)) return { error: 'Please enter a valid phone number.' };
    c.fullName = fullName.trim();
    c.phone = phone.trim();
    persist();
    return { customer: c };
}

function addBike(customerId, makeModel) {
    const c = customerById(customerId);
    if (!c) return { error: 'Account not found.' };
    if (!makeModel.trim()) return { error: 'Please enter the bike’s make and model.' };
    if (c.bikes.length >= 10) return { error: 'You can save up to 10 bikes.' };
    if (c.bikes.some((b) => b.makeModel.toLowerCase() === makeModel.trim().toLowerCase()))
        return { error: 'That bike is already saved.' };
    c.bikes.push({ id: uid('bike'), makeModel: makeModel.trim(), createdAt: now() });
    persist();
    return { ok: true };
}

function removeBike(customerId, bikeId) {
    const c = customerById(customerId);
    if (!c) return;
    const i = c.bikes.findIndex((b) => b.id === bikeId);
    if (i >= 0) { c.bikes.splice(i, 1); persist(); }
}

// AuthService.DeleteCustomerAccount — the bookings survive, anonymised, because the
// record of work carried out has to.
function deleteCustomerAccount(id) {
    const c = customerById(id);
    if (!c) return false;
    DB.bookings.filter((b) => b.customerId === id).forEach((b) => {
        b.customerId = null;
        b.customerName = 'Deleted customer';
        b.customerEmail = '';
        b.customerPhone = '';
        b.notes = '';
    });
    DB.notes.filter((n) => n.customerId === id).forEach((n) => { n.customerId = null; });
    DB.customers.splice(DB.customers.indexOf(c), 1);
    persist();
    return true;
}

// AuthService.ExportCustomerData — shaped for a human reading the JSON. No password
// hash, no reset tokens, and no internal notes.
function exportCustomerData(id) {
    const c = customerById(id);
    if (!c) return null;
    const shared = sharedNotesByBooking(id);
    return {
        exportedAt: now().toISOString(),
        account: {
            fullName: c.fullName, email: c.email, phone: c.phone,
            accountCreated: c.createdAt.toISOString(), emailConfirmed: c.emailConfirmed
        },
        bikes: c.bikes.map((b) => ({ makeModel: b.makeModel, added: b.createdAt.toISOString() })),
        bookings: bookingsForCustomer(id).map((b) => ({
            reference: b.reference,
            bookedOn: b.createdAt.toISOString(),
            service: b.serviceName,
            category: b.serviceCategory,
            priceEstimate: b.servicePrice,
            appointmentDate: isoDate(b.slotDate),
            appointmentTime: b.slotTime,
            bike: b.bikeDescription,
            notes: b.notes,
            status: b.status,
            photoCount: b.photos.length,
            // Bodies only — the export has always been the text, and the date the
            // note was written is the account page's business.
            serviceNotes: (shared[b.id] || []).map((n) => n.body)
        }))
    };
}

function updateServicePrice(id, price) {
    const s = DB.services.find((x) => x.id === id);
    if (!s) return false;
    s.currentPrice = price;
    persist();
    return true;
}

function saveStaffMember(edited) {
    const s = staffById(edited.id);
    if (!s) return false;
    Object.assign(s, edited);
    persist();
    return true;
}

function addStaff(model, password) {
    if (!model.fullName.trim()) return { error: 'Please enter a name.' };
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(model.email)) return { error: 'Please enter a valid email address.' };
    if ((password || '').length < MIN_PASSWORD_LENGTH)
        return { error: 'Password must be at least ' + MIN_PASSWORD_LENGTH + ' characters.' };
    if (DB.staff.some((s) => s.email.toLowerCase() === model.email.trim().toLowerCase()))
        return { error: 'A staff member with that email already exists.' };

    DB.staff.push({
        id: uid('staff'), fullName: model.fullName.trim(), email: model.email.trim(),
        role: model.role, isActive: true, createdAt: now(),
        canViewAllBookings: false, canManageBookings: true, canViewCustomerDetails: false,
        isMechanic: !!model.isMechanic
    });
    persist();
    return { ok: true };
}

/* ============================================================
   Persistence — localStorage, so edits survive a reload
   ============================================================ */

const STORAGE_KEY = 'fixlosophy-demo-v1';
let persistEnabled = true;

// Dates don't survive JSON, so they're revived by key name on the way back in.
const DATE_KEYS = ['createdAt', 'slotDate', 'appliedAt', 'readAt', 'handledAt',
                   'preferredDate', 'lastVisit', 'firstVisit', 'memberSince',
                   'startDate', 'endDate'];

function persist() {
    if (!persistEnabled) return;
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ db: DB, uidCounter, session: state.session }));
    } catch (e) {
        // A private window, or storage disabled. The demo works fine without it —
        // it just forgets on reload.
        persistEnabled = false;
    }
}

function restore() {
    let raw = null;
    try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { return false; }
    if (!raw) return false;
    try {
        const saved = JSON.parse(raw, (key, value) =>
            DATE_KEYS.includes(key) && typeof value === 'string' ? new Date(value) : value);
        if (!saved || !saved.db || !Array.isArray(saved.db.bookings)) return false;
        Object.assign(DB, saved.db);
        uidCounter = saved.uidCounter || 0;
        if (saved.session) state.session = saved.session;
        return true;
    } catch (e) {
        return false;
    }
}

function resetDemo() {
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) { /* nothing to clear */ }
    seed();
    state.session = { kind: 'guest', id: null };
    Object.assign(state, freshUiState());
    persist();
    location.hash = '#/';
    render();
    toast('Demo data reset.');
}

function icon(name, opts) {

// ── Photography stand-in ────────────────────────────────────
// The shop photos live in a public Supabase bucket. A page opened from disk can
// reach it; a sandboxed embed can't, and the real site's onerror handlers simply
// hide the image — which would leave the gallery empty and untestable. So a failed
// load is swapped for a drawn placeholder instead of vanishing.
function placeholderSvg(label, w, h) {
    const svg =
        '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '">' +
        '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
        '<stop offset="0" stop-color="#1d2a1f"/><stop offset="1" stop-color="#121212"/></linearGradient></defs>' +
        '<rect width="' + w + '" height="' + h + '" fill="url(#g)"/>' +
        '<g stroke="#3DBB48" stroke-opacity="0.55" fill="none" stroke-width="3" ' +
        'transform="translate(' + (w / 2 - 60) + ',' + (h / 2 - 40) + ') scale(5)">' +
        '<circle cx="5.5" cy="17" r="3.5"/><circle cx="18.5" cy="17" r="3.5"/>' +
        '<path d="M5.5 17l4.5-9h5l3.5 9"/><path d="M10 8l4.5 9"/><path d="M13.5 5H16"/></g>' +
        '<text x="50%" y="' + (h - 26) + '" text-anchor="middle" fill="#7a7a7a" ' +
        'font-family="Helvetica,Arial,sans-serif" font-size="' + Math.max(13, Math.round(w / 42)) + '">' +
        esc(label) + '</text></svg>';
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

// A listener rather than an onerror attribute: inline handlers are blocked outright
// under a strict CSP, which is exactly the sandboxed context where the photos can't
// load in the first place. `error` doesn't bubble, so this captures.
document.addEventListener('error', (e) => {
    const el = e.target;
    if (!el || el.tagName !== 'IMG' || el.dataset.fallbackApplied) return;
    el.dataset.fallbackApplied = '1';               // never loop

    if (el.dataset.fallback === 'logo') {
        // The wordmark falls back to the text the real Logo component uses.
        el.style.display = 'none';
        if (el.nextElementSibling) el.nextElementSibling.style.display = 'inline';
        return;
    }
    el.classList.add('demo-photo');
    el.src = placeholderSvg(el.dataset.label || 'Shop photo',
                            parseInt(el.getAttribute('width'), 10) || 1200,
                            parseInt(el.getAttribute('height'), 10) || 900);
}, true);

// A site photo: the real URL, with the drawn stand-in behind it.
function photo(path, alt, w, h, extra) {
    return '<img src="' + esc(img(path)) + '" alt="' + esc(alt) + '" ' +
        'width="' + w + '" height="' + h + '" decoding="async" ' +
        'data-fallback="photo" data-label="' + esc(alt) + '" ' +
        (extra || '') + ' />';
}

// A customer's uploaded photo — never real, always drawn.
const uploadedPhotoUrl = (p) => p.dataUrl || placeholderSvg(p.label || 'Issue photo', 600, 450);

const logoImg = (imgClass, fallbackClass) =>
    '<img src="' + esc(LOGO_URL) + '" alt="Fixlosophy" class="' + esc(imgClass) + '" ' +
    'data-fallback="logo" />' +
    '<span class="' + esc(fallbackClass || '') + '" style="display:none">Fixlosophy</span>';

// ── Toast ───────────────────────────────────────────────────
// Stands in for the things the real app does out of band: the confirmation email,
// the notification push to the shop, the file download.
let toastTimer = null;
function toast(message, kind) {
    const el = document.getElementById('demo-toast');
    el.className = cls('demo-toast', kind === 'warn' && 'demo-toast--warn');
    el.textContent = message;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, 4200);
}

const pageHero = (eyebrow, title, sub, modifier) =>
    '<div class="page-hero page-hero--sm ' + (modifier || '') + '"><div class="container">' +
    '<p class="section-eyebrow">' + esc(eyebrow) + '</p><h1>' + title + '</h1>' +
    (sub ? '<p>' + sub + '</p>' : '') + '</div></div>';

const statusBadge = (status) =>
    '<span class="status-badge status-badge--' + statusClass(status) + '">' + statusLabel(status) + '</span>';

const refBadge = (reference) => '<span class="ref-badge">' + esc(reference) + '</span>';

// MaintenanceJobs.LateAfter — how long past the slot before somebody counts as late.
const LATE_AFTER_MINUTES = 20;

// Admin's IsLate(Booking): the slot has come and gone with the bike not booked in.
// Derived rather than stored, so it's right the moment the page renders — the real
// site raises the bell for the same condition on a timer, but the badge shouldn't
// wait on a tick.
const isLate = (b) =>
    (b.status === STATUS.Pending || b.status === STATUS.Confirmed) &&
    now() - slotStart(b) >= LATE_AFTER_MINUTES * 60 * 1000;

// Amber rather than red on purpose: most late arrivals turn up, so this is a prompt to
// ring them, not a verdict. Not a status — a derived "where is this bike?".
const lateBadge = (b) => (isLate(b)
    ? '<span class="status-badge status-badge--late" ' +
      'title="Slot has passed and the bike isn\'t booked in">Not arrived</span>'
    : '');

// Same normalisation the real action buttons use: wa.me wants international format
// with no '+' or leading zero, and a bare national number is assumed to be UK.
function whatsAppHref(phone) {
    const digits = (phone || '').replace(/\D/g, '');
    const international = digits.startsWith('00') ? digits.slice(2)
                        : digits.startsWith('0') ? '44' + digits.slice(1)
                        : digits;
    return 'https://wa.me/' + international;
}
const telHref = (phone) => (phone || '').replace(/[^\d+]/g, '');

// Admin.razor's WhatsAppHref(Booking) — the booking version carries a prefilled
// message naming the customer, reference, service and slot. CustomerDetailPanel's
// phone-only variant above is the one without it; the demo used to use that for both,
// so the dashboard's WhatsApp button opened an empty chat.
function whatsAppBookingHref(b) {
    const msg = 'Hi ' + b.customerName + ', this is Fixlosophy about your booking ' + b.reference +
                ' (' + b.serviceName + ') on ' + fmt.ddddDMMMMPlain(b.slotDate) + ' at ' + b.slotTime + '.';
    return whatsAppHref(b.customerPhone) + '?text=' + encodeURIComponent(msg);
}

// Contact.ContactModel's data annotations, as validation.
function submitContact() {
    const m = state.contact;
    const errors = {};
    if (!m.name.trim()) errors.name = 'Please enter your name.';
    if (!m.email.trim()) errors.email = 'Please enter your email.';
    else if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m.email)) errors.email = 'Please enter a valid email.';
    if (!m.message.trim()) errors.message = 'Please tell us what you\'d like to know.';
    else if (m.message.trim().length < 10) errors.message = 'Please give us a bit more detail.';

    state.contactErrors = errors;
    if (Object.keys(errors).length) { render(); return; }

    // service/preferredDate stay unset — they came off the form when it stopped being
    // a second booking flow. The fields remain on Enquiry so stored ones keep theirs.
    submitEnquiry({
        name: m.name, email: m.email, phone: m.phone,
        bikeDescription: m.bike, message: m.message
    });
    state.contactSubmittedName = m.name;
    state.contactSubmitted = true;
    state.contact = freshUiState().contact;
    render();
    toast('Enquiry stored and the shop notified — check the admin bell.');
}

/* ── Auth actions ──────────────────────────────────────────── */

function doCustomerSignIn() {
    const email = state.auth.email.trim().toLowerCase();
    const customer = DB.customers.find((c) => c.email.toLowerCase() === email);

    if (!customer || state.auth.password !== DEMO_PASSWORD) {
        state.auth.error = 'invalid';
        state.auth.notice = null;
        render();
        return;
    }
    // Unverified accounts are refused sign-in, with a resend offered.
    if (!customer.emailConfirmed) {
        state.auth.error = 'unverified';
        state.auth.notice = null;
        render();
        return;
    }
    signIn('customer', customer.id);
    navigate(state.returnUrl || '#/account');
    state.returnUrl = null;
    toast('Signed in as ' + customer.fullName + '.');
}

function doStaffSignIn() {
    const email = state.auth.email.trim().toLowerCase();
    const staff = DB.staff.find((s) => s.email.toLowerCase() === email);

    if (!staff || state.auth.password !== DEMO_PASSWORD) {
        state.auth.error = 'invalid';
        render();
        return;
    }
    if (!staff.isActive) {
        state.auth.error = 'inactive';
        render();
        return;
    }
    signIn('staff', staff.id);
    navigate('#/admin');
    toast('Signed in as ' + staff.fullName + ' (' + staff.role + ').');
}

function doRegister() {
    const a = state.auth;
    if (!a.name.trim()) { a.error = 'Please enter your name.'; render(); return; }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(a.email)) { a.error = 'Please enter a valid email address.'; render(); return; }
    if (!isValidPhone(a.phone)) { a.error = 'Please enter a valid phone number.'; render(); return; }
    if (a.password.length < MIN_PASSWORD_LENGTH) {
        a.error = 'Password must be at least ' + MIN_PASSWORD_LENGTH + ' characters.'; render(); return;
    }
    if (DB.customers.some((c) => c.email.toLowerCase() === a.email.trim().toLowerCase())) {
        a.error = 'An account with that email already exists.'; render(); return;
    }

    const customer = {
        id: uid('cust'), fullName: a.name.trim(), email: a.email.trim(), phone: a.phone.trim(),
        createdAt: now(), emailConfirmed: false, bikes: []
    };
    DB.customers.push(customer);

    // AuthService.LinkGuestBookings — bookings made under this address before the
    // account existed become theirs once they've proved they own the email.
    DB.bookings
        .filter((b) => !b.customerId && b.customerEmail.toLowerCase() === customer.email.toLowerCase())
        .forEach((b) => { b.customerId = customer.id; });

    persist();
    a.error = null;
    a.password = '';
    state.pendingVerificationId = customer.id;
    navigate('#/account/register-confirmation');
    toast('Account created. Verification email sent (demo: use the link on this page).');
}

function doDemoVerify() {
    const c = customerById(state.pendingVerificationId) ||
              DB.customers.find((x) => x.email.toLowerCase() === state.auth.email.trim().toLowerCase());
    if (c) { c.emailConfirmed = true; persist(); }
    state.auth.notice = 'verified';
    state.auth.error = null;
    navigate('#/account/login');
}

/* ============================================================
   Book.razor — the five-step booking wizard
   ============================================================ */

const categoryIcon = (category) => ({
    'Servicing Packages': 'wrench',
    'Specialist': 'bolt',
    'Components': 'link'
}[category] || 'wrench');

function viewBook() {
    const b = state.book;
    const customer = currentCustomer();

    // Prefill from the account the first time the page is opened while signed in.
    if (customer && !b.prefilled) {
        b.prefilled = true;
        b.name = customer.fullName;
        b.email = customer.email;
        b.phone = customer.phone;
        // Only auto-fill the bike when there's exactly one saved.
        b.bike = customer.bikes.length === 1 ? customer.bikes[0].makeModel : '';
    }

    // A signed-in customer's cap is known from step 1; a guest's only once they've
    // typed an email on step 3, which bookValidateDetails fills in.
    if (customer) b.upcomingCount = countUpcomingForEmail(customer.email);
    const atLimit = (b.upcomingCount || 0) >= MAX_ACTIVE_BOOKINGS_PER_EMAIL;

    let body = '';
    if (b.step === 1) body = bookStep1(atLimit);
    else if (b.step === 2) body = bookStep2();
    else if (b.step === 3) body = bookStep3(customer);
    else if (b.step === 4) body = bookStep4(atLimit);
    else body = bookConfirmed();

    const limitNotice = (b.step < 5 && atLimit)
        ? '<div class="booking-limit-notice">' +
            '<h2>You already have ' + b.upcomingCount + ' upcoming bookings</h2>' +
            '<p>That\'s the most we hold for one email at a time, so slots stay free for ' +
            'everyone. Cancel one and you can book again straight away.</p>' +
            (customer
              ? '<a href="#/account" class="btn btn-primary" data-nav>View my bookings</a>'
              : '<a href="tel:' + SITE.phoneE164 + '" class="btn btn-primary">' +
                icon('phone') + ' Call us on ' + SITE.phoneDisplay + '</a>') +
          '</div>'
        : '';

    return '' +
    pageHero('Online Booking', 'Book a Repair',
             'Pick your service, choose a time, and we\'ll have you back on the road.') +
    '<section class="section booking-section"><div class="container">' +
      (b.step < 5 ? customerAuthStrip(customer) + limitNotice + stepsIndicator(b.step) : '') +
      body +
    '</div></section>';
}

function customerAuthStrip(customer) {
    return '<div class="customer-auth-strip">' +
        (customer
            ? '<span>Signed in as <strong>' + esc(customer.fullName) + '</strong></span>'
            : '<span>Have an account? <a class="customer-auth-strip__link" href="#/account/login" ' +
              'data-nav data-returnurl="#/book">Sign in for faster checkout</a></span>') +
    '</div>';
}

function stepsIndicator(step) {
    const labels = ['Service', 'Schedule', 'Details', 'Review'];
    return '<div class="steps-indicator">' + labels.map((label, idx) => {
        const i = idx + 1;
        const cssState = step === i ? 'active' : step > i ? 'done' : '';
        return '<div class="step-indicator ' + cssState + '">' +
                 '<div class="step-indicator__dot"><span>' + (step > i ? icon('check') : i) + '</span></div>' +
                 '<span class="step-indicator__label">' + label + '</span>' +
               '</div>' +
               (i < 4 ? '<div class="step-indicator__line ' + (step > i ? 'done' : '') + '"></div>' : '');
    }).join('') + '</div>';
}

function bookStep1(atLimit) {
    const services = serviceOptions();
    const categories = [...new Set(services.map((s) => s.category))];
    const selected = state.book.service;

    const groups = categories.map((category) =>
        '<div class="service-category-group">' +
          '<h3 class="service-category-label">' + esc(category) + '</h3>' +
          '<div class="service-pick-grid">' +
            services.filter((s) => s.category === category).map((svc) => {
                const isSelected = !!selected && selected.name === svc.name;
                return '<button type="button" class="service-pick-card ' + (isSelected ? 'selected' : '') + '" ' +
                    'aria-pressed="' + isSelected + '" data-act="pick-service" data-name="' + esc(svc.name) + '">' +
                    '<span class="service-pick-card__icon">' + icon(categoryIcon(svc.category)) + '</span>' +
                    '<span class="service-pick-card__info"><strong>' + esc(svc.name) + '</strong>' +
                      '<span>' + esc(svc.duration) + '</span></span>' +
                    '<span class="service-pick-card__price">' +
                      (svc.priceFrom > 0 ? 'From £' + svc.priceFrom : 'Quote') + '</span>' +
                    (isSelected ? '<span class="service-pick-card__check">' + icon('check') + '</span>' : '') +
                    '</button>';
            }).join('') +
          '</div>' +
        '</div>').join('');

    return '<div class="booking-card">' +
        '<h2 class="booking-card__title">Choose a Service</h2>' +
        '<p class="booking-card__subtitle">Select the type of repair or service you need.</p>' +
        groups +
        '<div class="booking-nav"><span></span>' +
          '<button class="btn btn-primary btn-lg" data-act="book-step2" ' +
            (selected && !atLimit ? '' : 'disabled') + '>' +
            'Continue ' + icon('arrow-right') + '</button>' +
        '</div>' +
    '</div>';
}

function bookStep2() {
    const b = state.book;
    const month = b.calendarMonth;
    const availability = monthAvailability(month.getFullYear(), month.getMonth());
    const daysInMonth = new Date(month.getFullYear(), month.getMonth() + 1, 0).getDate();
    // Monday-first, like the real calendar.
    const firstDay = new Date(month.getFullYear(), month.getMonth(), 1).getDay();
    const offset = firstDay === 0 ? 6 : firstDay - 1;

    let cells = ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su']
        .map((d) => '<div class="cal-head">' + d + '</div>').join('');
    for (let i = 0; i < offset; i++) cells += '<div class="cal-day cal-day--empty"></div>';

    for (let d = 1; d <= daysInMonth; d++) {
        const date = new Date(month.getFullYear(), month.getMonth(), d);
        const day = availability[isoDate(date)];
        const available = day.bookable;
        const isSelected = !!b.date && sameDay(b.date, date);
        const isToday = sameDay(date, today());

        // Why the day is unavailable, when there's a reason worth giving. "Closed —
        // Bank holiday" and "fully booked" are different disappointments: one means
        // try tomorrow, the other means try a different time today. A grey square says
        // neither. Null for an ordinary full day, which the legend already explains.
        const closedLabel = day.state === DAY_STATE.Past ? null : day.label;

        const css = cls('cal-day',
            isSelected && 'cal-day--selected',
            isToday && !isSelected && 'cal-day--today',
            available ? 'cal-day--available' : 'cal-day--disabled',
            closedLabel && 'cal-day--closed');
        // The reason goes on the title and the aria-label both, so it reaches a
        // pointer and a screen reader alike — the day is disabled, so there is nowhere
        // else for it to be said.
        cells += '<button type="button" class="' + css + '" ' + (available ? '' : 'disabled') +
            ' aria-pressed="' + isSelected + '"' +
            (closedLabel ? ' title="' + esc(closedLabel) + '"' : '') +
            ' aria-label="' + esc(fmt.ddddDMMMMyyyy(date) +
                (closedLabel ? ' — ' + closedLabel : '')) + '"' +
            ' data-act="pick-day" data-date="' + isoDate(date) + '">' + d + '</button>';
    }

    const atFirstMonth = month.getFullYear() === today().getFullYear() && month.getMonth() === today().getMonth();

    const slots = b.date ? availableSlots(b.date) : [];
    const slotPanel = !b.date
        ? '<div class="timeslot-prompt"><span>' + icon('calendar') + '</span>' +
          '<p>Select a date to see available time slots.</p></div>'
        : '<h4>' + esc(fmt.ddddDMMMM(b.date)) + '</h4>' +
          (slots.length === 0
            ? '<p class="timeslot-none">No slots available for this date. Please pick another day.</p>'
            : '<div class="timeslot-grid">' + slots.map((s) =>
                '<button type="button" class="timeslot ' + (b.time === s ? 'timeslot--selected' : '') + '" ' +
                'aria-pressed="' + (b.time === s) + '" data-act="pick-time" data-time="' + s + '">' + s + '</button>'
              ).join('') + '</div>');

    return '<div class="booking-card">' +
        '<h2 class="booking-card__title">Pick a Date &amp; Time</h2>' +
        '<p class="booking-card__subtitle">We\'re open ' + SITE.hoursDisplay.join(' · ') + '.</p>' +
        '<div class="schedule-grid">' +
          '<div class="calendar-wrapper">' +
            '<div class="cal-nav">' +
              '<button class="cal-nav__btn" data-act="cal-prev" ' + (atFirstMonth ? 'disabled' : '') +
                ' aria-label="Previous month">' + icon('chevron-left') + '</button>' +
              '<span class="cal-nav__title">' + fmt.MMMMyyyy(month) + '</span>' +
              '<button class="cal-nav__btn" data-act="cal-next" aria-label="Next month">' +
                icon('chevron-right') + '</button>' +
            '</div>' +
            '<div class="cal-grid">' + cells + '</div>' +
            '<div class="cal-legend">' +
              '<span class="cal-legend__dot cal-legend__dot--available"></span> Available' +
              '<span class="cal-legend__dot cal-legend__dot--selected"></span> Selected' +
              '<span class="cal-legend__dot cal-legend__dot--disabled"></span> Unavailable' +
              // A struck-through number rather than a dot: it mirrors what a closed
              // day actually looks like in the grid above.
              '<span class="cal-legend__closed">00</span> Closed' +
            '</div>' +
          '</div>' +
          '<div class="timeslot-wrapper">' + slotPanel + '</div>' +
        '</div>' +
        '<div class="booking-nav">' +
          '<div class="booking-nav__left">' +
            '<button class="btn btn-outline" data-act="book-step" data-step="1">' + icon('arrow-left') + ' Back</button>' +
            '<button class="btn btn-ghost" data-act="book-restart">Start over</button>' +
          '</div>' +
          '<button class="btn btn-primary btn-lg" data-act="book-step3" ' +
            (b.date && b.time ? '' : 'disabled') + '>Continue ' + icon('arrow-right') + '</button>' +
        '</div>' +
    '</div>';
}

function bookValidateDetails() {
    const b = state.book;
    const customer = currentCustomer();
    b.error = null;
    if (!b.name.trim()) { b.error = 'Please enter your name.'; return false; }
    const email = customer ? customer.email : b.email;
    // Was a bare includes('@'), which "@" on its own passed.
    if (!isValidEmail(email)) { b.error = 'Please enter a valid email address.'; return false; }
    // The shop rings or texts when the bike is ready, so a reachable number is
    // required — isValidPhone rejects "call me" and similar, which would otherwise
    // produce a dead Call button in the dashboard.
    if (!isValidPhone(b.phone)) { b.error = 'Please enter a phone number we can reach you on.'; return false; }

    // A guest's email is only known here, so this is the earliest their cap can be
    // asked about — still ahead of the review screen. Kept on this step rather than
    // advancing, so a mistyped address can be corrected.
    if (!customer) {
        b.upcomingCount = countUpcomingForEmail(email);
        if (b.upcomingCount >= MAX_ACTIVE_BOOKINGS_PER_EMAIL) {
            b.error = 'This email already has ' + MAX_ACTIVE_BOOKINGS_PER_EMAIL +
                      ' upcoming bookings. Cancel one from your account, or call us on ' +
                      SITE.phoneDisplay + '.';
            return false;
        }
    }
    return true;
}

function bookConfirm() {
    const b = state.book;
    const customer = currentCustomer();
    b.error = null;

    const result = createBooking({
        customerName: b.name,
        // A signed-in customer books against their own account address, whatever the
        // field says — otherwise anyone with an account could send shop-branded mail
        // to an arbitrary recipient.
        customerEmail: customer ? customer.email : b.email,
        customerPhone: b.phone,
        serviceCategory: b.service.category,
        serviceName: b.service.name,
        servicePrice: b.service.priceFrom,
        slotDate: b.date,
        slotTime: b.time,
        bikeDescription: b.bike,
        notes: b.notes,
        customerId: customer ? customer.id : null,
        photos: b.photos
    });

    if (result.error) { b.error = result.error; render(); return; }

    b.confirmed = result.booking;
    b.step = 5;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    toast('Booking ' + result.booking.reference + ' created — confirmation email sent, shop notified.');
}

// StorageService.ValidatePhoto, applied to the files the picker hands over.
const ALLOWED_PHOTO_TYPES = ['image/jpeg', 'image/png', 'image/webp', 'image/heic'];
const MAX_PHOTO_BYTES = 8 * 1024 * 1024;
const MAX_TOTAL_PHOTO_BYTES = 16 * 1024 * 1024;

function addPhotos(fileList) {
    const b = state.book;
    b.photoError = null;
    const files = Array.from(fileList);

    if (b.photos.length + files.length > MAX_PHOTOS) {
        b.photoError = 'You can attach up to ' + MAX_PHOTOS + ' photos in total.';
        render();
        return;
    }

    let pending = files.length;
    if (!pending) return;

    files.forEach((file) => {
        const totalSoFar = b.photos.reduce((sum, p) => sum + p.size, 0);
        if (ALLOWED_PHOTO_TYPES.indexOf(file.type) < 0) {
            b.photoError = 'Photos must be JPEG, PNG, WebP or HEIC.';
            if (--pending === 0) render();
            return;
        }
        if (file.size > MAX_PHOTO_BYTES) {
            b.photoError = 'Each photo must be under 8 MB.';
            if (--pending === 0) render();
            return;
        }
        if (totalSoFar + file.size > MAX_TOTAL_PHOTO_BYTES) {
            b.photoError = 'Those photos come to more than 16 MB in total. Please attach fewer, or smaller ones.';
            if (--pending === 0) render();
            return;
        }
        // Read it here so the admin dashboard can show the real thumbnail later —
        // the equivalent of the upload to the private Supabase bucket.
        const reader = new FileReader();
        reader.onload = () => {
            b.photos.push({ name: file.name, size: file.size, dataUrl: reader.result });
            if (--pending === 0) render();
        };
        reader.onerror = () => {
            b.photoError = 'One of the selected photos couldn\'t be read.';
            if (--pending === 0) render();
        };
        reader.readAsDataURL(file);
    });
}

// BookingService.IsUpcoming — status first, and the date only decides the jobs still
// open. On the date alone a job completed on its own appointment day stayed under
// "Upcoming Bookings", where the mechanic's report on it was never rendered.
function isUpcoming(b) {
    return b.status !== STATUS.Completed && b.status !== STATUS.Cancelled
        && dateOnly(b.slotDate) >= today();
}

// is the more useful half anyway: the point is what the file contains.

          '</div>' +
          '<button class="demo-export__close" data-act="export-close" aria-label="Close">&times;</button></div>' +
          '<pre class="demo-export__json" tabindex="0">' + esc(json) + '</pre>' +
          '<div class="demo-export__actions">' +
            '<button class="btn btn-primary" data-act="export-copy">Copy JSON</button>' +
            '<button class="btn btn-outline" data-act="export-close">Close</button>' +

        '</div>' +
      '</div>';
}

function exportCopy() {
    const el = document.querySelector('.demo-export__json');
    if (!el) return;

    // Selecting the text is a fallback, not an error path: the clipboard API needs a
    // secure context and a permission the embed may not carry.
    const selectInstead = () => {
        const range = document.createRange();
        range.selectNodeContents(el);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        el.focus();
        toast('Clipboard blocked here — the export is selected, so copy it with Ctrl/⌘ + C.', 'warn');
    };

    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(state.account.exportJson)
            .then(() => toast('Data export copied.'), selectInstead);
    } else {
        selectInstead();
    }
}

function accountDelete() {
    const id = state.session.id;
    if (!deleteCustomerAccount(id)) {
        state.account.deleteError = 'We couldn\'t delete the account just now. Please try again, or email ' +
            SITE.email + ' and we\'ll do it for you.';

        return;

    signOut();
    navigate('#/');
    toast('Account deleted. Past bookings kept, anonymised — see them in the admin dashboard.');
}
